[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
stitchwort-syntax = { path = "crates/syntax" }
stitchwort-core = { path = "crates/core" }
stitchwort-elab = { path = "crates/elab" }
stitchwort-js = { path = "crates/js" }
stitchwort-rt = { path = "crates/rt" }
stitchwort-driver = { path = "crates/driver" }
stitchwort-host = { path = "crates/host" }
stitchwort-standalone = { path = "crates/standalone" }
stitchwort-fmt = { path = "crates/fmt" }
stitchwort-native = { path = "crates/native" }

ariadne = "0.6.0"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
insta = "1.49.0"
lsp-server = "0.7.9"
# 0.95: later versions replace `url::Url` with a URI type that has no file
# path conversions (rust-analyzer stayed on 0.95 for the same reason).
lsp-types = "=0.95.1"
mimalloc = { version = "0.1.52", default-features = false }
# Terminal settings and signals for `stitchwort run`'s keys mode
# (docs/proposals/terminal-io.md §4.6). Both were already in the tree, through
# rustyline and tempfile.
nix = { version = "0.31.3", default-features = false, features = ["term", "signal"] }
num-bigint = "0.5.1"
# Writing `program.o` for `stitchwort build` (docs/proposals/standalone-
# executables.md §4): the major version cranelift-object uses.
object = { version = "0.40.0", default-features = false }
num-traits = "0.2.19"
rustix = { version = "1.1.5", features = ["termios"] }
rustyline = "18.0.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
smallvec = "1.16.3"

[workspace.lints.rust]
# `unsafe` is allowed where there's a compelling engineering reason: mark the
# item `#[allow(unsafe_code)]` and explain why it's needed and why it's sound.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3
