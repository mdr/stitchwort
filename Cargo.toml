[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
stitchwort-syntax = { path = "crates/syntax" }
stitchwort-core = { path = "crates/core" }
stitchwort-elab = { path = "crates/elab" }
stitchwort-js = { path = "crates/js" }

ariadne = "0.6.0"
clap = { version = "4.6.7", features = ["derive"] }
insta = "1.49.0"
rustyline = "18.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3
