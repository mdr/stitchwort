  const validHere = (idx) => stdView ? idx.day === (project ? project.day : null) : validFor(idx, openPath());
  const failedNow = () => nav.failed && sameInputs(nav.failed, inputsNow());

  /** The index for the current text: computed if it isn't yet (null if the compiler couldn't). */
  function ensureIndex() {
    const now = inputsNow();
    if (nav.index && sameInputs(nav.index, now)) return Promise.resolve(nav.index);
    if (nav.pending && sameInputs(nav.pending.inputs, now)) return nav.pending.promise;
    if (failedNow()) return Promise.resolve(nav.index);
    const request = requestFor("index");
    const promise = (async () => {
      let result = await indexer.call(request, CHECK_SECONDS);
      if (fallBack(result)) result = await indexer.call(request, CHECK_SECONDS);
      if (result.out) {
        const byFile = new Map();
        result.out.refs.forEach((ref) => {
          if (!byFile.has(ref.file)) byFile.set(ref.file, []);
          byFile.get(ref.file).push(ref);
        });
        nav.index = { out: result.out, byFile, ...now };
        nav.failed = null;
      } else if (!result.cancelled) {
        nav.failed = now;
      }
      if (nav.pending?.promise === promise) nav.pending = null;
      return nav.index;
    })();
    nav.pending = { inputs: now, promise };
    return promise;
  }

  /** The ref (and its offsets in the editor) at an offset of the open file or library file, or null. */
  function lookupAt(idx, offset) {
    const path = openPath();
    if (!validHere(idx)) return null;
    const file = idx.out.files.findIndex((f) => stdView ? f.std === stdView.std : f.path === path && !f.std);
    const refs = idx.byFile.get(file);
    if (!refs) return null;
    const text = source.value;
    const [line, ch] = posOf(text, offset);
    const before = (l, c, r) => l < r[0] || (l === r[0] && c < r[1]); // (l, c) is before the range's start
    let lo = 0, hi = refs.length - 1, at = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (before(line, ch, refs[mid].range)) hi = mid - 1; else { at = mid; lo = mid + 1; }
    }
    if (at < 0) return null;
    const ref = refs[at];
    const end = ref.range;
    if (line > end[2] || (line === end[2] && ch >= end[3])) return null;
    return { ref, idx, from: offsetOf(text, end[0], end[1]), to: offsetOf(text, end[2], end[3]) };
  }

  /** Where a ref goes, with what to say about it. */
  function targetOf(idx, ref) {
    if (ref.symbol !== undefined) {
      const s = idx.out.symbols[ref.symbol];
      return { file: s.file, range: s.range, name: s.name, kind: s.kind, type: ref.type ?? s.type };
    }
    return { file: ref.binder.file, range: ref.binder.range, name: ref.binder.name, kind: "local", type: ref.type };
  }

  // The hover tooltip ------------------------------------------------------

  function hideTip() {
    clearTimeout(nav.tipTimer);
    navtip.hidden = true;
  }
  function showTip() {
    const hover = nav.hover;
    if (!hover) return;
    const { name, kind, type } = targetOf(hover.idx, hover.ref);
    navtip.replaceChildren(el("span", { className: "name" }, name), el("span", { className: "kind" }, " " + kind),
                           ...(type ? [document.createTextNode("\n: " + type)] : []));
    navtip.hidden = false;
    const r = rectOf(hover.from, hover.to);
    if (!r) return;
    const w = navtip.offsetWidth, h = navtip.offsetHeight;
    const left = Math.max(8, Math.min(r.left, innerWidth - w - 8));
    const top = r.bottom + 4 + h > innerHeight - 8 ? Math.max(8, r.top - h - 4) : r.bottom + 4;
    navtip.style.left = `${left}px`;
    navtip.style.top = `${top}px`;
  }

  /** Underlines the hovered name while Cmd/Ctrl is held, as an editor does a link. */
  function showLink() {
    const hover = nav.hover;
    const r = hover && nav.mod ? rectOf(hover.from, hover.to) : null;
    source.style.cursor = r ? "pointer" : "";
    navlink.hidden = !r;
    if (!r) return;
    const box = editorBox.getBoundingClientRect();
    Object.assign(navlink.style, { left: `${r.left - box.left}px`, top: `${r.top - box.top}px`,
                                   width: `${r.width}px`, height: `${r.height}px` });
  }

  function setHover(hit) {
    if ((hit?.ref ?? null) !== (nav.hover?.ref ?? null) || hit?.idx !== nav.hover?.idx) {
      nav.hover = hit;
      hideTip();
      if (hit) nav.tipTimer = setTimeout(showTip, 300);
    }
    showLink();
  }

  function updateNav() {
    const p = nav.pointer;
    let hit = null;
    if (p) {
      const offset = offsetAt(p.x, p.y);
      if (offset !== null) {
        if (nav.index && validHere(nav.index)) {
          hit = lookupAt(nav.index, offset);
        } else if (!failedNow()) {
          // Wait for the index, then look again (only if it helps: no loop).
          ensureIndex().then((idx) => { if (idx && validHere(idx)) scheduleNav(); });
        }
      }
    }
    setHover(hit);
  }
  function scheduleNav() {
    nav.frame ||= requestAnimationFrame(() => { nav.frame = 0; updateNav(); });
  }
  function setMod(on) {
    if (nav.mod === on) return;
    nav.mod = on;
    showLink();
  }

  // Going there ------------------------------------------------------------

  /** Selects the range of the editor's text and scrolls it into view. */
  function reveal(range) {
    const text = source.value;
    const from = offsetOf(text, range[0], range[1]);
    const to = offsetOf(text, range[2], range[3]);
    source.focus({ preventScroll: true });
    source.setSelectionRange(from, to);
    const css = getComputedStyle(source);
    const y = parseFloat(css.paddingTop) + range[0] * parseFloat(css.lineHeight);
    if (y < source.scrollTop || y + parseFloat(css.lineHeight) > source.scrollTop + source.clientHeight) {
      source.scrollTop = Math.max(0, y - source.clientHeight / 3);
    }
    align();
    const r = rectOf(from, to);
    const box = source.getBoundingClientRect();
    if (r && (r.right > box.right - 24 || r.left < box.left + 8)) {
      source.scrollLeft = Math.max(0, source.scrollLeft + r.left - box.left - 80);
      align();
    }
  }

  /** Shows a file's range: another file of the project, or the open one (leaving a library file). */
  function openAt(path, range) {
    if (project ? !project.texts.has(path) : path !== SINGLE) return false;
    exitStd();
    if (project && project.open !== path) openFile(path);
    reveal(range);
    return true;
  }

  /**
   * Shows a library file's text, read-only; `exitStd` puts the editor back.
   * Already showing one, it shows another in its place (the editor's own state
   * stays stashed): navigation goes on from file to file of the library.
   */
  function showStd(std, text) {
    if (!stdView) {
      const stash = { value: source.value, start: source.selectionStart, end: source.selectionEnd,
                      top: source.scrollTop, left: source.scrollLeft };
      if (project) rememberCaret();
      stdView = { std, stash };
    } else {
      stdView.std = std;
    }
    hideTip();
    hideRefs();
    hideMenu();
    nav.hover = null;
    showLink();
    source.value = text;
    source.readOnly = true;
    source.scrollTop = source.scrollLeft = 0;
    document.getElementById("std-name").textContent = std;
    stdbar.hidden = false;
    paint();
  }
  function exitStd() {
    if (!stdView) return;
    const { stash } = stdView;
    stdView = null;
    source.readOnly = false;
    stdbar.hidden = true;
    source.value = stash.value;
    if (project) {
      showFile();
    } else {
      paint();
      source.setSelectionRange(stash.start, stash.end);
      source.scrollTop = stash.top;
      source.scrollLeft = stash.left;
      align();
    }
  }
  /** The library file's text, as the compiler embeds it (empty if it couldn't be had). */
  async function stdText(std) {
    let text = nav.std.get(std);
    if (text === undefined) {
      let result = await indexer.call({ action: "stdsource", path: std }, CHECK_SECONDS);
      if (fallBack(result)) result = await indexer.call({ action: "stdsource", path: std }, CHECK_SECONDS);
      text = result.out?.text ?? "";
      if (result.out) nav.std.set(std, text);
    }
    return text;
  }
  async function openStd(std, range) {
    const text = await stdText(std);
    if (!text) return false;
    if (stdView?.std !== std) showStd(std, text);
    reveal(range);
    return true;
  }

  /** Remembers where the editor is, to come back to. */
  function pushBack() {
    nav.back.push({ std: stdView?.std ?? null, path: project?.open ?? null, start: source.selectionStart, end: source.selectionEnd,
                    top: source.scrollTop, left: source.scrollLeft });
    if (nav.back.length > 50) nav.back.shift();
  }
  /** Back to where the last jump was made from: a file of the project or of the library. */
  function goBack() {
    const there = nav.back.pop();
    if (!there) {
      exitStd();
      return;
    }
    if (there.std) {
      showStd(there.std, nav.std.get(there.std) ?? ""); // it was shown, so it is kept
    } else {
      exitStd();
      if (project && there.path !== project.open && project.texts.has(there.path)) openFile(there.path);
    }
    source.focus({ preventScroll: true });
    source.setSelectionRange(there.start, there.end);
    source.scrollTop = there.top;
    source.scrollLeft = there.left;
    align();
  }

  /** Goes to the definition of the name at `offset` of the open file (or library file); whether there was one. */
  async function goToDefinition(offset) {
    const idx = await ensureIndex();
    const hit = idx && lookupAt(idx, offset);
    if (!hit) return false;
    const { file, range } = targetOf(idx, hit.ref);
    const target = idx.out.files[file];
    hideTip();
    pushBack();
    const went = target.std ? await openStd(target.std, range) : openAt(target.path, range);
    if (!went) nav.back.pop();
    return went;
  }

  // Find references --------------------------------------------------------
  // Shift+F12 at the caret (or "Find references" in the right-click menu on a
  // name) lists where the name under it is used, in a panel by the name: file
  // and line, with the line's text. Click one (or Enter on it) to go there,
  // with a way back as for a definition. The uses are the index's refs with
  // the same target; the declaration is listed too. Uses inside the library
  // are only counted: there can be thousands, and they aren't the program.

  const navrefs = el("div", { id: "navrefs", role: "dialog", "aria-label": "References", hidden: true });
  const navmenu = el("div", { id: "navmenu", role: "menu", hidden: true });
  document.body.append(navrefs, navmenu);

  /** The most uses in the library listed when the lookup is made from within the library. */
  const LIBRARY_ROWS = 200;

  /**
   * The uses of the target of `ref`: { declaration, uses, library (a count) }.
   * The uses are those in project files; from within the library (`inLibrary`)
   * also the first few in library files, and `library` counts the rest.
   */
  function referencesOf(idx, ref, inLibrary = false) {
    const { out } = idx;
    const t = targetOf(idx, ref);
    const sameTarget = ref.symbol !== undefined
      ? (r) => r.symbol === ref.symbol
      : (r) => r.binder && r.binder.file === ref.binder.file && r.binder.range.join() === ref.binder.range.join();
    const isDeclaration = (file, range) => file === t.file && range.join() === t.range.join();
    const uses = [];
    let library = 0;
    for (const r of out.refs) {
      if (!sameTarget(r) || isDeclaration(r.file, r.range)) continue;
      const f = out.files[r.file];
      if (!f.std) uses.push({ file: r.file, path: f.path, std: null, range: r.range });
      else if (inLibrary && uses.length < LIBRARY_ROWS) uses.push({ file: r.file, path: f.path, std: f.std, range: r.range });
      else library++;
    }
    const f = out.files[t.file];
    const declaration = { file: t.file, path: f.path, std: f.std ?? null, range: t.range };
    return { name: t.name, kind: t.kind, declaration, uses, library };
  }

  function hideRefs() {
    if (navrefs.hidden) return false;
    navrefs.hidden = true;
    return true;
  }
  function hideMenu() { navmenu.hidden = true; }

  /** A row of the panel: where, and the line's text with the name marked. */
  function refRow(idx, use, isDeclaration) {
    const text = (use.std ? nav.std.get(use.std) : idx.texts.get(use.path)) ?? "";
    const range = use.range;
    const raw = text.split("\n")[range[0]] ?? "";
    const lead = raw.length - raw.trimStart().length;
    const shown = raw.trim();
    const clamp = (n) => Math.max(0, Math.min(n, shown.length));
    const from = clamp(range[1] - lead), to = range[0] === range[2] ? clamp(range[3] - lead) : shown.length;
    const label = use.std ? use.std : project ? tabLabel(use.path) : "";
    const row = el("button", { type: "button", className: isDeclaration ? "decl" : "" },
      el("span", { className: "where" }, `${label ? label + ":" : "line "}${range[0] + 1}`),
      el("span", { className: "snippet" }, shown.slice(0, from), el("mark", {}, shown.slice(from, to)), shown.slice(to)));
    row.title = `${use.std ?? use.path}:${range[0] + 1}:${range[1] + 1}`;
    row.addEventListener("click", async () => {
      hideRefs();
      pushBack();
      const went = use.std ? await openStd(use.std, use.range) : openAt(use.path, use.range);
      if (!went) nav.back.pop();
    });
    return el("li", {}, row);
  }

  async function showRefs(idx, hit) {
    hideTip();
    hideMenu();
    const found = referencesOf(idx, hit.ref, !!stdView);
    // The library files' text, for the lines of the rows.
    for (const std of new Set([found.declaration, ...found.uses].map((u) => u.std).filter(Boolean))) await stdText(std);
    const rows = [refRow(idx, found.declaration, true), ...found.uses.map((u) => refRow(idx, u, false))];
    const count = found.uses.length;
    const more = found.library ? `, and ${found.library} ${stdView ? "more " : ""}in the library` : "";
    const close = el("button", { type: "button", title: "Close (Esc)", "aria-label": "Close" }, "×");
    close.addEventListener("click", () => { hideRefs(); source.focus({ preventScroll: true }); });
    navrefs.replaceChildren(
      el("header", {}, el("span", { className: "title" },
        el("span", { className: "name" }, found.name), ` ${found.kind}: ${count === 1 ? "1 use" : `${count} uses`}`,
        el("span", { className: "more" }, more)), close),
      el("ul", {}, ...rows));
    navrefs.hidden = false;
    const r = rectOf(hit.from, hit.to);
    if (r) {
      const w = navrefs.offsetWidth, h = navrefs.offsetHeight;
      navrefs.style.left = `${Math.max(8, Math.min(r.left, innerWidth - w - 8))}px`;
      const top = r.bottom + 4 + h > innerHeight - 8 ? r.top - h - 4 : r.bottom + 4;
      navrefs.style.top = `${Math.max(8, Math.min(top, innerHeight - h - 8))}px`; // on screen even if the name is not
    }
    // The first use, not the declaration, when there is one: that is what was asked.
    (navrefs.querySelectorAll("li button")[found.uses.length ? 1 : 0]).focus({ preventScroll: true });
  }

  /** Lists the uses of the name at `offset` of the open file (or library file); whether there was a name. */
  async function findReferences(offset) {
    const idx = await ensureIndex();
    const hit = idx && lookupAt(idx, offset);
    if (!hit) return false;
    await showRefs(idx, hit);
    return true;
  }

  navrefs.addEventListener("keydown", (e) => {
    const rows = [...navrefs.querySelectorAll("li button")];
    const at = rows.indexOf(document.activeElement);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      rows[(at + (e.key === "ArrowDown" ? 1 : rows.length - 1)) % rows.length]?.focus();
    } else if (e.key === "Escape") {
      e.preventDefault();
      e.stopPropagation();
      hideRefs();
      source.focus({ preventScroll: true });
    }
  });
  // Anywhere else closes the panel and the menu.
  document.addEventListener("mousedown", (e) => {
    if (!navrefs.hidden && !navrefs.contains(e.target)) hideRefs();
    if (!navmenu.hidden && !navmenu.contains(e.target)) hideMenu();
  });

  // The right-click menu, on a name: the two lookups and their keys. Anywhere
  // else the browser's own menu stays.
  source.addEventListener("contextmenu", (e) => {
    if (!nav.index) return;
    const offset = offsetAt(e.clientX, e.clientY);
    const hit = offset !== null && validHere(nav.index) ? lookupAt(nav.index, offset) : null;
    if (!hit) return;
    e.preventDefault();
    hideTip();
    hideRefs();
    const item = (label, key, go) => {
      const b = el("button", { type: "button", role: "menuitem" }, el("span", {}, label), el("span", { className: "key" }, key));
      b.addEventListener("click", () => { hideMenu(); go(offset); });
      return b;
    };
    navmenu.replaceChildren(item("Go to definition", "F12", goToDefinition), item("Find references", "⇧F12", findReferences));
    navmenu.hidden = false;
    navmenu.style.left = `${Math.min(e.clientX, innerWidth - navmenu.offsetWidth - 8)}px`;
    navmenu.style.top = `${Math.min(e.clientY, innerHeight - navmenu.offsetHeight - 8)}px`;
    navmenu.querySelector("button").focus({ preventScroll: true });
  });
  navmenu.addEventListener("keydown", (e) => {
    const rows = [...navmenu.querySelectorAll("button")];
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      rows[(rows.indexOf(document.activeElement) + 1) % rows.length].focus();
    } else if (e.key === "Escape") {
      e.preventDefault();
      hideMenu();
      source.focus({ preventScroll: true });
    }
  });

  editorBox.addEventListener("mouseenter", () => { ensureIndex(); });
  source.addEventListener("mousemove", (e) => {
    nav.pointer = { x: e.clientX, y: e.clientY };
    setMod(e.metaKey || e.ctrlKey);
    scheduleNav();
  });
  source.addEventListener("mouseleave", () => { nav.pointer = null; scheduleNav(); });
  source.addEventListener("mousedown", (e) => {
    hideTip();
    if (e.button !== 0 || !(e.metaKey || e.ctrlKey)) return;
    e.preventDefault(); // no caret move: it's a jump
    const offset = offsetAt(e.clientX, e.clientY);
    if (offset !== null) goToDefinition(offset);
  });
  source.addEventListener("scroll", () => { hideTip(); hideRefs(); hideMenu(); showLink(); });
  source.addEventListener("input", () => { hideTip(); hideRefs(); hideMenu(); nav.hover = null; showLink(); });
  window.addEventListener("keydown", (e) => setMod(e.metaKey || e.ctrlKey));
  window.addEventListener("keyup", (e) => setMod(e.metaKey || e.ctrlKey));
  window.addEventListener("blur", () => setMod(false));
  source.addEventListener("keydown", (e) => {
    if (e.key === "F12") {
      e.preventDefault();
      const at = source.selectionStart;
      // The caret may be just after the name, as it is after typing one.
      const go = e.shiftKey ? findReferences : goToDefinition;
      go(at).then((went) => { if (!went && at > 0) go(at - 1); });
    } else if (e.key === "Escape" && stdView) {
      e.preventDefault();
      goBack();
    } else if ((e.metaKey || e.ctrlKey) && e.key === "[") {
      e.preventDefault();
      goBack();
    } else if (!["Meta", "Control", "Shift", "Alt"].includes(e.key)) {
      hideTip();
    }
  });
  document.getElementById("std-back").addEventListener("click", goBack);

  let timer = null;
  function refresh() {
    paint();
    if (project) saveOpenFile();
    else store("stitchwort.draft", source.value);
    clearTimeout(timer);
    timer = setTimeout(render, 250);
  }

  function selectView(name) {
    if (view === name) return;
    view = name;
    for (const t of tabs) t.setAttribute("aria-selected", String(t.dataset.view === name));
    store("stitchwort.view", view);
    render();
  }

  for (const tab of tabs) tab.addEventListener("click", () => selectView(tab.dataset.view));
  warningCount.addEventListener("click", () => selectView("check"));
  picker.addEventListener("change", () => loadExample(picker.value));
  source.addEventListener("input", refresh);
  source.addEventListener("keydown", (e) => {
    if (e.key === "Tab" && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      // As typing does, so that undo takes it back, and its `input` event
      // repaints. Changing the value from script (setRangeText) would clear
      // the textarea's undo history instead; that's the fallback, for a
      // browser without insertText.
      if (!document.execCommand("insertText", false, "  ")) {
        source.setRangeText("  ", source.selectionStart, source.selectionEnd, "end");
        refresh();
      }
    }
  });
  // Ctrl+Enter (⌘+Enter on a Mac) runs, from the source or the input.
  for (const box of [source, runInput]) {
    box.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !runButton.disabled) {
        e.preventDefault();
        runMain();
      }
    });
  }

  // Read the draft and input before loading the example, which overwrites them.
  const draft = stored("stitchwort.draft");
  const input = stored("stitchwort.input");
  const chosen = stored("stitchwort.example") || "ex-lists";
  function restoreDraft() {
    if (draft) { source.value = draft; refresh(); }
    if (input !== null) { runInput.value = input; store("stitchwort.input", input); }
  }
  fetchManifest().then(addProjectGroup);
  if (chosen.startsWith("aoc:")) loadProject(Number(chosen.slice(4)) || 0, stored(`${PROJECT_KEYS}open`));
  else loadExample(chosen);
  if (!chosen.startsWith("aoc:")) restoreDraft();
  const savedView = stored("stitchwort.view");
  if (savedView && tabs.some((t) => t.dataset.view === savedView)) selectView(savedView);
</script>
