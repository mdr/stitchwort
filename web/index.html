  // Share by URL. A program on its own travels in the fragment, `#s/<text>`:
  // deflate-raw, then base64url, with no server. Opening such a link shows the
  // text without touching the saved draft; the draft is replaced only when the
  // person edits (`leaveShared`), and "Back to my draft" returns to it.
  const SHARE_WARN = 8 * 1024;
  const SHARE_MAX_TEXT = 1 << 20;
  let sharedOpen = false;

  const toBase64Url = (bytes) => {
    let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  };
  const fromBase64Url = (text) => Uint8Array.from(atob(text.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));

  async function packText(text) {
    const stream = new Blob([text]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    return toBase64Url(new Uint8Array(await new Response(stream).arrayBuffer()));
  }

  /** The text a fragment `s/<packed>` carries, or null if it isn't one or is damaged (or absurdly large). */
  async function unpackText(hash) {
    const m = /^s\/([A-Za-z0-9_-]+)$/.exec(hash);
    if (!m) return null;
    try {
      const reader = new Blob([fromBase64Url(m[1])]).stream().pipeThrough(new DecompressionStream("deflate-raw")).getReader();
      const chunks = [];
      let size = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        size += value.length;
        if (size > SHARE_MAX_TEXT) { reader.cancel(); return null; }
        chunks.push(value);
      }
      return new TextDecoder("utf-8", { fatal: true }).decode(await new Blob(chunks).arrayBuffer());
    } catch {
      return null;
    }
  }

  function leaveShared() {
    if (!sharedOpen) return;
    sharedOpen = false;
    banner.hidden = true;
    // The address now names no one's text but the person's own.
    try { history.replaceState(null, "", location.pathname + location.search); } catch {}
  }

  /** Shows the shared text as a program on its own; the saved draft stays as it is until an edit. */
  async function openShared(text) {
    project = null;
    filebar.hidden = true;
    setRunHint();
    picker.selectedIndex = -1;
    sharedOpen = true;
    showText(text);
    evalImports = [];
    evalInput = "";
    setRunInput("");
    runResult.replaceChildren();
    banner.replaceChildren(
      el("span", {}, "Opened from a shared link. Your own work is kept until you edit this."),
      el("button", { type: "button", onclick: backToDraft }, "Back to my work"));
    banner.hidden = false;
    refresh();
  }

  async function backToDraft() {
    const draftText = stored("stitchwort.draft");
    const inputText = stored("stitchwort.input");
    sharedOpen = false;
    const id = stored("stitchwort.example") || "ex-lists";
    const named = projectOfId(id);
    await loadExample(id);
    if (!named && draftText) { showText(draftText); refresh(); }
    if (!named && inputText !== null) { setRunInput(inputText); storeInput("stitchwort.input"); }
  }

  async function share() {
    let link;
    if (project) {
      const hash = hashFor(picker.value);
      if (!hash) return notify("Nothing to share here");
      link = `${location.origin}${location.pathname}#${hash}`;
    } else {
      link = `${location.origin}${location.pathname}#s/${await packText(source.user.state.doc.toString())}`;
    }
    try { history.replaceState(null, "", link.slice(link.indexOf("#"))); } catch {}
    let copied = true;
    try { await navigator.clipboard.writeText(link); } catch { copied = false; }
    const size = link.length > SHARE_WARN ? ` It is ${(link.length / 1024).toFixed(1)} KB: some chat and mail apps cut links that long.` : "";
    const edited = project ? " The link opens the day as bundled, without your edits." : "";
    notify((copied ? "Link copied." : "The link is in the address bar.") + edited + size);
  }
  document.getElementById("share").addEventListener("click", share);

  async function openSharedHash(hash) {
    const text = await unpackText(hash);
    if (text !== null) return openShared(text);
    await loadExample("ex-lists");
    notify("That shared link is damaged; showing the default example");
  }

  /** Opens the entry a fragment names, or the default one with a notice. */
  async function openFromHash(hash) {
    const id = await idForHash(hash);
    if (id === null) {
      await loadExample("ex-lists");
      linkNotice.textContent = "No such link; showing the default example";
      linkNotice.hidden = false;
      return;
    }
    await loadExample(id);
  }

  /** Adds the project's days to the Example dropdown: one group per year
   *  for days that name one ("Advent of Code 2025"), else one group. */
  function addProjectGroup(manifest) {
    if (!manifest) return;
    const groups = new Map();
    manifest.days.forEach((day, i) => {
      const label = day.year ? `${manifest.title} ${day.year}` : manifest.title;
      if (!groups.has(label)) groups.set(label, el("optgroup", { label }));
      groups.get(label).append(el("option", { value: `${manifest.name}:${i}` }, dayName(day)));
    });
    picker.append(...groups.values());
    if (project?.name === manifest.name) picker.value = `${manifest.name}:${project.day}`;
  }

  otherFiles.addEventListener("change", () => {
    const path = otherFiles.value;
    otherFiles.value = "";
    if (path) openFile(path);
  });
  resetFile.addEventListener("click", () => {
    project.stale.delete(project.open);
    project.texts.set(project.open, project.bundled.get(project.open));
    showFile();
    saveOpenFile();
    refresh();
  });
  resetProject.addEventListener("click", () => { resetProject.hidden = true; resetConfirm.hidden = false; });
  document.getElementById("reset-no").addEventListener("click", () => { resetProject.hidden = false; resetConfirm.hidden = true; });
  document.getElementById("reset-yes").addEventListener("click", () => {
    resetProject.hidden = false;
    resetConfirm.hidden = true;
    for (const path of project.manifest.files) forget(fileKey(path));
    project.texts = new Map(project.bundled);
    project.stale.clear();
    for (const path of project.manifest.files) source.update(projectUri(path), project.texts.get(path));
    showFile();
    refresh();
  });

  async function loadExample(id) {
    sharedOpen = false;
    const named = projectOfId(id);
    if (named) return loadProject(named, Number(id.slice(named.length + 1)) || 0);
    project = null;
    filebar.hidden = true;
    banner.hidden = true;
    setRunHint();
    const ex = document.getElementById(id) || examples[0];
    picker.value = ex.id;
    showText(ex.textContent.replace(/^\n/, ""));
    evalImports = [];
    evalInput = { "ex-lists": "reverse [1, 2, 3]", "ex-division": "safeDiv 9 0",
                  "ex-tests": "double 21", "ex-js": "applyDiscount 8 25",
                  "ex-main": 'printed ["Ada", "1", "2"]' }[ex.id] || "";
    setRunInput({ "ex-main": "Ada\n40\ntwo\n2\n" }[ex.id] || "");
    runResult.replaceChildren();
    store("stitchwort.example", ex.id);
    showEntryLink(ex.id);
    storeInput("stitchwort.input");
    refresh();
  }

  function setStatus(text, kind) {
    status.textContent = text;
    status.className = "status " + (kind || "");
  }

  /** The errors, then the warnings, if any (from a check's answer). */
  function errorsView(errors, warnings) {
    return [el("h2", {}, "Errors"), el("pre", { className: "errors" }, errors), ...warningsView(warnings)];
  }

  /**
   * The open goals (`?`), if any, each in full, under a "Goals" heading. In a
   * project, a goal with a place has a button that jumps to it.
   */
  function goalsView(goals = [], diagnostics = []) {
    if (!goals.length) return [];
    const places = diagnostics.filter((d) => d.severity === "goal" && d.file);
    const boxes = goals.map((text, i) => {
      const box = el("div", { className: "goalbox" });
      const d = project && places.length === goals.length ? places[i] : null;
      if (d) {
        const jump = el("button", { type: "button", className: "jump" }, `${d.file}:${d.line}:${d.column}`);
        jump.addEventListener("click", () => goTo(d.file, d.line, d.column));
        box.append(jump);
      }
      box.append(el("pre", { className: "goals" }, text));
      return box;
    });
    return [el("h2", {}, goals.length === 1 ? "Goals (1 open)" : `Goals (${goals.length} open)`), ...boxes];
  }

  function warningsView(warnings = []) {
    return warnings.length ? [el("h2", {}, "Warnings"), el("pre", { className: "warnings" }, warnings.join(""))] : [];
  }

  /** Shows how many warnings there are, next to the status. */
  function setWarnings(warnings = []) {
    const n = warnings.length;
    warningCount.hidden = n === 0;
    warningCount.textContent = n === 1 ? "1 warning" : `${n} warnings`;
  }

  /**
   * What the language server found in the open program, or in the files of
   * the open day, shaped as the compiler's check answers were: the same
   * diagnostics the editor underlines. Waits for the server to have checked
   * the text on show (and, in a project, the day's own files). `null` if the
   * server isn't running.
   */
  async function serverCheck() {
    if (!(await source.settled(project ? projectUri(project.open) : SINGLE_URI))) return null;
    const errors = [];
    const warnings = [];
    const goals = [];
    const diagnostics = [];
    // Errors with no file (a project that can't be analysed) are the
    // server's on `stitchwort.yaml`.
    const paths = project ? [...new Set([...(project.checkOrder ?? []), ...tabPaths()]), "stitchwort.yaml"] : [null];
    for (const found of paths) {
      const path = found === "stitchwort.yaml" ? undefined : found;
      for (const d of source.diagnosticsOf(found === null ? SINGLE_URI : projectUri(found)) ?? []) {
        const severity = d.severity === 2 ? "warning" : d.severity === 3 ? "goal" : "error";
        const text = d.code ? `[${d.code}] ${d.message}` : d.message;
        const place = { file: path ?? undefined, line: d.range.start.line + 1, column: d.range.start.character + 1,
                        endLine: d.range.end.line, endColumn: d.range.end.character };
        diagnostics.push({ severity, ...place, text });
        const located = path === null ? `${text}\n  at line ${place.line}, column ${place.column}\n` : `${text}\n`;
        if (severity === "error") errors.push(path === null ? located : text);
        else if (severity === "warning") warnings.push(located);
        else goals.push(d.message);
      }
    }
    return { ok: errors.length === 0, errors: errors.join("\n"), warnings: warnings.length ? warnings : undefined,
             goals: goals.length ? goals : undefined, diagnostics };
  }

  /** Each render has a number; a newer one supersedes it. */
  let rendering = 0;

  async function render() {
    const current = ++rendering;
    const src = stateKey();
    delete output.dataset.for;
    if (view === "run") {
      output.replaceChildren(...runPanel);
      runStale.hidden = ranSource === null || ranSource === src;
    }
    if (project) {
      // Which files the day is made of (parsing only), for the tabs.
      const outline = await ask(requestFor("outline"));
      if (current !== rendering) return;
      if (outline?.ok) useOutline(outline);
    }
    // Without a language server (a host that blocks workers, or one that
    // crashed for good) the compiler's own check stands in.
    const checked = (await serverCheck()) ?? (await ask(requestFor("check")));
    if (current !== rendering) return;
    setWarnings(checked?.warnings);
    if (!checked) return;
    if (project) markErrors(checked.diagnostics);
    const day = project?.manifest.days[project.day];
    const openGoals = checked.goals?.length ?? 0;
    setStatus(checked.ok && openGoals
      ? (openGoals === 1 ? "1 goal open" : `${openGoals} goals open`)
      : checked.ok
      ? (day ? `${dayName(day)}${day.namespaces.length > 1 ? " and its proofs" : ""} checked by the kernel` : "Checked by the kernel")
      : "Doesn’t check", checked.ok ? "" : "bad");
    /** The errors, with links to their files in a project. */
    const errorsOf = (answer) => project ? projectErrorsView(answer) : [...goalsView(answer.goals), ...errorsView(answer.errors, answer.warnings)];

    if (view === "run") {
      runChecked.replaceChildren(...(checked.ok ? [] :
        [el("p", { className: "hint" }, "This doesn’t check yet."), ...errorsOf(checked)]));
      return;
    }

    output.replaceChildren();
    if (view === "check") {
      if (checked.ok) {
        const open = checked.goals?.length ?? 0;
        output.append(
          el("p", {}, open
            ? `No errors, but ${open === 1 ? "1 goal is" : open + " goals are"} open: the declarations with ${open === 1 ? "it" : "them"}, and anything that uses them, aren’t finished, so the kernel hasn’t checked them.`
            : "Every definition type-checks, every recursive function terminates, and every proof holds. The kernel re-checked them all."),
          el("p", { className: "hint" }, "Edit the source to see errors as you type. The Tests, Evaluate, JavaScript and Run tabs use the same program."),
          ...goalsView(checked.goals, checked.diagnostics),
          ...warningsView(checked.warnings));
      } else {
        output.append(...errorsOf(checked));
      }
      if (project) {
        // Edits to shared files can break another day: check them all.
        const all = el("div", { id: "check-all-result" });
        const button = el("button", { id: "check-all", type: "button", className: "hint" }, "Check every day");
        button.addEventListener("click", async () => {
          all.replaceChildren(el("p", { className: "hint" }, "Checking every day…"));
          const result = await ask(requestFor("checkall"));
          if (current !== rendering || !result) return;
          all.replaceChildren(...(result.ok
            ? [el("p", { className: "summary" }, `Every day checked: ${result.checked.length} namespaces.`)]
            : projectErrorsView(result)));
          markErrors(result.diagnostics);
        });
        output.append(button, all);
      }
      return;
    }

    if (!checked.ok && view !== "tests") {
      output.append(el("p", { className: "hint" }, "Fix the errors first; the Check tab shows them."),
                    ...errorsOf(checked));
      return;
    }

    if (view === "tests") {
      output.append(el("p", { className: "hint" }, "Running the tests…"));
      const result = await ask(requestFor("test", { known: stored(TEST_CACHE) ?? "" }));
      if (result?.ok) rememberTests(result.added);
      if (current !== rendering || !result) return;
      output.replaceChildren();
      // The server's check passed but this session's didn't: say why.
      if (!result.ok && !result.tests) { output.append(...errorsOf(result)); return; }
      // Errors elsewhere don't stop the tests that don't use them.
      if (!result.ok) output.append(el("p", { className: "hint" },
        "The source has errors (the Check tab shows them). These tests don't use them, or fail saying so."));
      output.dataset.for = src; // which source these results are for (the browser tests wait on it)
      if (result.tests.length === 0) {
        output.append(el("p", { className: "hint" }, 'No tests yet. Add one: test "name" := leq (1 + 1) 2'));
        return;
      }
      const lists = [];
      let list = null;
      let group = null;
      for (const t of result.tests) {
        const unfinished = t.outcome !== "passed" && t.outcome !== "failed";
        // In a project, the tests are grouped by namespace, as the CLI prints them.
        if (!list || (project && t.namespace !== group)) {
          group = t.namespace;
          list = el("ul", { className: "tests" });
          if (project) list.dataset.namespace = group;
          lists.push(list);
        }
        list.append(el("li", { className: t.passed ? "pass" : "fail" },
          el("span", { className: "mark" }, t.passed ? "✓" : unfinished ? "!" : "✗"),
          el("span", {}, t.name + (t.passed ? "" : unfinished ? ` (${t.outcome})` : t.why ? ` (${t.why})` : t.detail ? ` (\`${t.detail.op}\` is False)` : " (evaluated to False)")),
          el("span", { className: "how" }, t.cached ? "cached" : "ran"),
          ...(t.detail || t.part ? [el("div", { className: "detail" }, [
            ...(t.detail ? [`left:  ${t.detail.left}`, `right: ${t.detail.right}`] : []),
            ...(t.detail?.difference ? [t.detail.difference] : []),
            ...(t.part ? [`in: ${t.part.text}  (${t.part.file}:${t.part.line}:${t.part.column})`] : []),
          ].join("\n"))] : [])));
      }
      const failed = result.tests.filter((t) => t.outcome === "failed").length;
      const unfinished = result.tests.filter((t) => !t.passed && t.outcome !== "failed").length;
      const cached = result.tests.filter((t) => t.cached).length;
      const forgetButton = el("button", { id: "forget-cache", className: "hint", type: "button" }, "Forget cached results");
      forgetButton.addEventListener("click", () => { forget(TEST_CACHE); answers.delete("test"); render(); });
      const shown = project
        ? lists.flatMap((l) => [el("h3", { className: "testgroup" }, l.dataset.namespace), l]) : lists;
      output.append(...shown, el("p", { className: "summary" },
        `${result.tests.length} test${result.tests.length === 1 ? "" : "s"}: ${result.tests.length - failed - unfinished} passed, ${failed} failed` +
        (unfinished ? `, ${unfinished} ran out of resources` : "") +
        (cached ? ` (${cached} from the cache)` : "")), forgetButton);
      return;
    }

    if (view === "eval") {
      const input = el("input", { type: "text", id: "eval-input", value: evalInput, spellcheck: false,
                                  placeholder: "an expression, e.g. [1, 2].length, or an import, e.g. import Std (List)" });
      input.setAttribute("aria-label", "Expression to evaluate");
      const go = el("button", { className: "primary", type: "submit" }, "Evaluate");
      const form = el("form", { className: "evalrow" }, input, go);
      const imported = el("pre", { id: "eval-imports", className: "hint" });
      const showImports = () => { imported.hidden = !evalImports.length; imported.textContent = evalImports.join("\n"); };
      showImports();
      const answer = el("div");
      const evaluate = async() => {
        const text = input.value;
        const isImport = /^\s*import\b/.test(text);
        answer.replaceChildren(el("p", { className: "hint" }, "Evaluating…"));
        // An import line is checked, then kept for the expressions after it.
        const imports = (isImport ? [...evalImports, text.trim()] : evalImports).join("\n");
        const result = await ask(requestFor("evaluate", { imports, expr: isImport ? "" : text }));
        if (current !== rendering || !result) return;
        if (isImport && result.ok) {
          evalImports.push(text.trim());
          evalInput = input.value = "";
          showImports();
          answer.replaceChildren();
          return;
        }
        if (!isImport) evalInput = text;
        answer.replaceChildren(result.ok
          ? el("div", { className: "result" }, result.value, el("span", { className: "type" }, ": " + result.type))
          : el("pre", { className: "errors" }, result.errors));
      };
      form.addEventListener("submit", (e) => { e.preventDefault(); evaluate(); });
      output.append(imported, form, answer);
      if (input.value) evaluate();
      return;
    }

    if (view === "js") {
      // In a project, the open file's namespace (as `build --js NS`).
      const namespace = project?.namespaceOf.get(project.open);
      if (project && !namespace) {
        output.append(el("p", { className: "hint" }, "This file’s namespace isn’t known yet."));
        return;
      }
      const result = await ask(requestFor("extract", { namespace }));
      if (current !== rendering || !result) return;
      if (!result.ok) { output.append(...errorsView(result.errors)); return; }
      if (!/export declare function/.test(result.dts)) {
        output.append(el("p", { className: "hint" }, "Nothing is exported. Put `export` on the line before a function's signature."));
        return;
      }
      output.append(el("h2", {}, "TypeScript declarations"), el("pre", {}, result.dts),
                    el("h2", {}, "ES module"), el("pre", {}, result.js));
    }
  }

  // Syntax colouring. This follows the lexer (crates/syntax/src/lexer.rs):
  // its keywords, `--` line comments (there are no block comments), names
  // that may contain `'`, and string and character literals that end at the
  // closing quote or the end of the line, with `\` escaping the next
  // character. A string's `${…}` interpolation holds ordinary code, braces
  // and all, delimited in its own colour. `auto` is only a keyword as the
  // first word in `[…]`, as in the parser, and `exists` and `forall` only
  // where they aren't after a `.` (`opt.exists p` is a call). A name after `def`, `theorem` or `instance`
  // is being defined; `:=` and `=>` are coloured as operators, like the rest
  // of the punctuation, and so are the Unicode spellings of operators
  // (`∈`, `↔`, …: every character outside ASCII in code). One pass over the
  // text, so a long paste stays quick.
  const KEYWORDS = new Set(["type", "def", "theorem", "export", "test", "if", "then", "else",
                            "ability", "where", "handle", "with", "match", "return", "let", "Type", "Prop",
                            "namespace", "import", "include", "calc", "rewrite", "omega", "ring", "cases", "decreasing", "opaque", "unfolding", "interface", "instance",
                            "in", "exists", "forall"]);
  const KINDS = ["keyword", "name", "defined", "number", "string", "interp", "comment", "operator"];
  const isWordStart = (c) => (c >= "a" && c <= "z") || (c >= "A" && c <= "Z") || c === "_";
  const isWord = (c) => isWordStart(c) || (c >= "0" && c <= "9") || c === "'";
  const isDigit = (c) => c >= "0" && c <= "9";
  const escapeHtml = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

  /** Calls `mark(kind, start, end)` for each coloured stretch of `text`, in order. */
  function colour(text, mark) {
    // Neighbours of the same kind, like the two halves of `) ->`, merge.
    let kind = "", from = 0, to = 0;
    const add = (k, start, end) => {
      if (k === kind && start === to) { to = end; return; }
      if (kind) mark(kind, from, to);
      kind = k; from = start; to = end;
    };
    // The modes we're inside, outermost first: code (with its brace depth,
    // when it is an interpolation) or a string. Code inside `${…}` goes
    // through the same tokenizer as the top level, so nested strings, braces
    // and comments behave as they do in the lexer.
    const modes = [{ code: true, depth: 0, interp: false }];
    let i = 0;
    let previous = "";
    while (i < text.length) {
      const mode = modes[modes.length - 1];
      const start = i;
      if (!mode.code) {
        // A string, from its opening quote or from just after an
        // interpolation, up to its closing quote, the next `${`, or the end
        // of the line. Escapes, including `\$`, stay inside the string.
        // A `"""` text runs over lines, to the next `"""`.
        const ends = mode.block
          ? () => text.startsWith('"""', i)
          : () => text[i] === "\n" || text[i] === '"';
        while (i < text.length && !ends()
               && !(text[i] === "$" && text[i + 1] === "{")) {
          i += text[i] === "\\" && (mode.block || text[i + 1] !== "\n") ? 2 : 1;
        }
        const stop = Math.min(i, text.length);
        if (stop < text.length && text[stop] !== "$" && (mode.block || text[stop] === '"')) {
          i = stop + (mode.block ? 3 : 1);
          add("string", mode.start, i);
          modes.pop();
          previous = '"';
        } else if (stop < text.length && text[stop] === "$") {
          if (stop > mode.start) add("string", mode.start, stop);
          add("interp", stop, stop + 2);
          i = stop + 2;
          modes.push({ code: true, depth: 0, interp: true });
          previous = "$";
        } else {
          if (stop > mode.start) add("string", mode.start, stop);
          i = stop;
          modes.pop();
          previous = '"';
        }
        continue;
      }
      const c = text[i];
      if (c === "\n") {
        i++;
      } else if (c === " " || c === "\r" || c === "\t") {
        i++;
      } else if (c === "-" && text[i + 1] === "-") {
        i = text.indexOf("\n", i);
        if (i < 0) i = text.length;
        add("comment", start, i);
      } else if (isWordStart(c)) {
        while (i < text.length && isWord(text[i])) i++;
        const word = text.slice(start, i);
        // `some` after `match` and `matches`, when a `|` follows, are keywords
        // (clause lambdas); anywhere else they are names.
        const bar = (word === "some" && previous === "match") || word === "matches"
          ? /^\s*\|(?![|>])/.test(text.slice(i, i + 40)) : false;
        const k = (KEYWORDS.has(word) && !((word === "exists" || word === "forall") && previous === ".")) || bar
            || (word === "auto" && previous === "[") ? "keyword"
          : word !== "_" && (previous === "def" || previous === "theorem" || previous === "instance") ? "defined"
          : c >= "A" && c <= "Z" ? "name"
          : "";
        if (k) add(k, start, i);
        previous = word;
      } else if (isDigit(c)) {
        while (i < text.length && isDigit(text[i])) i++;
        add("number", start, i);
        previous = "0";
      } else if (c === "-" && isDigit(text[i + 1] || "")
                 && !(i > 0 && (isWord(text[i - 1]) || ")]}\"'".includes(text[i - 1]))
                      && !(KEYWORDS.has(previous) && !["Type", "Prop", "omega", "ring", "cases"].includes(previous)))) {
        // A `-` glued to a numeral, with no closing token touching it on the
        // left, is part of the number: `-1.abs` is `(-1).abs`, while `x-1`
        // subtracts (docs/proposals/negative-arguments.md).
        i++;
        while (i < text.length && isDigit(text[i])) i++;
        if (text[i] === "." && isDigit(text[i + 1] || "")) {
          i++;
          while (i < text.length && isDigit(text[i])) i++;
        }
        if ((text[i] === "e" || text[i] === "E")
            && (isDigit(text[i + 1] || "") || ((text[i + 1] === "+" || text[i + 1] === "-") && isDigit(text[i + 2] || "")))) {
          i += 2;
          while (i < text.length && isDigit(text[i])) i++;
        }
        add("number", start, i);
        previous = "0";
      } else if (c === '"') {
        const block = text.startsWith('"""', i);
        modes.push({ code: false, start, block });
        i += block ? 3 : 1;
      } else if (c === "'") {
        i++;
        while (i < text.length && text[i] !== "\n" && text[i] !== "'") {
          i += text[i] === "\\" && text[i + 1] !== "\n" ? 2 : 1;
        }
        if (text[i] === "'") i++;
        add("string", start, Math.min(i, text.length));
        previous = c;
      } else if (c === "{" && mode.interp) {
        mode.depth++;
        i++;
        add("operator", start, i);
        previous = c;
      } else if (c === "}" && mode.interp && mode.depth === 0) {
        i++;
        add("interp", start, i);
        modes.pop();
        modes[modes.length - 1].start = i;
        previous = c;
      } else if (c === "}" && mode.interp) {
        mode.depth--;
        i++;
        add("operator", start, i);
        previous = c;
      } else {
        i++;
        add("operator", start, i);
        previous = c;
      }
    }
    add("", text.length, text.length);
  }

  /** The text as HTML, each coloured stretch in a span (the guide's code too). */
  function colouredHtml(text) {
    const parts = [];
    let at = 0;
    colour(text, (kind, start, end) => {
      parts.push(escapeHtml(text.slice(at, start)),
                 `<span class="hl-${kind}">${escapeHtml(text.slice(start, end))}</span>`);
      at = end;
    });
    parts.push(escapeHtml(text.slice(at)));
    return parts.join("");
  }

  // ---- The editor (web/editor/src/editor-entry.js) -------------------------
  // CodeMirror 6, coloured by colour() above, on the language server in a
  // worker (lsp-worker.js): errors underlined, hover, go to definition (also
  // into other files of a project and into the library, read-only, with a
  // way back), find references, completion, and code actions on `?`. It looks
  // like a textarea to the rest of the page: `source.value` and so on.

  const stdbar = document.getElementById("stdbar");
  document.getElementById("std-back").addEventListener("click", () => source.goBack());
  let noticeTimer = 0;
  /** The project's files the language server has been given. */
  const served = new Set();
  const projectUri = (path) => `file:///playground/${project.name}/${path}`;
  await versionReady;
  const { createEditor, SINGLE_URI } = await import(`./dist/editor.bundle.js${LOAD}`);

  // ---- Settings (D3468) ------------------------------------------------------
  // The ⚙ menu. The switches the language server reads are sent to it as in
  // VS Code (crates/lsp `Settings`); format on save and the font size are the
  // page's own. Kept in localStorage, as one JSON object.
  const SETTINGS_KEY = "stitchwort.settings";
  const DEFAULT_SETTINGS = { letTypes: true, semanticColours: true, proofSearch: true, timeLimitMs: 5000, formatOnSave: true, fontSize: 13.5 };
  const loadSettings = () => {
    try {
      const saved = JSON.parse(stored(SETTINGS_KEY) ?? "{}");
      const settings = { ...DEFAULT_SETTINGS };
      for (const [key, value] of Object.entries(saved ?? {})) {
        if (key in settings && typeof value === typeof settings[key]) settings[key] = value;
      }
      return settings;
    } catch { return { ...DEFAULT_SETTINGS }; }
  };
  let settings = loadSettings();
  /** The settings as the language server reads them. */
  const serverSettings = () => ({
    inlayHints: { letTypes: settings.letTypes },
    proofSearch: { enabled: settings.proofSearch, timeLimitMs: settings.timeLimitMs },
    semanticColours: settings.semanticColours,
  });
  const applySettings = () => {
    document.documentElement.style.setProperty("--editor-size", `${settings.fontSize}px`);
    source?.configure(serverSettings());
  };
  const source = createEditor(document.getElementById("editor"), {
    colour,
    worker: new URL(`lsp-worker.js${LOAD}`, import.meta.url),
    module: await wasm.catch(() => null),
    load: LOAD,
    onInput: () => { leaveShared(); refresh(); },
    onGoal: showGoal,
    // A jump to a file of the project, from go to definition or a reference.
    onFile: (path) => { if (!project?.texts.has(path)) return false; openFile(path); return true; },
    onStd: (path) => {
      stdbar.hidden = !path;
      document.getElementById("std-name").textContent = path ?? "";
      formatButton.disabled = !!path;
    },
    onNotice: (text) => notify(text),
    // A rename edits files of the project that aren't open in the editor.
    fileText: (path) => project?.texts.get(path),
    setFile: (path, text) => { if (project?.texts.has(path)) { saveFile(path, text); renderTabs(); } },
    run: () => { if (runButton.disabled) return false; runMain(); return true; },
    // Ctrl/Cmd+S: formats, when "Format on save" is on; else the browser's.
    save: () => {
      if (!settings.formatOnSave || formatButton.disabled) return false;
      source.format();
      return true;
    },
    settings: serverSettings(),
  });
  window.editor = source;
  document.documentElement.style.setProperty("--editor-size", `${settings.fontSize}px`);

  const settingsButton = document.getElementById("settings-button");
  const settingsMenu = document.getElementById("settings-menu");
  const settingsField = (name) => settingsMenu.elements[name];
  function showSettings() {
    for (const name of Object.keys(settings)) {
      const input = settingsField(name);
      if (input.type === "checkbox") input.checked = settings[name]; else input.value = settings[name];
    }
  }
  function setSettingsOpen(open) {
    if (open) showSettings();
    settingsMenu.hidden = !open;
    settingsButton.setAttribute("aria-expanded", String(open));
    if (open) settingsField("letTypes").focus();
  }
  settingsButton.addEventListener("click", () => setSettingsOpen(settingsMenu.hidden));
  settingsMenu.addEventListener("change", (e) => {
    const input = e.target;
    const value = input.type === "checkbox" ? input.checked : Number(input.value);
    if (typeof value === "number" && !(value >= Number(input.min) && (!input.max || value <= Number(input.max)))) {
      showSettings(); // out of range: back to the last good value
      return;
    }
    settings = { ...settings, [input.name]: value };
    store(SETTINGS_KEY, JSON.stringify(settings));
    applySettings();
  });
  settingsMenu.addEventListener("submit", (e) => e.preventDefault());
  settingsMenu.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.stopPropagation(); setSettingsOpen(false); settingsButton.focus(); }
  });
  document.addEventListener("pointerdown", (e) => {
    if (!settingsMenu.hidden && !settingsMenu.contains(e.target) && e.target !== settingsButton) setSettingsOpen(false);
  });

  function notify(text) {
    clearTimeout(noticeTimer);
    linkNotice.textContent = text;
    linkNotice.hidden = !text;
    noticeTimer = setTimeout(() => { linkNotice.hidden = true; }, 8000);
  }

  // The goal or expected type at the caret, as VS Code's Goals panel shows it
  // (editors/vscode/client.js `contextHtml`, `goalHtml`): the server's
  // `stitchwort/goalAt` on a `?`, else `stitchwort/contextAt` anywhere in an
  // expression. Where the server has nothing, the last answer stays, dimmed.
  // The panel stays hidden until the first answer.
  const goalPanel = document.getElementById("goalpanel");
  let lastGoal = null;
  const hypothesis = (h, added) => el("div", { className: added ? "row added" : "row" },
    added ? "+ " : "", el("b", {}, h.name), `: ${h.type}`, ...(h.value === undefined ? [] : [el("i", {}, ` := ${h.value}`)]));
  const goalRows = (answer) => [
    el("div", { className: "owner" }, `in ${answer.owner}`),
    ...(answer.context ?? []).map((h) => hypothesis(h, false)),
    el("div", { className: "target" }, `⊢ ${answer.goal}`),
    ...computesRow(answer.goalComputed),
  ];
  // The `computes to` line under a goal shown as written (D3522), cut at 240 characters.
  const computesRow = (computed) => {
    if (!computed) return [];
    const chars = [...computed];
    const cut = chars.length > 240 ? `${chars.slice(0, 239).join("")}…` : computed;
    return [el("div", { className: "computed" }, `computes to ${cut}`)];
  };
  function contextRows(answer) {
    const step = answer.step;
    const where = [answer.declaration && `\`${answer.declaration}\``, step?.description].filter(Boolean).join(", ");
    const added = new Set(step?.adds ?? []);
    const rows = [
      ...(where ? [el("div", { className: "owner" }, `in ${where}`)] : []),
      ...(answer.locals ?? []).map((h) => hypothesis(h, added.has(h.name))),
    ];
    const line = (cls, label, text) => el("div", { className: cls }, el("span", { className: "label" }, label), text);
    if (step) {
      const sign = step.target ? `${step.target}: ` : step.kind === "proof" ? "⊢ " : "expected ";
      if (step.form === "calcLine") {
        if (step.before) rows.push(line("before", "so far ", step.before), ...computesRow(step.beforeComputed));
        rows.push(line("target", `line ${sign}`, step.after), ...computesRow(step.afterComputed));
      } else if (step.form === "match" || step.form === "statement") {
        rows.push(line("target", sign, step.after), ...computesRow(step.afterComputed));
      } else {
        if (step.before) rows.push(line("before", `before ${sign}`, step.before), ...computesRow(step.beforeComputed));
        if (step.rule) rows.push(line("before", "rule ", step.rule));
        rows.push(line("target", `after ${sign}`, step.after), ...computesRow(step.afterComputed));
      }
      return rows;
    }
    rows.push(line("target", !answer.checked ? "has type " : answer.kind === "proof" ? "⊢ " : "expected ", answer.type), ...computesRow(answer.typeComputed));
    if (answer.checked && answer.hasType) rows.push(el("div", { className: "before" }, `has type ${answer.hasType}`));
    return rows;
  }
  function showGoal(result, hide) {
    if (hide) { lastGoal = null; goalPanel.hidden = true; return; }
    if (result) {
      // On a `?` its goal; else the expression's context; else the nearest `?` of the declaration.
      const rows = result.here || !result.context ? goalRows(result.goal) : contextRows(result.context);
      lastGoal = rows;
      goalPanel.replaceChildren(...rows);
      goalPanel.hidden = false;
    } else if (lastGoal) {
      goalPanel.replaceChildren(el("div", { className: "stale" }, el("div", { className: "none" }, "Nothing at the cursor; the last answer:"), ...lastGoal));
    }
  }

  /** Shows a program on its own. */
  function showText(text) {
    source.open({ uri: SINGLE_URI, text });
  }
  function exitStd() { source.exitStd(); }

  /** Gives the language server the project, with the saved edits, so that its files are checked as the project's. */
  function giveServer(state) {
    if (served.has(state.name)) return;
    served.add(state.name);
    const { manifest } = state;
    const data = manifest.data ?? [];
    source.addProject({
      root: `/playground/${state.name}`, sources: ["src"], paths: [...manifest.files, ...data],
      texts: [...manifest.files.map((path) => state.texts.get(path)), ...state.data],
    });
  }

  let timer = null;
  function refresh() {
    if (project) saveOpenFile();
    else if (!sharedOpen) store("stitchwort.draft", source.value);
    clearTimeout(timer);
    timer = setTimeout(render, 250);
  }

  function selectView(name) {
    if (view === name) return;
    view = name;
    for (const t of tabs) t.setAttribute("aria-selected", String(t.dataset.view === name));
    store("stitchwort.view", view);
    render();
  }

  for (const tab of tabs) tab.addEventListener("click", () => selectView(tab.dataset.view));
  warningCount.addEventListener("click", () => selectView("check"));
  picker.addEventListener("change", () => loadExample(picker.value));
  // Ctrl+Enter (⌘+Enter on a Mac) runs, from the source (the editor does that) or the input.
  runInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !runButton.disabled) {
      e.preventDefault();
      runMain();
    }
  });

  // ---- Format ---------------------------------------------------------------
  // The language server formats the file (Shift+Alt+F in the editor, or this
  // button). A file with a syntax error is left as it is: its errors are
  // underlined already.
  const formatButton = document.getElementById("format");
  formatButton.addEventListener("click", () => { source.format(); source.focus(); });

  // ---- The language guide (web/guide/) -----------------------------------
  // `#guide` shows it in place of the editor, `#guide/<section>` scrolls to a
  // section (the slugs are in guide.html). It is a fragment of HTML whose
  // `pre[data-src]` blocks name an example file of the same folder; each is
  // filled in and coloured here, with a button that puts it in the editor.
  const guideButton = document.getElementById("guide-button");
  const guideEl = document.getElementById("guide");
  const guideArticle = document.getElementById("guide-article");
  const guideContents = document.getElementById("guide-contents");
  const mainEl = document.querySelector("main");
  let guideLoaded = null;

  /** The section of a `#guide` or `#guide/<section>` fragment ("" for the top), or null for any other. */
  function guideSlugOf(hash) {
    const m = /^guide(?:\/([a-z0-9-]+))?$/.exec(hash);
    return m ? (m[1] ?? "") : null;
  }

  async function fetchGuideText(name) {
    await versionReady;
    const r = await fetch(new URL(`guide/${name}`, import.meta.url), { cache: "no-cache" });
    if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
    return r.text();
  }

  /** Builds the guide from its files, once. */
  function loadGuide() {
    guideLoaded ??= (async () => {
      try {
        const page = new DOMParser().parseFromString(await fetchGuideText("guide.html"), "text/html");
        const items = [];
        const sections = [...page.querySelectorAll("section[data-slug]")];
        for (const section of sections) {
          const slug = section.dataset.slug;
          section.id = `guide-${slug}`;
          section.prepend(el("h3", {}, el("a", { href: `#guide/${slug}` }, section.dataset.title)));
          items.push(el("li", {}, el("a", { href: `#guide/${slug}`, id: `guide-link-${slug}` }, section.dataset.title)));
        }
        await Promise.all([...page.querySelectorAll("pre[data-src]")].map(async (pre) => {
          const text = (await fetchGuideText(pre.dataset.src)).replace(/\n+$/, "\n");
          pre.innerHTML = colouredHtml(text);
          const open = el("button", { type: "button", className: "open-example",
                                      title: "Put this example in the editor" }, "Open in editor");
          open.addEventListener("click", () => openGuideExample(text));
          const box = el("div", { className: "guide-code" });
          pre.replaceWith(box);
          box.append(pre, open);
        }));
        guideContents.replaceChildren(el("h2", {}, "Guide"), el("ol", {}, ...items));
        guideArticle.replaceChildren(el("h1", {}, "A tour of Stitchwort"), ...page.body.childNodes);
      } catch (e) {
        guideLoaded = null;
        guideArticle.replaceChildren(el("p", { className: "hint" }, `The guide could not be loaded (${e.message}).`));
      }
    })();
    return guideLoaded;
  }

  /** Marks the contents entry of the section on show. */
  function markGuideSection(slug) {
    for (const a of guideContents.querySelectorAll("a")) {
      if (a.id === `guide-link-${slug}`) a.setAttribute("aria-current", "true");
      else a.removeAttribute("aria-current");
    }
  }

  async function showGuide(slug) {
    mainEl.hidden = true;
    guideEl.hidden = false;
    guideButton.setAttribute("aria-pressed", "true");
    await loadGuide();
    const target = slug ? document.getElementById(`guide-${slug}`) : null;
    markGuideSection(target ? slug : "");
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  }

  /** Back to the editor; the address goes back to the open example's. */
  function hideGuide() {
    if (guideEl.hidden) return;
    guideEl.hidden = true;
    mainEl.hidden = false;
    guideButton.setAttribute("aria-pressed", "false");
  }

  /** Puts a guide example in the editor, ready to check, test or run. */
  function openGuideExample(text) {
    project = null;
    filebar.hidden = true;
    banner.hidden = true;
    setRunHint();
    hideGuide();
    showText(text);
    // The menu names no entry for it: a label that isn't one of the choices.
    let label = picker.querySelector('option[value=""]');
    if (!label) picker.append(label = el("option", { value: "", hidden: true }, "From the guide"));
    picker.value = "";
    evalImports = [];
    evalInput = "";
    setRunInput("");
    runResult.replaceChildren();
    store("stitchwort.input", "");
    try { history.replaceState(null, "", location.pathname + location.search); } catch {}
    linkNotice.hidden = true;
    selectView(/^test /m.test(text) ? "tests" : "check");
    refresh();
    source.setSelectionRange(0, 0);
    source.scrollTop = 0;
    source.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  guideButton.addEventListener("click", () => {
    if (guideEl.hidden) {
      location.hash = "guide";
    } else {
      hideGuide();
      const hash = hashFor(picker.value);
      try { history.replaceState(null, "", hash ? `#${hash}` : location.pathname + location.search); } catch {}
    }
  });
  picker.addEventListener("change", hideGuide);
  // A link to the section the address already names doesn't change the
  // address, so no `hashchange` scrolls back to it.
  guideEl.addEventListener("click", (e) => {
    const link = e.target.closest?.('a[href^="#guide"]');
    if (link && link.getAttribute("href") === location.hash) showGuide(guideSlugOf(location.hash.slice(1)) ?? "");
  });

  // Read the draft and input before loading the example, which overwrites them.
  const draft = stored("stitchwort.draft");
  const input = stored("stitchwort.input");
  const chosen = stored("stitchwort.example") || "ex-lists";
  function restoreDraft() {
    if (draft) { showText(draft); refresh(); }
    if (input !== null) { setRunInput(input); storeInput("stitchwort.input"); }
  }
  // In order, so the groups are in the dropdown's order.
  PROJECT_NAMES.reduce((previous, name) => previous.then(() => fetchManifest(name)).then(addProjectGroup), Promise.resolve());
  const startHash = location.hash.slice(1);
  const startGuide = guideSlugOf(startHash);
  if (startHash && startGuide === null) {
    // A link opens as choosing that entry does, except that the saved draft
    // of a built-in example is kept if it is the one last open.
    if (startHash.startsWith("s/")) openSharedHash(startHash);
    else openFromHash(startHash).then(() => { if (picker.value === chosen && !projectOfId(chosen)) restoreDraft(); });
  } else {
    // The editor is set up behind the guide, which a `#guide` link opens
    // (the example's own link would take its place in the address bar).
    const chosenProject = projectOfId(chosen);
    const loaded = chosenProject
      ? loadProject(chosenProject, Number(chosen.slice(chosenProject.length + 1)) || 0, stored(`${keysOf(chosenProject)}open`))
      : loadExample(chosen);
    if (!chosenProject) restoreDraft();
    if (startGuide !== null) {
      Promise.resolve(loaded).then(() => { try { history.replaceState(null, "", `#${startHash}`); } catch {} });
      showGuide(startGuide);
    }
  }
  window.addEventListener("hashchange", async () => {
    const hash = location.hash.slice(1);
    const slug = guideSlugOf(hash);
    if (slug !== null) { showGuide(slug); return; }
    hideGuide();
    if (!hash) return;
    if (hash.startsWith("s/")) { openSharedHash(hash); return; }
    const id = await idForHash(hash);
    if (id !== null && id === picker.value) return;
    openFromHash(hash);
  });
  const savedView = stored("stitchwort.view");
  if (savedView && tabs.some((t) => t.dataset.view === savedView)) selectView(savedView);
</script>
