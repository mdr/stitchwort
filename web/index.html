<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stitchwort Playground</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,MONO@-15..0,300..800,0..1,0..1&display=swap">
<style>
  /* Layout: a hedgerow-green tool. Source on the left, the compiler's answers on
     the right; one column on a phone. */
  :root {
    --paper: #f3f6f1;
    --petal: #fdfefc;
    --ink: #1c2a21;
    --muted: #5a6a5f;
    --line: #d5dfd2;
    --leaf: #2d6a3e;
    --leaf-soft: #e1ecdf;
    --ok: #2f7a47;
    --bad: #a83b34;
    --bad-soft: #f6e4e1;
    --warn: #865800;
    --warn-soft: #f6ecd5;
    /* Syntax colours for the source: hedgerow flowers on the same paper. */
    --hl-keyword: #2d6a3e;
    --hl-name: #1f6470;
    --hl-defined: #2f4f8f;
    --hl-number: #7b4b94;
    --hl-string: #8a5a12;
    --hl-interp: #2d6a3e;
    --hl-comment: #627266;
    --hl-operator: #45604e;
    --hl-selection: rgb(45 106 62 / 0.2);
    --sans: "Recursive", ui-sans-serif, system-ui, sans-serif;
    --mono: "Recursive", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #111814; --petal: #0b100d; --ink: #e3ece4; --muted: #95a699;
      --line: #27332b; --leaf: #82c795; --leaf-soft: #1b2a20; --ok: #7fcb95;
      --bad: #ef8f86; --bad-soft: #2f1a18; --warn: #e3b55e; --warn-soft: #2c2412; color-scheme: dark;
      --hl-keyword: #82c795; --hl-name: #7cc4c9; --hl-defined: #9db8ec; --hl-number: #c9a3e0;
      --hl-string: #e0b870; --hl-interp: #82c795; --hl-comment: #7f9184; --hl-operator: #a3b8a8;
      --hl-selection: rgb(130 199 149 / 0.25);
    }
  }
  :root[data-theme="dark"] {
    --paper: #111814; --petal: #0b100d; --ink: #e3ece4; --muted: #95a699;
    --line: #27332b; --leaf: #82c795; --leaf-soft: #1b2a20; --ok: #7fcb95;
    --bad: #ef8f86; --bad-soft: #2f1a18; --warn: #e3b55e; --warn-soft: #2c2412; color-scheme: dark;
    --hl-keyword: #82c795; --hl-name: #7cc4c9; --hl-defined: #9db8ec; --hl-number: #c9a3e0;
    --hl-string: #e0b870; --hl-interp: #82c795; --hl-comment: #7f9184; --hl-operator: #a3b8a8;
    --hl-selection: rgb(130 199 149 / 0.25);
  }

  /* The page fills the window, and grows when the editor is dragged taller. */
  html { height: 100%; }
  body {
    min-height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-variation-settings: "CASL" 0, "MONO" 0;
    font-size: 15px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px;
    box-sizing: border-box;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 14px;
  }
  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 34px; height: 34px; flex: none; }
  .brand h1 {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 750;
    font-variation-settings: "CASL" 1, "slnt" 0;
    letter-spacing: -0.01em;
  }
  .brand p { margin: 0; color: var(--muted); font-size: 0.85rem; }
  .picker { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  label.small {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  select, input[type="text"], button {
    font: inherit;
    color: var(--ink);
    background: var(--petal);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
  }
  button {
    cursor: pointer;
    font-weight: 600;
  }
  button.primary { background: var(--leaf); color: var(--petal); border-color: var(--leaf); }
  button:hover { border-color: var(--leaf); }
  :focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: 16px;
  }
  @media (max-width: 820px) {
    main { grid-template-columns: minmax(0, 1fr); }
    .picker { margin-left: 0; }
  }

  .pane {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .pane-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    min-height: 36px;
  }

  /* The editor: a coloured copy of the source (#highlight) sits under the
     textarea, whose own text is transparent, so only its caret and selection
     show. Everything that places a character must match between the two. */
  .editor {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--petal);
    border-radius: 8px;
  }
  textarea#source, pre#highlight {
    margin: 0;
    font-family: var(--mono);
    font-variation-settings: "MONO" 1, "CASL" 0;
    font-size: 13.5px;
    font-weight: 400;
    letter-spacing: normal;
    line-height: 1.55;
    tab-size: 2;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    white-space: pre;
    overflow-wrap: normal;
  }
  textarea#source {
    /* Its height is the resize handle's, or else fills the pane. */
    flex: 1 0 auto;
    position: relative;
    min-height: 420px;
    width: 100%;
    resize: vertical;
    color: transparent;
    caret-color: var(--ink);
    background: transparent;
    overflow: auto;
  }
  textarea#source::selection { color: transparent; background: var(--hl-selection); }
  /* Sized by script to the textarea's box less its scrollbars, and scrolled
     with it. */
  pre#highlight {
    position: absolute;
    top: 0;
    left: 0;
    border-color: transparent;
    color: var(--ink);
    overflow: hidden;
    pointer-events: none;
  }
  /* Each kind of token, as a highlight (see paint()) or, failing that, a
     span. Separate rules, since a browser drops a whole rule over a selector
     it doesn't know. */
  ::highlight(hl-keyword) { color: var(--hl-keyword); }
  ::highlight(hl-name) { color: var(--hl-name); }
  ::highlight(hl-defined) { color: var(--hl-defined); }
  ::highlight(hl-number) { color: var(--hl-number); }
  ::highlight(hl-string) { color: var(--hl-string); }
  ::highlight(hl-interp) { color: var(--hl-interp); }
  ::highlight(hl-comment) { color: var(--hl-comment); }
  ::highlight(hl-operator) { color: var(--hl-operator); }
  .hl-keyword { color: var(--hl-keyword); }
  .hl-name { color: var(--hl-name); }
  .hl-defined { color: var(--hl-defined); }
  .hl-number { color: var(--hl-number); }
  .hl-string { color: var(--hl-string); }
  .hl-interp { color: var(--hl-interp); }
  .hl-comment { color: var(--hl-comment); }
  .hl-operator { color: var(--hl-operator); }

  /* A project's files: a row of tabs that scrolls inside itself (so the page
     never scrolls sideways), and the controls for the open file. */
  .filebar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
  .filetabs { flex: 1 1 100%; display: flex; gap: 4px; overflow-x: auto; min-width: 0; padding-bottom: 2px; }
  .filetabs button {
    flex: none;
    white-space: nowrap;
    background: transparent;
    border-color: transparent;
    color: var(--muted);
    padding: 4px 9px;
    font-family: var(--mono);
    font-variation-settings: "MONO" 1, "CASL" 0;
    font-size: 12.5px;
    font-weight: 500;
  }
  .filetabs button[aria-selected="true"] { background: var(--petal); border-color: var(--line); color: var(--ink); }
  .filetabs button[data-errors] { color: var(--bad); }
  .filetabs .mark { margin-left: 5px; font-weight: 700; }
  .filetabs .edited { color: var(--leaf); }
  .filebar select { font-size: 0.82rem; padding: 3px 8px; max-width: 100%; }
  .filebar .hint { font-size: 0.8rem; font-weight: 500; padding: 3px 8px; }
  .banner {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
    font-size: 0.85rem; padding: 8px 12px; border-radius: 8px;
    background: var(--warn-soft); color: var(--warn);
  }
  .banner button { font-size: 0.8rem; padding: 3px 8px; }
  .errorfile { display: flex; flex-direction: column; gap: 4px; }
  button.jump { align-self: flex-start; font-family: var(--mono); font-size: 0.78rem; font-weight: 500; padding: 2px 8px; color: var(--bad); }
  h3.testgroup { margin: 0; font-size: 0.82rem; font-family: var(--mono); font-weight: 600; color: var(--muted); }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--leaf-soft);
    color: var(--ok);
  }
  .status.bad { background: var(--bad-soft); color: var(--bad); }
  .status.idle { color: var(--muted); }
  /* The warning count: a button that shows them in the Check tab. */
  button.status.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  button.status.warn:hover { border-color: var(--warn); }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .tabs button {
    background: transparent;
    border-color: transparent;
    color: var(--muted);
    padding: 5px 10px;
  }
  .tabs button[aria-selected="true"] {
    background: var(--petal);
    border-color: var(--line);
    color: var(--ink);
  }

  .output {
    flex: 1;
    min-height: 240px;
    /* Long results scroll inside it, rather than making the page longer. */
    contain: size;
    background: var(--petal);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  /* Each result keeps its full height, and the pane scrolls; otherwise a
     box that scrolls itself, like a <pre>, is squeezed to fit. */
  .output > * { flex-shrink: 0; }
  .output p { margin: 0; max-width: 62ch; }
  .hint { color: var(--muted); font-size: 0.88rem; }
  pre {
    margin: 0;
    font-family: var(--mono);
    font-variation-settings: "MONO" 1;
    font-size: 12.5px;
    line-height: 1.45;
    white-space: pre;
    overflow-x: auto;
  }
  pre.errors { color: var(--bad); }
  pre.warnings { color: var(--warn); }

  .evalrow, .runrow { display: flex; gap: 8px; }
  button.run { margin-left: auto; }
  button:disabled { cursor: default; opacity: 0.55; }
  textarea#run-input {
    width: 100%;
    resize: vertical;
    font-family: var(--mono);
    font-variation-settings: "MONO" 1, "CASL" 0;
    font-size: 13px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .run-result { display: flex; flex-direction: column; gap: 10px; }
  pre.program-output { border-left: 3px solid var(--leaf); padding-left: 10px; }
  .evalrow input { flex: 1; min-width: 0; font-family: var(--mono); font-variation-settings: "MONO" 1; }
  .result {
    font-family: var(--mono);
    font-variation-settings: "MONO" 1;
    font-size: 14px;
    border-left: 3px solid var(--leaf);
    padding-left: 10px;
  }
  .result .type { color: var(--muted); }

  ul.tests { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  ul.tests li { display: flex; gap: 10px; align-items: baseline; }
  ul.tests .mark { font-weight: 700; width: 1.2em; text-align: center; }
  ul.tests .pass .mark { color: var(--ok); }
  ul.tests .fail .mark { color: var(--bad); }
  ul.tests .how { color: var(--muted); font-size: 0.8rem; }
  .summary { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.88rem; }
  button.hint { font-size: 0.8rem; font-weight: 500; padding: 4px 8px; }

  h2 {
    margin: 0;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 650;
  }

  /* A phone: the panes are stacked (above), so the results get more height.
     Text boxes get 16px text, as with less a phone zooms in on focusing
     them, and the editor's padding shrinks to leave room for the code. */
  @media (max-width: 600px) {
    textarea#source, pre#highlight { font-size: 16px; padding: 10px 12px; }
    select, input[type="text"], textarea#run-input { font-size: 16px; }
    .output { min-height: 70vh; }
    .tabs button { padding: 5px 7px; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .status { transition: background-color 150ms, color 150ms; }
  }
</style>

<header>
  <div class="brand">
    <svg viewBox="-50 -50 100 100" aria-hidden="true">
      <!-- Stitchwort: five white petals, each split almost to the base. -->
      <g id="petal-pair" style="fill: var(--petal); stroke: var(--leaf); stroke-width: 2.5">
        <ellipse cx="-6" cy="-24" rx="7" ry="20" transform="rotate(-9 -6 -24)"/>
        <ellipse cx="6" cy="-24" rx="7" ry="20" transform="rotate(9 6 -24)"/>
      </g>
      <use href="#petal-pair" transform="rotate(72)"/>
      <use href="#petal-pair" transform="rotate(144)"/>
      <use href="#petal-pair" transform="rotate(216)"/>
      <use href="#petal-pair" transform="rotate(288)"/>
      <circle r="8" style="fill: var(--leaf)"/>
    </svg>
    <div>
      <h1>Stitchwort</h1>
      <p>A total, dependently-typed language. Every definition is re-checked by the kernel.</p>
    </div>
  </div>
  <div class="picker">
    <label class="small" for="example">Example</label>
    <select id="example"></select>
  </div>
</header>

<main>
  <section class="pane" aria-label="Source">
    <div class="pane-head">
      <span id="status" class="status idle">Loading the compiler…</span>
      <button id="warning-count" class="status warn" type="button" title="Show the warnings" hidden></button>
      <button id="run" class="primary run" type="button" title="Run main (Ctrl+Enter)">Run ▸</button>
    </div>
    <div id="filebar" class="filebar" hidden>
      <div id="filetabs" class="filetabs" role="tablist" aria-label="Files of this day"></div>
      <select id="other-files" aria-label="Other files of the project"></select>
      <button id="reset-file" class="hint" type="button" title="Go back to the bundled text of this file">Reset this file</button>
      <button id="reset-project" class="hint" type="button" title="Go back to the bundled text of every file">Reset the project</button>
      <span id="reset-confirm" class="hint" hidden>Reset every file?
        <button id="reset-yes" class="hint" type="button">Yes, reset</button>
        <button id="reset-no" class="hint" type="button">No</button></span>
    </div>
    <div id="banner" class="banner" role="status" hidden></div>
    <div class="editor">
      <pre id="highlight" aria-hidden="true"></pre>
      <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Stitchwort source"></textarea>
    </div>
  </section>

  <section class="pane" aria-label="Results">
    <div class="pane-head">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-check" aria-selected="true" data-view="check">Check</button>
        <button role="tab" id="tab-tests" aria-selected="false" data-view="tests">Tests</button>
        <button role="tab" id="tab-eval" aria-selected="false" data-view="eval">Evaluate</button>
        <button role="tab" id="tab-js" aria-selected="false" data-view="js">JavaScript</button>
        <button role="tab" id="tab-run" aria-selected="false" data-view="run">Run</button>
      </div>
    </div>
    <div class="output" id="output" role="tabpanel"></div>
  </section>
</main>

<script type="text/plain" id="ex-lists" data-title="Proofs about lists">-- A proof that appending lists adds their lengths, by induction on the first
-- list. The compiler checks it; change a line and see what it says.
import Std (Eq)

theorem appendLength: (xs: List a) -> (ys: List a) ->
    List.length (List.append xs ys) = List.length xs + List.length ys
  | Nil,       ys => rfl
  | Cons x xs, ys => Eq.cong Succ (appendLength xs ys)

def reverse: List a -> List a
  | Nil       => Nil
  | Cons x xs => List.append (reverse xs) [x]

-- Proofs by computation:
theorem reverseExample: reverse [1, 2, 3] = [3, 2, 1] := rfl

-- Try: `appendLength (Cons x xs) ys = appendLength xs ys` (a wrong step), or a
-- recursive call that doesn't get smaller, like `reverse (Cons x xs)`.
</script>

<script type="text/plain" id="ex-division" data-title="Safe division">-- `/` needs a proof that the divisor isn't zero. For a literal, the compiler
-- decides it; for a runtime value, establish it with `if h: … then … else`.

def half (n: Nat): Nat := n / 2

def safeDiv (n: Nat) (d: Nat): Nat := if h: d != 0 then n / d else 0

-- A function can ask for the proof itself; callers' `auto` finds it.
def average (total: Nat) (count: Nat): [auto ok: count != 0] -> Nat := total / count

def averageOfThree: Nat := average 12 3

-- Try: `def ratio (n d: Nat): Nat := n / d` (can't be decided before the
-- program runs), or `def oops: Nat := 7 / 0` (false). Evaluate `safeDiv 9 0` in the Evaluate tab.
</script>

<script type="text/plain" id="ex-tests" data-title="Tests">-- Tests are `Bool` expressions that must be `True`. The command-line tool
-- caches each result by a hash of everything the test depends on.

def double (n: Nat): Nat := n + n

def isEven (n: Nat): Bool := Nat.leq (n % 2) 0

test "double 3 is 6" := Nat.leq (double 3) 6
test "doubles are even" := isEven (double 7)
test "7 is odd" := not (isEven 7)
test "this one fails" := isEven 3
</script>

<script type="text/plain" id="ex-abilities" data-title="Abilities and handlers">-- Effectful code is written directly; the abilities it may perform are in
-- its type. A handler removes one. `k` resumes the computation and may be
-- called more than once. Run the tests to see the results.

ability State (s: Type) where
  get: () -> {State s} s
  put: s -> {State s} ()

ability Choose where
  choose: () -> {Choose} Bool

def fstOf: Pair a b -> a
  | MkPair x y => x

def sndOf: Pair a b -> b
  | MkPair x y => y

def runState (init: s) (prog: () -> {State s | e} a): {e} Pair a s :=
  let run: s -> {e} Pair a s :=
    handle prog() with
      | return x       => st => MkPair x st
      | get(), k      => st => k st st
      | put st2, k     => st => k() st2
  run init

def allResults (prog: () -> {Choose | e} a): {e} List a :=
  handle prog() with
    | return x       => [x]
    | choose _, k    => List.append (k True) (k False)

-- Choose, then add 10 to the state if it said yes.
def step(): {State Nat, Choose} Nat :=
  if choose() then put (get() + 10) else ()
  get()

-- Each branch has its own state...
test "state inside choice" := List.length (allResults (u => runState 1 step)) == 2

-- ...or one state threads through both branches.
test "choice inside state" := sndOf (runState 1 (u => allResults step)) == 11
</script>
<script type="text/plain" id="ex-main" data-title="Input and output: main">-- A program with input and output. `main` prints with `IO.print` and reads
-- lines with `IO.readLine`, which gives `Nothing` at the end of the input. Press
-- Run: the Run tab's box holds the input lines. The tests run the same `main`
-- with `IO.simulate`, which takes the input as a list.

-- The text, or a default at end of input.
def textOr (d: Text): Maybe Text -> Text
  | Nothing => d
  | Just t  => t

-- Reports a line that should be a number, and goes on with the new total.
def stepNumber (total: Nat) (l: Text): Maybe Nat -> (Nat -> {IO} Nat) -> {IO} Nat
  | Nothing, more =>
    IO.print ("\"" ++ l ++ "\" isn't a number; skipped")
    more total
  | Just n,  more =>
    IO.print ("  total: " ++ Nat.toText (total + n))
    more (total + n)

-- What to do with a line, given the total so far. An empty line, or the end
-- of input, stops.
def step (total: Nat): Maybe Text -> (Nat -> {IO} Nat) -> {IO} Nat
  | Nothing, more => total
  | Just l,  more =>
    if Text.isEmpty l then total else stepNumber total l (Text.toNat (Text.trim l)) more

-- Adds the numbers on at most this many more lines. The bound keeps the
-- recursion structural: every run of `main` performs a bounded number of
-- operations.
def addLines: Nat -> Nat -> {IO} Nat
  | 0,      total => total
  | Succ n, total => step total (IO.readLine()) (t => addLines n t)

def main(): {IO} () :=
  IO.print "What's your name?"
  let name := textOr "stranger" (IO.readLine())
  IO.print ("Hello, " ++ name ++ "! Type numbers to add, one per line, and an empty line to stop.")
  let total := addLines 1000 0
  IO.print ("The sum is " ++ Nat.toText total ++ ". Goodbye, " ++ name ++ ".")

-- Testing `main` with scripted input

def eqTexts: List Text -> List Text -> Bool
  | Nil,       Nil       => True
  | Cons x xs, Cons y ys => if x == y then eqTexts xs ys else False
  | _,         _         => False

def printed (input: List Text): List Text := Pair.fst (IO.simulate input main)

test "a session" :=
  eqTexts (printed ["Ada", "1", "2", "x", " 39 ", ""])
    [ "What's your name?"
    , "Hello, Ada! Type numbers to add, one per line, and an empty line to stop."
    , "  total: 1"
    , "  total: 3"
    , "\"x\" isn't a number; skipped"
    , "  total: 42"
    , "The sum is 42. Goodbye, Ada."
    ]

test "end of input stops it too" :=
  eqTexts (printed ["Ada", "5"])
    [ "What's your name?"
    , "Hello, Ada! Type numbers to add, one per line, and an empty line to stop."
    , "  total: 5"
    , "The sum is 5. Goodbye, Ada."
    ]

test "no input at all" :=
  eqTexts (printed [])
    [ "What's your name?"
    , "Hello, stranger! Type numbers to add, one per line, and an empty line to stop."
    , "The sum is 0. Goodbye, stranger."
    ]
</script>
<script type="text/plain" id="ex-js" data-title="Extract to JavaScript">-- Exports become an ES module with TypeScript types. Preconditions that JS
-- can't prove are checked at runtime instead. See the JavaScript tab.

export def applyDiscount (price: Nat) (percent: Nat): [auto ok: percent <= 100] -> Nat := price - price * percent / 100

type Shape: Type =
  | Square (side: Nat)
  | Rect (width: Nat) (height: Nat)

export def area: Shape -> Nat
  | Square s => s * s
  | Rect w h => w * h
</script>

<script type="module">
  const status = document.getElementById("status");
  const source = document.getElementById("source");
  const output = document.getElementById("output");
  const picker = document.getElementById("example");
  const runButton = document.getElementById("run");
  const warningCount = document.getElementById("warning-count");
  const tabs = [...document.querySelectorAll(".tabs button")];
  const examples = [...document.querySelectorAll('script[type="text/plain"]')];

  /** Most a run may print, in bytes. */
  const MAX_OUTPUT = 256 * 1024;
  /** How long a run may take before it's stopped. */
  const RUN_SECONDS = 15;
  /** How long checking, testing, evaluating or extracting may take. */
  const CHECK_SECONDS = 60;

  let view = "check";
  let evalInput = "";

  for (const ex of examples) {
    const option = document.createElement("option");
    option.value = ex.id;
    option.textContent = ex.dataset.title;
    picker.append(option);
  }

  const stored = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
  const store = (key, value) => { try { localStorage.setItem(key, value); } catch {} };
  const forget = (key) => { try { localStorage.removeItem(key); } catch {} };

  /** Where the tests' cached results are kept, one `KEY passed` per line. */
  const TEST_CACHE = "stitchwort.testCache";

  /** Adds new test results to the cache, keeping it from growing without end. */
  function rememberTests(added) {
    if (!added) return;
    let text = (stored(TEST_CACHE) ?? "") + added;
    if (text.length > 200_000) text = text.split("\n").slice(-2_000).join("\n");
    store(TEST_CACHE, text);
  }

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) node[k] = v;
    node.append(...children);
    return node;
  }

  const secs = (ms) => ms < 1000 ? `${ms.toFixed(0)} ms` : `${(ms / 1000).toFixed(1)} s`;

  // The compiler runs in a Web Worker (playground-worker.js), one request at
  // a time. After a crash (a trap, or the engine's stack running out, which
  // deep nesting can still cause) the WebAssembly instance's state isn't
  // restored, so that worker is discarded and the next request starts a
  // fresh one. A request that's superseded, stopped or too slow is cancelled
  // by terminating its worker. The page compiles the WebAssembly once and
  // hands the module to each new worker, so restarting is quick.
  // Each page load asks for the compiler's files afresh (`?load=…`), so a
  // browser that cached an older worker or bundle can't mix it with the rest.
  const LOAD = `?load=${Date.now()}`;
  const wasm = fetch(new URL(`pkg/stitchwort_web_bg.wasm${LOAD}`, import.meta.url))
    .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.arrayBuffer(); })
    .then((bytes) => WebAssembly.compile(bytes));

  /** A worker that has answered: workers can run here. */
  let workersWork = false;

  class Compiler {
    worker = null;
    pending = null;
    nextId = 0;

    /**
     * Runs `request` and resolves to { out } (the compiler's answer),
     * { crashed, error }, { timedOut } or { cancelled }. A call while
     * another is running cancels that one. A run's output is passed to
     * `onOutput` as it's printed.
     */
    async call(request, seconds, onOutput) {
      this.cancel();
      let module;
      try {
        module = await wasm;
      } catch (e) {
        return { crashed: true, error: String(e), noCompiler: true };
      }
      this.cancel();
      return new Promise((resolve) => {
        const id = ++this.nextId;
        const timer = setTimeout(() => this.finish(id, { timedOut: true, seconds }), seconds * 1000);
        this.pending = { id, resolve, timer, onOutput };
        try {
          if (!this.worker) this.start();
          this.worker.postMessage({ ...request, id, module });
        } catch (e) {
          this.finish(id, { crashed: true, error: String(e), noWorker: true });
        }
      });
    }

    /** Stops the running request, if there is one. */
    cancel() {
      if (this.pending) this.finish(this.pending.id, { cancelled: true });
    }

    start() {
      const worker = new Worker(new URL(`playground-worker.js${LOAD}`, import.meta.url), { type: "module" });
      worker.onmessage = ({ data }) => {
        workersWork = true;
        if ("output" in data) {
          if (this.pending?.id === data.id) this.pending.onOutput?.(data.output);
        } else {
          this.finish(data.id, data);
        }
      };
      worker.onerror = (e) => {
        e.preventDefault();
        this.finish(this.pending?.id, { crashed: true, error: e.message || "the worker failed", noWorker: !workersWork });
      };
      this.worker = worker;
    }

    finish(id, result) {
      if (!this.pending || this.pending.id !== id) return;
      const { resolve, timer } = this.pending;
      this.pending = null;
      clearTimeout(timer);
      if (!result.out) {
        // Crashed, too slow or cancelled: this worker can't be trusted, or
        // is still busy. Start afresh next time.
        this.worker?.terminate();
        this.worker = null;
      }
      resolve(result);
    }
  }

  // If workers can't start here (a host that forbids them), the compiler
  // runs in the page instead: it can't be stopped, and after a crash the
  // page has to be reloaded.
  class InPage {
    broken = null;
    async call(request, seconds, onOutput) {
      if (this.broken) return { crashed: true, error: this.broken, inPage: true };
      try {
        const compiler = await import(`./pkg/stitchwort_web.js${LOAD}`);
        await compiler.default({ module_or_path: await wasm });
        const sink = { write: (text) => onOutput?.(text) };
        // As in playground-worker.js: a request with `paths` is for a project.
        const answer = request.paths ? {
          outline: () => compiler.outline_project(request.paths, request.texts),
          check: () => compiler.check_project(request.paths, request.texts, request.targets),
          checkall: () => compiler.check_project(request.paths, request.texts, ""),
          test: () => compiler.test_project(request.paths, request.texts, request.targets, request.known ?? ""),
          evaluate: () => compiler.evaluate_project(request.paths, request.texts, request.targets, request.expr),
          extract: () => compiler.extract_project(request.paths, request.texts, request.namespace),
          run: () => compiler.run_project_streaming(request.paths, request.texts, request.name, request.input, request.maxOutput, sink),
        }[request.action] : {
          check: () => compiler.check(request.source),
          test: () => compiler.test(request.source, request.known ?? ""),
          evaluate: () => compiler.evaluate(request.source, request.expr),
          extract: () => compiler.extract(request.source),
          run: () => compiler.run_streaming(request.source, request.input, request.maxOutput, sink),
        }[request.action];
        return { out: JSON.parse(answer()) };
      } catch (e) {
        this.broken = `${e?.name ?? "Error"}: ${e?.message ?? e}`;
        return { crashed: true, error: this.broken, inPage: true };
      }
    }
    cancel() {}
  }

  /** Checking, testing, evaluating and extracting. */
  let checker = new Compiler();
  /** Running `main`, separately, so editing stays responsive during a run. */
  let runner = new Compiler();

  /** If the worker couldn't start at all, switches to the in-page compiler. */
  function fallBack(result) {
    if (!result.noWorker || workersWork || checker instanceof InPage) return false;
    console.warn("The playground's worker didn't start, so the compiler runs in the page:", result.error);
    checker = runner = new InPage();
    return true;
  }

  // What a crash or timeout means, for the person using the page.
  function trouble(result) {
    if (result.noCompiler) {
      return "This page runs the Stitchwort compiler as WebAssembly, and it couldn’t start here: " + result.error;
    }
    if (result.inPage) {
      return `The compiler crashed (${result.error}). Reload the page to restart it.`;
    }
    if (result.timedOut) {
      return `The compiler took longer than ${result.seconds} s, so it was stopped.`;
    }
    return `The compiler crashed (${result.error}). This can happen with very deeply nested ` +
      "programs or values. It has been restarted; change the program to try again.";
  }

  /**
   * Asks the checker; resolves to the compiler's answer, or to null after
   * showing what went wrong (or nothing, if the request was superseded).
   */
  /**
   * The compiler's last answer to each of these, with the source it was for:
   * switching tabs reuses them instead of checking the same source again.
   */
  const answers = new Map();
  const REMEMBERED = new Set(["check", "test", "extract", "outline"]);
  /** What an answer is for: the source, or a project's files and targets. */
  const keyOf = (request) => request.paths
    ? JSON.stringify([request.texts, request.targets, request.namespace]) : request.source;

  async function ask(request) {
    const remember = REMEMBERED.has(request.action);
    const hit = remember && answers.get(request.action);
    if (hit && hit.source === keyOf(request)) return hit.out;
    let result = await checker.call(request, CHECK_SECONDS);
    if (fallBack(result)) result = await checker.call(request, CHECK_SECONDS);
    if (result.out) {
      if (remember) answers.set(request.action, { source: keyOf(request), out: result.out });
      return result.out;
    }
    if (!result.cancelled) {
      setStatus(result.noCompiler ? "The compiler didn’t load" : result.timedOut ? "Took too long" : "The compiler crashed", "bad");
      output.replaceChildren(el("p", {}, trouble(result)));
    }
    return null;
  }

  // Running `main`. The controls persist across renders, so the input and the
  // last run's output stay while switching tabs.
  const runInput = el("textarea", { id: "run-input", spellcheck: false, rows: 4,
                                    placeholder: "Input, a line per IO.readLine (), or the rest at once with IO.readAll ()" });
  runInput.setAttribute("aria-label", "Input lines for the program");
  const runAgain = el("button", { className: "primary", type: "button" }, "Run");
  const stopButton = el("button", { type: "button", disabled: true }, "Stop");
  const runResult = el("div", { className: "run-result" });
  const runChecked = el("div");
  const runStale = el("p", { className: "hint", hidden: true }, "The source has changed since this run.");
  let ranSource = null;

  /** The open project: the manifest, the files, and what's open; or null. */
  let project = null;
  const runHint = el("p", { className: "hint" });
  /** The run panel's explanation, for `main` of the program or of a project's day. */
  function setRunHint() {
    const main = project ? project.manifest.days[project.day].main : "main";
    runButton.title = `Run ${main} (Ctrl+Enter)`;
    runHint.textContent =
      `Run calls ${project ? main : "main"} (). Its IO.readLine () gets the lines below, one at a time, then Nothing; ` +
      "IO.readAll () gets all that's left at once. " +
      `A run may print up to ${MAX_OUTPUT / 1024} KB and take up to ${RUN_SECONDS} s.` +
      (project ? " The input starts as the day's example." : "");
  }
  setRunHint();

  /** Chooses one of the day's bundled inputs (a project only). */
  const inputChoice = el("select", { id: "input-choice", hidden: true });
  inputChoice.setAttribute("aria-label", "Fill the input from a bundled one");

  const runPanel = [
    runHint,
    inputChoice,
    runInput,
    el("div", { className: "runrow" }, runAgain, stopButton),
    runChecked,
    runStale,
    runResult,
  ];

  async function runMain() {
    selectView("run");
    const src = stateKey();
    runButton.disabled = runAgain.disabled = true;
    stopButton.disabled = false;
    // The output shows as it's printed: the worker sends each line, and the
    // lines that arrive between frames are added together.
    const shown = el("pre", { className: "program-output" });
    const running = el("p", { className: "hint" }, "Running…");
    runResult.replaceChildren(running);
    let printed = "";
    let unshown = "";
    let ended = false;
    const onOutput = (text) => {
      if (!unshown) {
        requestAnimationFrame(() => {
          if (ended) return;
          if (!shown.isConnected) runResult.replaceChildren(el("h2", {}, "Output"), shown, running);
          shown.append(unshown);
          unshown = "";
        });
      }
      printed += text;
      unshown += text;
    };
    const request = requestFor("run", { input: runInput.value, maxOutput: MAX_OUTPUT,
                                        name: project?.manifest.days[project.day].main });
    const started = performance.now();
    let result = await runner.call(request, RUN_SECONDS, onOutput);
    if (fallBack(result)) result = await runner.call(request, RUN_SECONDS, onOutput);
    const took = performance.now() - started;
    ended = true;
    runButton.disabled = runAgain.disabled = false;
    stopButton.disabled = true;
    ranSource = src;
    runStale.hidden = true;

    const parts = [];
    const out = result.out;
    if (out?.ran || printed || result.cancelled || result.timedOut) {
      parts.push(el("h2", {}, "Output"),
                 printed ? el("pre", { className: "program-output" }, printed)
                         : el("p", { className: "hint" }, "Nothing was printed."));
    }
    if (out?.ok) {
      parts.push(el("p", { className: "summary" }, `Finished in ${secs(took)}.`));
    } else if (out) {
      parts.push(...errorsView(out.errors));
    } else if (result.cancelled) {
      parts.push(el("p", {}, `Stopped after ${secs(took)}.`));
    } else if (result.timedOut) {
      parts.push(el("p", {}, `Stopped after ${RUN_SECONDS} s, the longest a run may take.`));
    } else {
      parts.push(el("p", {}, trouble(result)));
    }
    runResult.replaceChildren(...parts);
  }

  runButton.addEventListener("click", runMain);
  runAgain.addEventListener("click", runMain);
  stopButton.addEventListener("click", () => runner.cancel());
  runInput.addEventListener("input", () => {
    if (project) store(inputKey(project.manifest.days[project.day].main), runInput.value);
    else store("stitchwort.input", runInput.value);
  });

  // ---- Projects (docs/proposals/playground-projects.md) ------------------
  // A project is a folder of files bundled with the page (pkg/projects/NAME/):
  // a manifest, its sources, and example inputs. The Example dropdown has a
  // group with one entry per day; every day opens the same project, so a
  // saved edit to a shared file shows on every day. While one is open,
  // `source` shows the open file; the others' texts are in `project.texts`.
  // The compiler is sent every file each time, with the day's namespaces as
  // the target.

  const filebar = document.getElementById("filebar");
  const fileTabs = document.getElementById("filetabs");
  const otherFiles = document.getElementById("other-files");
  const resetFile = document.getElementById("reset-file");
  const resetProject = document.getElementById("reset-project");
  const resetConfirm = document.getElementById("reset-confirm");
  const banner = document.getElementById("banner");

  /** The open project: the manifest, the files, and what's open; or null. */
  // (declared with the run panel, which needs it)
  let manifestPromise = null;
  let bundlePromise = null;

  const PROJECT_KEYS = "stitchwort.project.aoc.";
  const fileKey = (path) => `${PROJECT_KEYS}file.${path}`;
  const inputKey = (main) => `${PROJECT_KEYS}input.${main}`;
  /** A short hash of a text, to tell which bundled text an edit was made from. */
  function shortHash(text) {
    let h = 0x811c9dc5;
    for (let i = 0; i < text.length; i++) h = Math.imul(h ^ text.charCodeAt(i), 0x01000193);
    return (h >>> 0).toString(16);
  }

  const projectUrl = (path) => new URL(`pkg/projects/aoc/${path}${LOAD}`, import.meta.url);

  /** The manifest, or null if this build has no project. */
  function fetchManifest() {
    manifestPromise ??= fetch(projectUrl("manifest.json"))
      .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .catch(() => null);
    return manifestPromise;
  }

  /** The project's files, with the saved edits applied. */
  function fetchProject(manifest) {
    bundlePromise ??= Promise.all(manifest.files.map((path) =>
      fetch(projectUrl(path)).then((r) => { if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`); return r.text(); })))
      .then((texts) => {
        const bundled = new Map(manifest.files.map((path, i) => [path, texts[i]]));
        const state = { manifest, bundled, texts: new Map(bundled), stale: new Map(), dropped: [], day: 0, open: "",
                        extras: new Set(), outlineTabs: null, errors: new Set(), namespaceOf: new Map(), carets: new Map(),
                        examples: new Map() };
        for (const path of manifest.files) {
          let saved = null;
          try { saved = JSON.parse(stored(fileKey(path))); } catch {}
          if (!saved || typeof saved.text !== "string") continue;
          if (saved.text === bundled.get(path)) { forget(fileKey(path)); continue; }
          state.texts.set(path, saved.text);
          // The bundled file changed since the edit: keep the edit, and ask.
          if (saved.from !== shortHash(bundled.get(path))) state.stale.set(path, saved.from);
        }
        try {
          const prefix = `${PROJECT_KEYS}file.`;
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key.startsWith(prefix) && !bundled.has(key.slice(prefix.length))) state.dropped.push(key);
          }
          for (const key of state.dropped) forget(key);
        } catch {}
        return state;
      });
    return bundlePromise;
  }

  /** What a render or a run is for: the source, or the day with every file's text. */
  const stateKey = () => project
    ? JSON.stringify([project.day, project.manifest.files.map((p) => project.texts.get(p))]) : source.value;

  /** A compiler request for the open program or project. */
  function requestFor(action, extra = {}) {
    if (!project) return { action, source: source.value, ...extra };
    const { manifest } = project;
    return { action, paths: manifest.files, texts: manifest.files.map((p) => project.texts.get(p)),
             targets: manifest.days[project.day].namespaces.join(","), ...extra };
  }

  const isEdited = (path) => project.texts.get(path) !== project.bundled.get(path);

  /** A tab's label: the path from the day's folder (or from `Aoc/`, for the shared files). */
  function tabLabel(path) {
    const day = project.manifest.days[project.day];
    const dayFolder = day.open.replace(/[^/]*$/, "");
    return path.startsWith(dayFolder) ? path.slice(dayFolder.length) : path.replace(/^src\/Aoc\//, "");
  }

  /** The day's files before the compiler has said which they are. */
  function initialTabs() {
    const day = project.manifest.days[project.day];
    const folder = day.open.replace(/[^/]*$/, "");
    return [day.open, ...project.manifest.files.filter((p) => p.startsWith(`${folder}Proofs/`))];
  }

  function tabPaths() {
    const list = [...(project.outlineTabs ?? initialTabs())];
    for (const path of [...project.extras, project.open]) if (!list.includes(path)) list.push(path);
    return list;
  }

  function renderTabs() {
    const paths = tabPaths();
    fileTabs.replaceChildren(...paths.map((path) => {
      const tab = el("button", { type: "button", role: "tab", title: path }, tabLabel(path));
      tab.dataset.path = path;
      tab.setAttribute("aria-selected", String(path === project.open));
      if (project.errors.has(path)) {
        tab.dataset.errors = "";
        tab.append(el("span", { className: "mark", title: "has errors" }, "!"));
      }
      if (isEdited(path)) {
        tab.dataset.edited = "";
        tab.append(el("span", { className: "mark edited", title: "edited" }, "•"));
      }
      tab.addEventListener("click", () => openFile(path));
      return tab;
    }));
    const others = project.manifest.files.filter((p) => !paths.includes(p));
    otherFiles.replaceChildren(el("option", { value: "" }, "Other files…"),
      ...others.map((p) => el("option", { value: p }, p.replace(/^src\/Aoc\//, ""))));
    otherFiles.hidden = others.length === 0;
    resetFile.disabled = !isEdited(project.open);
    resetProject.disabled = !project.manifest.files.some(isEdited);
  }

  function renderBanner() {
    const parts = [];
    const { open } = project;
    if (project.stale.has(open)) {
      const use = el("button", { type: "button", id: "use-new" }, "Use the new version");
      const keep = el("button", { type: "button", id: "keep-mine" }, "Keep mine");
      use.addEventListener("click", () => {
        project.stale.delete(open);
        project.texts.set(open, project.bundled.get(open));
        showFile();
        refresh();
      });
      keep.addEventListener("click", () => {
        project.stale.delete(open);
        saveOpenFile();
        renderBanner();
      });
      parts.push(el("span", {}, `${tabLabel(open)} has changed since you edited it.`), use, keep);
    }
    if (project.dropped.length) {
      const ok = el("button", { type: "button" }, "OK");
      ok.addEventListener("click", () => { project.dropped = []; renderBanner(); });
      parts.push(el("span", {}, `${project.dropped.length === 1 ? "A saved edit was" : `${project.dropped.length} saved edits were`} dropped: ` +
                                "the file is no longer in the project."), ok);
    }
    banner.replaceChildren(...parts);
    banner.hidden = parts.length === 0;
  }

  /** Puts the open file in the editor. */
  function showFile() {
    source.value = project.texts.get(project.open);
    const caret = project.carets.get(project.open);
    if (caret) {
      source.setSelectionRange(caret.start, caret.end);
      source.scrollTop = caret.top;
      source.scrollLeft = caret.left;
    }
    paint();
    renderTabs();
    renderBanner();
  }

  /** Saves the editor's text as the open file's (an edit, if it differs from the bundled). */
  function saveOpenFile() {
    const path = project.open;
    const text = source.value;
    const bundled = project.bundled.get(path);
    project.texts.set(path, text);
    if (text === bundled) {
      forget(fileKey(path));
      project.stale.delete(path);
    } else {
      store(fileKey(path), JSON.stringify({ text, from: project.stale.get(path) ?? shortHash(bundled) }));
    }
    renderTabs();
  }

  function rememberCaret() {
    project.carets.set(project.open, { start: source.selectionStart, end: source.selectionEnd,
                                        top: source.scrollTop, left: source.scrollLeft });
  }

  function openFile(path) {
    if (project.open !== path) {
      rememberCaret();
      if (!tabPaths().includes(path)) project.extras.add(path);
      project.open = path;
      store(`${PROJECT_KEYS}open`, path);
    }
    showFile();
    render();
  }

  /** Opens a file with the caret at `line`, `column` (counted from 1). */
  function goTo(path, line, column) {
    openFile(path);
    const lines = source.value.split("\n");
    let offset = 0;
    for (let i = 0; i < line - 1 && i < lines.length; i++) offset += lines[i].length + 1;
    offset = Math.min(offset + column - 1, source.value.length);
    source.focus();
    source.setSelectionRange(offset, offset);
    const lineHeight = parseFloat(getComputedStyle(source).lineHeight) || 20;
    source.scrollTop = Math.max(0, (line - 4) * lineHeight);
    align();
  }

  /** Works out the day's tabs from the compiler's outline: the day's program, its proofs, then what they use. */
  function useOutline(outline) {
    const day = project.manifest.days[project.day];
    const byName = new Map(outline.namespaces.map((n) => [n.name, n]));
    project.namespaceOf = new Map(outline.namespaces.flatMap((n) => n.files.map((f) => [f, n.name])));
    const own = new Set(day.namespaces);
    const used = new Set();
    const visit = (name) => {
      if (used.has(name) || !byName.has(name)) return;
      used.add(name);
      byName.get(name).uses.forEach(visit);
    };
    day.namespaces.forEach(visit);
    const files = (name) => [...(byName.get(name)?.files ?? [])].sort();
    const shared = [...used].filter((n) => !own.has(n)).flatMap(files).sort();
    const tabs = [...day.namespaces.flatMap(files), ...shared];
    if (JSON.stringify(tabs) !== JSON.stringify(project.outlineTabs)) {
      project.outlineTabs = tabs;
      renderTabs();
    }
  }

  /** Checks from the errors' files which tabs get the red mark. */
  function markErrors(diagnostics = []) {
    const files = new Set(diagnostics.filter((d) => d.severity === "error" && d.file).map((d) => d.file));
    if ([...files].sort().join() !== [...project.errors].sort().join()) {
      project.errors = files;
      renderTabs();
    }
  }

  /** The errors of a project check, grouped by file, each with a link to its place in the file. */
  function projectErrorsView(answer) {
    const groups = new Map();
    for (const d of answer.diagnostics ?? []) {
      if (d.severity !== "error") continue;
      const key = d.file ?? "";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(d);
    }
    if (groups.size === 0) return errorsView(answer.errors, answer.warnings);
    const views = [];
    for (const [file, found] of groups) {
      const group = el("div", { className: "errorfile" });
      if (file) group.dataset.file = file;
      for (const d of found) {
        if (file) {
          const jump = el("button", { type: "button", className: "jump" }, `${file}:${d.line}:${d.column}`);
          jump.addEventListener("click", () => goTo(file, d.line, d.column));
          group.append(jump);
        }
        group.append(el("pre", { className: "errors" }, d.text));
      }
      views.push(el("h2", {}, "Errors" + (file ? ` in ${tabLabel(file)}` : "")), group);
    }
    return [...views, ...warningsView(answer.warnings)];
  }

  async function loadProject(index, openPath) {
    const manifest = await fetchManifest();
    if (!manifest) return loadExample("ex-lists");
    let state;
    try {
      state = await fetchProject(manifest);
    } catch (e) {
      setStatus("The project didn’t load", "bad");
      output.replaceChildren(el("p", {}, `The bundled project couldn’t be fetched: ${e.message}`));
      return;
    }
    if (project) rememberCaret();
    project = state;
    const day = manifest.days[Math.min(index, manifest.days.length - 1)];
    project.day = manifest.days.indexOf(day);
    project.open = openPath && manifest.files.includes(openPath) ? openPath : day.open;
    project.extras = new Set();
    project.outlineTabs = null;
    project.errors = new Set();
    picker.value = `aoc:${project.day}`;
    filebar.hidden = false;
    store("stitchwort.example", `aoc:${project.day}`);
    store(`${PROJECT_KEYS}open`, project.open);
    evalInput = day.main === "Aoc.Day02.main" ? "Aoc.Day02.solvePart1 Aoc.Day02.exampleRanges" : `${day.main.replace(/main$/, "example")}`;
    // The Run input: what was saved for this day, else the day's first
    // bundled input (the example).
    inputChoice.replaceChildren(el("option", { value: "" }, "Input…"),
      ...(day.inputs ?? []).map((choice) => el("option", { value: choice.path }, choice.title)));
    inputChoice.hidden = !(day.inputs ?? []).length;
    let input = stored(inputKey(day.main));
    if (input === null) input = (await bundledInput(day.inputs?.[0]?.path)) ?? "";
    runInput.value = input;
    setRunHint();
    runResult.replaceChildren();
    ranSource = null;
    showFile();
    refresh();
  }

  /** A bundled input's text, or null. */
  async function bundledInput(path) {
    if (!path) return null;
    try {
      const r = await fetch(projectUrl(path));
      return r.ok ? await r.text() : null;
    } catch { return null; }
  }

  inputChoice.addEventListener("change", async () => {
    const path = inputChoice.value;
    inputChoice.value = "";
    const text = await bundledInput(path);
    if (text === null) return;
    runInput.value = text;
    runInput.dispatchEvent(new Event("input"));
  });

  /** Adds the project's days to the Example dropdown. */
  function addProjectGroup(manifest) {
    if (!manifest) return;
    const group = el("optgroup", { label: manifest.title });
    manifest.days.forEach((day, i) => group.append(el("option", { value: `aoc:${i}` }, day.title)));
    picker.append(group);
    if (project) picker.value = `aoc:${project.day}`;
  }

  otherFiles.addEventListener("change", () => {
    const path = otherFiles.value;
    otherFiles.value = "";
    if (path) openFile(path);
  });
  resetFile.addEventListener("click", () => {
    project.stale.delete(project.open);
    project.texts.set(project.open, project.bundled.get(project.open));
    showFile();
    saveOpenFile();
    refresh();
  });
  resetProject.addEventListener("click", () => { resetProject.hidden = true; resetConfirm.hidden = false; });
  document.getElementById("reset-no").addEventListener("click", () => { resetProject.hidden = false; resetConfirm.hidden = true; });
  document.getElementById("reset-yes").addEventListener("click", () => {
    resetProject.hidden = false;
    resetConfirm.hidden = true;
    for (const path of project.manifest.files) forget(fileKey(path));
    project.texts = new Map(project.bundled);
    project.stale.clear();
    showFile();
    refresh();
  });

  async function loadExample(id) {
    if (id.startsWith("aoc:")) return loadProject(Number(id.slice(4)) || 0);
    project = null;
    filebar.hidden = true;
    banner.hidden = true;
    setRunHint();
    const ex = document.getElementById(id) || examples[0];
    picker.value = ex.id;
    source.value = ex.textContent.replace(/^\n/, "");
    evalInput = { "ex-lists": "reverse [1, 2, 3]", "ex-division": "safeDiv 9 0",
                  "ex-tests": "double 21", "ex-js": "applyDiscount 8 25",
                  "ex-main": 'printed ["Ada", "1", "2"]' }[ex.id] || "";
    runInput.value = { "ex-main": "Ada\n40\ntwo\n2\n" }[ex.id] || "";
    runResult.replaceChildren();
    store("stitchwort.example", ex.id);
    store("stitchwort.input", runInput.value);
    refresh();
  }

  function setStatus(text, kind) {
    status.textContent = text;
    status.className = "status " + (kind || "");
  }

  /** The errors, then the warnings, if any (from a check's answer). */
  function errorsView(errors, warnings) {
    return [el("h2", {}, "Errors"), el("pre", { className: "errors" }, errors), ...warningsView(warnings)];
  }

  function warningsView(warnings = []) {
    return warnings.length ? [el("h2", {}, "Warnings"), el("pre", { className: "warnings" }, warnings.join(""))] : [];
  }

  /** Shows how many warnings there are, next to the status. */
  function setWarnings(warnings = []) {
    const n = warnings.length;
    warningCount.hidden = n === 0;
    warningCount.textContent = n === 1 ? "1 warning" : `${n} warnings`;
  }

  /** Each render has a number; a newer one supersedes it. */
  let rendering = 0;

  async function render() {
    const current = ++rendering;
    const src = stateKey();
    delete output.dataset.for;
    if (view === "run") {
      output.replaceChildren(...runPanel);
      runStale.hidden = ranSource === null || ranSource === src;
    }
    if (project) {
      // Which files the day is made of (parsing only), for the tabs.
      const outline = await ask(requestFor("outline"));
      if (current !== rendering) return;
      if (outline?.ok) useOutline(outline);
    }
    const checked = await ask(requestFor("check"));
    if (current !== rendering) return;
    setWarnings(checked?.warnings);
    if (!checked) return;
    if (project) markErrors(checked.diagnostics);
    const day = project?.manifest.days[project.day];
    setStatus(checked.ok
      ? (day ? `${day.title}${day.namespaces.length > 1 ? " and its proofs" : ""} checked by the kernel` : "Checked by the kernel")
      : "Doesn’t check", checked.ok ? "" : "bad");
    /** The errors, with links to their files in a project. */
    const errorsOf = (answer) => project ? projectErrorsView(answer) : errorsView(answer.errors, answer.warnings);

    if (view === "run") {
      runChecked.replaceChildren(...(checked.ok ? [] :
        [el("p", { className: "hint" }, "This doesn’t check yet."), ...errorsOf(checked)]));
      return;
    }

    output.replaceChildren();
    if (view === "check") {
      if (checked.ok) {
        output.append(
          el("p", {}, "Every definition type-checks, every recursive function terminates, and every proof holds. The kernel re-checked them all."),
          el("p", { className: "hint" }, "Edit the source to see errors as you type. The Tests, Evaluate, JavaScript and Run tabs use the same program."),
          ...warningsView(checked.warnings));
      } else {
        output.append(...errorsOf(checked));
      }
      if (project) {
        // Edits to shared files can break another day: check them all.
        const all = el("div", { id: "check-all-result" });
        const button = el("button", { id: "check-all", type: "button", className: "hint" }, "Check every day");
        button.addEventListener("click", async () => {
          all.replaceChildren(el("p", { className: "hint" }, "Checking every day…"));
          const result = await ask(requestFor("checkall"));
          if (current !== rendering || !result) return;
          all.replaceChildren(...(result.ok
            ? [el("p", { className: "summary" }, `Every day checked: ${result.checked.length} namespaces.`)]
            : projectErrorsView(result)));
          markErrors(result.diagnostics);
        });
        output.append(button, all);
      }
      return;
    }

    if (!checked.ok) {
      output.append(el("p", { className: "hint" }, "Fix the errors first; the Check tab shows them."),
                    ...errorsOf(checked));
      return;
    }

    if (view === "tests") {
      output.append(el("p", { className: "hint" }, "Running the tests…"));
      const result = await ask(requestFor("test", { known: stored(TEST_CACHE) ?? "" }));
      if (result) rememberTests(result.added);
      if (current !== rendering || !result) return;
      output.replaceChildren();
      output.dataset.for = src; // which source these results are for (the browser tests wait on it)
      if (result.tests.length === 0) {
        output.append(el("p", { className: "hint" }, 'No tests yet. Add one: test "name" := leq (1 + 1) 2'));
        return;
      }
      const lists = [];
      let list = null;
      let group = null;
      for (const t of result.tests) {
        const unfinished = t.outcome !== "passed" && t.outcome !== "failed";
        // In a project, the tests are grouped by namespace, as the CLI prints them.
        if (!list || (project && t.namespace !== group)) {
          group = t.namespace;
          list = el("ul", { className: "tests" });
          if (project) list.dataset.namespace = group;
          lists.push(list);
        }
        list.append(el("li", { className: t.passed ? "pass" : "fail" },
          el("span", { className: "mark" }, t.passed ? "✓" : unfinished ? "!" : "✗"),
          el("span", {}, t.name + (t.passed ? "" : unfinished ? ` (${t.outcome})` : " (evaluated to False)")),
          el("span", { className: "how" }, t.cached ? "cached" : "ran")));
      }
      const failed = result.tests.filter((t) => t.outcome === "failed").length;
      const unfinished = result.tests.filter((t) => !t.passed && t.outcome !== "failed").length;
      const cached = result.tests.filter((t) => t.cached).length;
      const forgetButton = el("button", { id: "forget-cache", className: "hint", type: "button" }, "Forget cached results");
      forgetButton.addEventListener("click", () => { forget(TEST_CACHE); answers.delete("test"); render(); });
      const shown = project
        ? lists.flatMap((l) => [el("h3", { className: "testgroup" }, l.dataset.namespace), l]) : lists;
      output.append(...shown, el("p", { className: "summary" },
        `${result.tests.length} test${result.tests.length === 1 ? "" : "s"}: ${result.tests.length - failed - unfinished} passed, ${failed} failed` +
        (unfinished ? `, ${unfinished} ran out of resources` : "") +
        (cached ? ` (${cached} from the cache)` : "")), forgetButton);
      return;
    }

    if (view === "eval") {
      const input = el("input", { type: "text", id: "eval-input", value: evalInput, spellcheck: false,
                                  placeholder: "an expression, e.g. List.length [1, 2]" });
      input.setAttribute("aria-label", "Expression to evaluate");
      const go = el("button", { className: "primary", type: "submit" }, "Evaluate");
      const form = el("form", { className: "evalrow" }, input, go);
      const answer = el("div");
      const evaluate = async() => {
        evalInput = input.value;
        answer.replaceChildren(el("p", { className: "hint" }, "Evaluating…"));
        const result = await ask(requestFor("evaluate", { expr: input.value }));
        if (current !== rendering || !result) return;
        answer.replaceChildren(result.ok
          ? el("div", { className: "result" }, result.value, el("span", { className: "type" }, ": " + result.type))
          : el("pre", { className: "errors" }, result.errors));
      };
      form.addEventListener("submit", (e) => { e.preventDefault(); evaluate(); });
      output.append(form, answer);
      if (input.value) evaluate();
      return;
    }

    if (view === "js") {
      // In a project, the open file's namespace (as `build --js NS`).
      const namespace = project?.namespaceOf.get(project.open);
      if (project && !namespace) {
        output.append(el("p", { className: "hint" }, "This file’s namespace isn’t known yet."));
        return;
      }
      const result = await ask(requestFor("extract", { namespace }));
      if (current !== rendering || !result) return;
      if (!result.ok) { output.append(...errorsView(result.errors)); return; }
      if (!/export declare function/.test(result.dts)) {
        output.append(el("p", { className: "hint" }, "Nothing is exported. Put `export` on the line before a function's signature."));
        return;
      }
      output.append(el("h2", {}, "TypeScript declarations"), el("pre", {}, result.dts),
                    el("h2", {}, "ES module"), el("pre", {}, result.js));
    }
  }

  // Syntax colouring. This follows the lexer (crates/syntax/src/lexer.rs):
  // its keywords, `--` line comments (there are no block comments), names
  // that may contain `'`, and string and character literals that end at the
  // closing quote or the end of the line, with `\` escaping the next
  // character. A string's `${…}` interpolation holds ordinary code, braces
  // and all, delimited in its own colour. `auto` is only a keyword as the
  // first word in `[…]`, as in the parser. A name after `def` or `theorem`
  // is being defined; `:=` and `=>` are coloured as operators, like the rest
  // of the punctuation. One pass over the text, so a long paste stays quick.
  const KEYWORDS = new Set(["type", "def", "theorem", "export", "test", "if", "then", "else",
                            "ability", "where", "handle", "with", "match", "return", "let", "Type", "Prop",
                            "namespace", "import", "calc", "rewrite"]);
  const KINDS = ["keyword", "name", "defined", "number", "string", "interp", "comment", "operator"];
  const isWordStart = (c) => (c >= "a" && c <= "z") || (c >= "A" && c <= "Z") || c === "_";
  const isWord = (c) => isWordStart(c) || (c >= "0" && c <= "9") || c === "'";
  const isDigit = (c) => c >= "0" && c <= "9";
  const escapeHtml = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

  /** Calls `mark(kind, start, end)` for each coloured stretch of `text`, in order. */
  function colour(text, mark) {
    // Neighbours of the same kind, like the two halves of `) ->`, merge.
    let kind = "", from = 0, to = 0;
    const add = (k, start, end) => {
      if (k === kind && start === to) { to = end; return; }
      if (kind) mark(kind, from, to);
      kind = k; from = start; to = end;
    };
    // The modes we're inside, outermost first: code (with its brace depth,
    // when it is an interpolation) or a string. Code inside `${…}` goes
    // through the same tokenizer as the top level, so nested strings, braces
    // and comments behave as they do in the lexer.
    const modes = [{ code: true, depth: 0, interp: false }];
    let i = 0;
    let previous = "";
    while (i < text.length) {
      const mode = modes[modes.length - 1];
      const start = i;
      if (!mode.code) {
        // A string, from its opening quote or from just after an
        // interpolation, up to its closing quote, the next `${`, or the end
        // of the line. Escapes, including `\$`, stay inside the string.
        while (i < text.length && text[i] !== "\n" && text[i] !== '"'
               && !(text[i] === "$" && text[i + 1] === "{")) {
          i += text[i] === "\\" && text[i + 1] !== "\n" ? 2 : 1;
        }
        const stop = Math.min(i, text.length);
        if (stop < text.length && text[stop] === '"') {
          i = stop + 1;
          add("string", mode.start, i);
          modes.pop();
          previous = '"';
        } else if (stop < text.length && text[stop] === "$") {
          if (stop > mode.start) add("string", mode.start, stop);
          add("interp", stop, stop + 2);
          i = stop + 2;
          modes.push({ code: true, depth: 0, interp: true });
          previous = "$";
        } else {
          if (stop > mode.start) add("string", mode.start, stop);
          i = stop;
          modes.pop();
          previous = '"';
        }
        continue;
      }
      const c = text[i];
      if (c === "\n") {
        i++;
      } else if (c === " " || c === "\r" || c === "\t") {
        i++;
      } else if (c === "-" && text[i + 1] === "-") {
        i = text.indexOf("\n", i);
        if (i < 0) i = text.length;
        add("comment", start, i);
      } else if (isWordStart(c)) {
        while (i < text.length && isWord(text[i])) i++;
        const word = text.slice(start, i);
        const k = KEYWORDS.has(word) || (word === "auto" && previous === "[") ? "keyword"
          : word !== "_" && (previous === "def" || previous === "theorem") ? "defined"
          : c >= "A" && c <= "Z" ? "name"
          : "";
        if (k) add(k, start, i);
        previous = word;
      } else if (isDigit(c)) {
        while (i < text.length && isDigit(text[i])) i++;
        add("number", start, i);
        previous = "0";
      } else if (c === '"') {
        modes.push({ code: false, start });
        i++;
      } else if (c === "'") {
        i++;
        while (i < text.length && text[i] !== "\n" && text[i] !== "'") {
          i += text[i] === "\\" && text[i + 1] !== "\n" ? 2 : 1;
        }
        if (text[i] === "'") i++;
        add("string", start, Math.min(i, text.length));
        previous = c;
      } else if (c === "{" && mode.interp) {
        mode.depth++;
        i++;
        add("operator", start, i);
        previous = c;
      } else if (c === "}" && mode.interp && mode.depth === 0) {
        i++;
        add("interp", start, i);
        modes.pop();
        modes[modes.length - 1].start = i;
        previous = c;
      } else if (c === "}" && mode.interp) {
        mode.depth--;
        i++;
        add("operator", start, i);
        previous = c;
      } else {
        i++;
        add("operator", start, i);
        previous = c;
      }
    }
    add("", text.length, text.length);
  }

  const highlighted = document.getElementById("highlight");

  // Where the browser has the CSS Custom Highlight API, the copy stays one
  // text node and the colours are ranges over it. Spans would be simpler, but
  // each rounds its width a little, so on a long line the copy drifts away
  // from the textarea's text. Elsewhere, spans.
  const marks = typeof Highlight === "function" && CSS.highlights
    ? Object.fromEntries(KINDS.map((kind) => {
        const marked = new Highlight();
        CSS.highlights.set(`hl-${kind}`, marked);
        return [kind, marked];
      }))
    : null;

  function paint() {
    // A final newline only shows as a line in the textarea, so the copy gets
    // one more for the same height.
    const text = source.value;
    if (marks) {
      highlighted.textContent = text + "\n";
      const node = highlighted.firstChild;
      for (const marked of Object.values(marks)) marked.clear();
      colour(text, (kind, start, end) => marks[kind].add(new StaticRange(
        { startContainer: node, startOffset: start, endContainer: node, endOffset: end })));
    } else {
      const parts = [];
      let at = 0;
      colour(text, (kind, start, end) => {
        parts.push(escapeHtml(text.slice(at, start)),
                   `<span class="hl-${kind}">${escapeHtml(text.slice(start, end))}</span>`);
        at = end;
      });
      parts.push(escapeHtml(text.slice(at)), "\n");
      highlighted.innerHTML = parts.join("");
    }
    align();
  }

  /** Keeps the coloured copy under the textarea the same size and scroll. */
  function align() {
    const box = getComputedStyle(source);
    const borders = (a, b) => parseFloat(box[a]) + parseFloat(box[b]);
    highlighted.style.width = `${source.clientWidth + borders("borderLeftWidth", "borderRightWidth")}px`;
    highlighted.style.height = `${source.clientHeight + borders("borderTopWidth", "borderBottomWidth")}px`;
    highlighted.scrollTop = source.scrollTop;
    highlighted.scrollLeft = source.scrollLeft;
  }

  source.addEventListener("scroll", align);
  new ResizeObserver(align).observe(source);

  let timer = null;
  function refresh() {
    paint();
    if (project) saveOpenFile();
    else store("stitchwort.draft", source.value);
    clearTimeout(timer);
    timer = setTimeout(render, 250);
  }

  function selectView(name) {
    if (view === name) return;
    view = name;
    for (const t of tabs) t.setAttribute("aria-selected", String(t.dataset.view === name));
    store("stitchwort.view", view);
    render();
  }

  for (const tab of tabs) tab.addEventListener("click", () => selectView(tab.dataset.view));
  warningCount.addEventListener("click", () => selectView("check"));
  picker.addEventListener("change", () => loadExample(picker.value));
  source.addEventListener("input", refresh);
  source.addEventListener("keydown", (e) => {
    if (e.key === "Tab" && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      // As typing does, so that undo takes it back, and its `input` event
      // repaints. Changing the value from script (setRangeText) would clear
      // the textarea's undo history instead; that's the fallback, for a
      // browser without insertText.
      if (!document.execCommand("insertText", false, "  ")) {
        source.setRangeText("  ", source.selectionStart, source.selectionEnd, "end");
        refresh();
      }
    }
  });
  // Ctrl+Enter (⌘+Enter on a Mac) runs, from the source or the input.
  for (const box of [source, runInput]) {
    box.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !runButton.disabled) {
        e.preventDefault();
        runMain();
      }
    });
  }

  // Read the draft and input before loading the example, which overwrites them.
  const draft = stored("stitchwort.draft");
  const input = stored("stitchwort.input");
  const chosen = stored("stitchwort.example") || "ex-lists";
  function restoreDraft() {
    if (draft) { source.value = draft; refresh(); }
    if (input !== null) { runInput.value = input; store("stitchwort.input", input); }
  }
  fetchManifest().then(addProjectGroup);
  if (chosen.startsWith("aoc:")) loadProject(Number(chosen.slice(4)) || 0, stored(`${PROJECT_KEYS}open`));
  else loadExample(chosen);
  if (!chosen.startsWith("aoc:")) restoreDraft();
  const savedView = stored("stitchwort.view");
  if (savedView && tabs.some((t) => t.dataset.view === savedView)) selectView(savedView);
</script>
