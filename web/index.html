<meta charset="utf-8">
<script src="coi-serviceworker.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stitchwort Playground</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,MONO@-15..0,300..800,0..1,0..1&display=swap">
<style>
  /* Layout: a hedgerow-green tool. Source on the left, the compiler's answers on
     the right; one column on a phone. */
  :root {
    --paper: #f3f6f1;
    --petal: #fdfefc;
    --ink: #1c2a21;
    --muted: #5a6a5f;
    --line: #d5dfd2;
    --leaf: #2d6a3e;
    --leaf-soft: #e1ecdf;
    --ok: #2f7a47;
    --bad: #a83b34;
    --bad-soft: #f6e4e1;
    --warn: #865800;
    --warn-soft: #f6ecd5;
    --goal: #1f5f99;
    /* Syntax colours for the source: hedgerow flowers on the same paper. */
    --hl-keyword: #2d6a3e;
    --hl-name: #1f6470;
    --hl-defined: #2f4f8f;
    --hl-number: #7b4b94;
    --hl-string: #8a5a12;
    --hl-interp: #2d6a3e;
    --hl-comment: #627266;
    --hl-operator: #45604e;
    --hl-selection: rgb(45 106 62 / 0.2);
    --sans: "Recursive", ui-sans-serif, system-ui, sans-serif;
    --mono: "Recursive", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #111814; --petal: #0b100d; --ink: #e3ece4; --muted: #95a699;
      --line: #27332b; --leaf: #82c795; --leaf-soft: #1b2a20; --ok: #7fcb95;
      --bad: #ef8f86; --bad-soft: #2f1a18; --warn: #e3b55e; --warn-soft: #2c2412; --goal: #7db4ea; color-scheme: dark;
      --hl-keyword: #82c795; --hl-name: #7cc4c9; --hl-defined: #9db8ec; --hl-number: #c9a3e0;
      --hl-string: #e0b870; --hl-interp: #82c795; --hl-comment: #7f9184; --hl-operator: #a3b8a8;
      --hl-selection: rgb(130 199 149 / 0.25);
    }
  }
  :root[data-theme="dark"] {
    --paper: #111814; --petal: #0b100d; --ink: #e3ece4; --muted: #95a699;
    --line: #27332b; --leaf: #82c795; --leaf-soft: #1b2a20; --ok: #7fcb95;
    --bad: #ef8f86; --bad-soft: #2f1a18; --warn: #e3b55e; --warn-soft: #2c2412; --goal: #7db4ea; color-scheme: dark;
    --hl-keyword: #82c795; --hl-name: #7cc4c9; --hl-defined: #9db8ec; --hl-number: #c9a3e0;
    --hl-string: #e0b870; --hl-interp: #82c795; --hl-comment: #7f9184; --hl-operator: #a3b8a8;
    --hl-selection: rgb(130 199 149 / 0.25);
  }

  /* The page fills the window, and grows when the editor is dragged taller. */
  html { height: 100%; }
  body {
    min-height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-variation-settings: "CASL" 0, "MONO" 0;
    font-size: 15px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px;
    box-sizing: border-box;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 14px;
  }
  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 34px; height: 34px; flex: none; }
  .brand h1 {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 750;
    font-variation-settings: "CASL" 1, "slnt" 0;
    letter-spacing: -0.01em;
  }
  .brand p { margin: 0; color: var(--muted); font-size: 0.85rem; }
  .picker { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  label.small {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  select, input[type="text"], button {
    font: inherit;
    color: var(--ink);
    background: var(--petal);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
  }
  button {
    cursor: pointer;
    font-weight: 600;
  }
  button.primary { background: var(--leaf); color: var(--petal); border-color: var(--leaf); }
  button:hover { border-color: var(--leaf); }
  :focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: 16px;
  }
  @media (max-width: 820px) {
    main { grid-template-columns: minmax(0, 1fr); }
    .picker { margin-left: 0; }
  }

  .pane {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .pane-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    min-height: 36px;
  }

  /* The settings menu (the ⚙ button): a small panel under the source pane's header. */
  .pane-head { position: relative; }
  #settings-button { font-size: 1rem; padding: 4px 9px; line-height: 1; }
  #settings-menu {
    position: absolute; z-index: 20; top: calc(100% + 4px); right: 0;
    width: min(20rem, calc(100vw - 32px)); box-sizing: border-box;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18); padding: 10px 14px;
  }
  #settings-menu[hidden] { display: none; }
  #settings-menu h2 { margin: 0 0 6px; font-size: 0.9rem; }
  #settings-menu fieldset { border: 0; margin: 0 0 6px; padding: 0; }
  #settings-menu label { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 0.88rem; }
  #settings-menu label.number input { width: 5.5rem; margin-left: auto; }
  #settings-menu .note { margin: 4px 0 0; color: var(--muted); font-size: 0.78rem; }

  /* The editor is CodeMirror 6 (web/editor/src/editor-entry.js), drawn from
     the page's own colours. Dragging its corner makes it taller. */
  .editor {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--petal);
    border-radius: 8px;
  }
  .editor .cm-editor {
    flex: 1 0 auto;
    height: 420px;
    min-height: 420px;
    resize: vertical;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--ink);
    font-family: var(--mono);
    font-variation-settings: "MONO" 1, "CASL" 0;
    font-size: var(--editor-size, 13.5px);
    font-weight: 400;
    line-height: 1.55;
  }
  .editor .cm-editor.cm-focused { outline: none; border-color: var(--leaf); }
  .editor .cm-scroller { font-family: inherit; line-height: inherit; overflow: auto; }
  .editor .cm-content { padding: 14px 0; caret-color: var(--ink); }
  .editor .cm-line { padding: 0 16px 0 8px; }
  .editor .cm-gutters { background: transparent; color: var(--muted); border: 0; }
  .editor .cm-lineNumbers .cm-gutterElement { padding: 0 4px 0 12px; min-width: 2.2em; }
  .editor .cm-cursor, .editor .cm-dropCursor { border-left-color: var(--ink); }
  .editor .cm-selectionBackground,
  .editor .cm-editor.cm-focused > .cm-scroller > .cm-selectionLayer .cm-selectionBackground { background: var(--hl-selection); }
  .editor .cm-editor.mod .cm-content { cursor: pointer; }
  .editor .cm-panels { background: var(--petal); color: var(--ink); border-color: var(--line); }
  .editor .cm-panels .cm-lsp-reference-panel { font-size: 12.5px; }
  .editor .cm-lsp-reference-panel [aria-selected] { background: var(--leaf-soft); }
  .cm-tooltip {
    background: var(--petal);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 4px 14px rgb(0 0 0 / 0.18);
    font-family: var(--mono);
    font-variation-settings: "MONO" 1, "CASL" 0;
    font-size: 12.5px;
    line-height: 1.45;
    max-width: min(72ch, calc(100vw - 24px));
  }
  .cm-tooltip pre { margin: 2px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .cm-tooltip.cm-tooltip-autocomplete > ul > li[aria-selected] { background: var(--leaf-soft); color: var(--ink); }
  .cm-diagnostic { white-space: pre-wrap; }
  .cm-diagnostic-error { border-left-color: var(--bad); }
  /* Each kind of token (the tokenizer's colour()); the guide's code uses them too. */
  .hl-keyword { color: var(--hl-keyword); }
  .hl-name { color: var(--hl-name); }
  .hl-defined { color: var(--hl-defined); }
  .hl-number { color: var(--hl-number); }
  .hl-string { color: var(--hl-string); }
  .hl-interp { color: var(--hl-interp); }
  .hl-comment { color: var(--hl-comment); }
  .hl-operator { color: var(--hl-operator); }
  /* What the language server resolved each name to (semantic tokens; the editor only). */
  .cm-editor .sem-type, .cm-editor .sem-interface, .cm-editor .sem-ability { color: var(--hl-name); }
  .cm-editor .sem-function, .cm-editor .sem-theorem { color: var(--hl-defined); }
  .cm-editor .sem-theorem { font-style: italic; }
  .cm-editor .sem-enumMember { color: var(--hl-number); }
  .cm-editor .sem-decl { font-weight: 600; }
  .cm-inlay { color: var(--hl-comment); font-style: italic; pointer-events: none; }

  /* A project's files: a row of tabs that scrolls inside itself (so the page
     never scrolls sideways), and the controls for the open file. */
  .filebar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
  .filetabs { flex: 1 1 100%; display: flex; gap: 4px; overflow-x: auto; min-width: 0; padding-bottom: 2px; }
  .filetabs button {
    flex: none;
    white-space: nowrap;
    background: transparent;
    border-color: transparent;
    color: var(--muted);
    padding: 4px 9px;
    font-family: var(--mono);
    font-variation-settings: "MONO" 1, "CASL" 0;
    font-size: 12.5px;
    font-weight: 500;
  }
  .filetabs button[aria-selected="true"] { background: var(--petal); border-color: var(--line); color: var(--ink); }
  .filetabs button[data-errors] { color: var(--bad); }
  .filetabs .mark { margin-left: 5px; font-weight: 700; }
  .filetabs .edited { color: var(--leaf); }
  .filebar select { font-size: 0.82rem; padding: 3px 8px; max-width: 100%; }
  .filebar .hint { font-size: 0.8rem; font-weight: 500; padding: 3px 8px; }
  .banner {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
    font-size: 0.85rem; padding: 8px 12px; border-radius: 8px;
    background: var(--warn-soft); color: var(--warn);
  }
  .banner button { font-size: 0.8rem; padding: 3px 8px; }
  .errorfile { display: flex; flex-direction: column; gap: 4px; }
  button.jump { align-self: flex-start; font-family: var(--mono); font-size: 0.78rem; font-weight: 500; padding: 2px 8px; color: var(--bad); }
  .banner.std { background: var(--leaf-soft); color: var(--ok); }
  .banner.std code { font-family: var(--mono); font-variation-settings: "MONO" 1; }
  h3.testgroup { margin: 0; font-size: 0.82rem; font-family: var(--mono); font-weight: 600; color: var(--muted); }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--leaf-soft);
    color: var(--ok);
  }
  .status.bad { background: var(--bad-soft); color: var(--bad); }
  .status.idle { color: var(--muted); }
  /* The warning count: a button that shows them in the Check tab. */
  button.status.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  button.status.warn:hover { border-color: var(--warn); }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .tabs button {
    background: transparent;
    border-color: transparent;
    color: var(--muted);
    padding: 5px 10px;
  }
  .tabs button[aria-selected="true"] {
    background: var(--petal);
    border-color: var(--line);
    color: var(--ink);
  }

  .output {
    flex: 1;
    min-height: 240px;
    /* Long results scroll inside it, rather than making the page longer. */
    contain: size;
    background: var(--petal);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  /* Each result keeps its full height, and the pane scrolls; otherwise a
     box that scrolls itself, like a <pre>, is squeezed to fit. */
  .output > * { flex-shrink: 0; }
  .output p { margin: 0; max-width: 62ch; }
  .hint { color: var(--muted); font-size: 0.88rem; }
  pre {
    margin: 0;
    font-family: var(--mono);
    font-variation-settings: "MONO" 1;
    font-size: 12.5px;
    line-height: 1.45;
    white-space: pre;
    overflow-x: auto;
  }
  pre.errors { color: var(--bad); }
  pre.warnings { color: var(--warn); }
  pre.goals { color: var(--goal); }
  .goalpanel {
    border: 1px solid var(--line); border-left: 3px solid var(--goal); border-radius: 8px;
    background: var(--petal); padding: 8px 12px; max-height: 12rem; overflow: auto;
    font-family: var(--mono); font-variation-settings: "MONO" 1; font-size: 12.5px; line-height: 1.45;
  }
  .goalpanel[hidden] { display: none; }
  .goalpanel .owner, .goalpanel .none { color: var(--muted); font-family: var(--sans, inherit); font-size: 0.8rem; }
  .goalpanel .row { white-space: pre-wrap; }
  .goalpanel .row b { font-weight: 600; }
  .goalpanel .row i { font-style: normal; color: var(--muted); }
  .goalpanel .added { color: var(--leaf); }
  .goalpanel .before { color: var(--muted); white-space: pre-wrap; }
  .goalpanel .label { color: var(--muted); font-weight: 400; }
  .goalpanel .before + .target { border-top: none; margin-top: 2px; padding-top: 0; }
  .goalpanel .computed { color: var(--muted); opacity: 0.8; white-space: pre-wrap; }
  .goalpanel .before + .target + .computed { margin-top: 0; }
  .goalpanel .stale { opacity: 0.6; }
  .goalpanel .target { color: var(--goal); font-weight: 600; white-space: pre-wrap; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; }
  .rename-panel { border: 1px solid var(--line); border-left: 3px solid var(--leaf); border-radius: 8px; background: var(--petal); padding: 6px 10px; margin-bottom: 6px; font-size: 0.85rem; }
  .rename-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .rename-row input { font-family: var(--mono); font-size: 0.85rem; padding: 2px 6px; min-width: 10rem; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--ink); }
  .rename-row button[hidden] { display: none; }
  .rename-problems { color: var(--bad); white-space: pre-wrap; margin: 6px 0 0; font-family: var(--mono); font-size: 12.5px; }
  .pick-panel { display: flex; flex-direction: column; gap: 2px; }
  .pick-item { text-align: left; font: inherit; padding: 2px 6px; border: 1px solid transparent; border-radius: 4px; background: none; color: var(--ink); cursor: pointer; }
  .pick-item:hover, .pick-item:focus { border-color: var(--leaf); outline: none; }
  .pick-detail { color: var(--muted); font-size: 0.8em; }
  .rename-problems.busy { color: var(--muted); }
  .rename-problems[hidden] { display: none; }
  .goalbox { border-left: 3px solid var(--goal); padding-left: 10px; margin: 0 0 8px; }

  .evalrow, .runrow { display: flex; gap: 8px; }
  button.run { margin-left: auto; }
  #format { margin-left: auto; }
  #format + button.run { margin-left: 0; }
  button:disabled { cursor: default; opacity: 0.55; }
  textarea#run-input {
    width: 100%;
    resize: vertical;
    font-family: var(--mono);
    font-variation-settings: "MONO" 1, "CASL" 0;
    font-size: 13px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .run-result { display: flex; flex-direction: column; gap: 10px; }
  pre.program-output { border-left: 3px solid var(--leaf); padding-left: 10px; }
  /* The terminal pane: 80 columns by 24 rows, the font shrinking with the window so 80 columns fit.
     The 16 colours are chosen for contrast on the pane's own background in each theme. */
  :root {
    --t-bg: #fbfaf4; --t-fg: #1d2a21;
    --t0: #1d2a21; --t1: #a8302a; --t2: #26683a; --t3: #7a5300; --t4: #2a55a3; --t5: #8a3a8f; --t6: #17666e; --t7: #5a655d;
    --t8: #4a574d; --t9: #c0392b; --t10: #1d7a3a; --t11: #8f6200; --t12: #1f5fc0; --t13: #a23ba8; --t14: #12767f; --t15: #2a3a2f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --t-bg: #0b100d; --t-fg: #e3ece4;
      --t0: #8a9a8e; --t1: #ef8f86; --t2: #82c795; --t3: #e3b55e; --t4: #8fb4f2; --t5: #d6a3e8; --t6: #7cc4c9; --t7: #e3ece4;
      --t8: #a3b3a7; --t9: #ff9f95; --t10: #9fe0b0; --t11: #f2cc7e; --t12: #aac6ff; --t13: #e6bcf5; --t14: #98dde2; --t15: #ffffff;
    }
  }
  :root[data-theme="dark"] {
    --t-bg: #0b100d; --t-fg: #e3ece4;
    --t0: #8a9a8e; --t1: #ef8f86; --t2: #82c795; --t3: #e3b55e; --t4: #8fb4f2; --t5: #d6a3e8; --t6: #7cc4c9; --t7: #e3ece4;
    --t8: #a3b3a7; --t9: #ff9f95; --t10: #9fe0b0; --t11: #f2cc7e; --t12: #aac6ff; --t13: #e6bcf5; --t14: #98dde2; --t15: #ffffff;
  }
  pre#live-screen {
    box-sizing: border-box;
    background: var(--t-bg);
    color: var(--t-fg);
    font-size: min(14px, calc((100vw - 90px) / 50));
    line-height: 1.25;
    height: calc(24 * 1.25em + 16px);
    overflow-y: auto;
    overflow-x: hidden;
    margin: 0;
    padding: 8px 10px;
    border-radius: 6px;
  }
  pre#live-screen:focus { outline: 2px solid var(--leaf); outline-offset: 2px; }
  #live-screen .bd { font-weight: 700; }
  #live-screen .cur { outline: 1px solid var(--t-fg); outline-offset: -1px; }
  #live-screen .f0 { --fg: var(--t0); color: var(--t0); }
  #live-screen .b0 { --bg: var(--t0); background: var(--t0); }
  #live-screen .f1 { --fg: var(--t1); color: var(--t1); }
  #live-screen .b1 { --bg: var(--t1); background: var(--t1); }
  #live-screen .f2 { --fg: var(--t2); color: var(--t2); }
  #live-screen .b2 { --bg: var(--t2); background: var(--t2); }
  #live-screen .f3 { --fg: var(--t3); color: var(--t3); }
  #live-screen .b3 { --bg: var(--t3); background: var(--t3); }
  #live-screen .f4 { --fg: var(--t4); color: var(--t4); }
  #live-screen .b4 { --bg: var(--t4); background: var(--t4); }
  #live-screen .f5 { --fg: var(--t5); color: var(--t5); }
  #live-screen .b5 { --bg: var(--t5); background: var(--t5); }
  #live-screen .f6 { --fg: var(--t6); color: var(--t6); }
  #live-screen .b6 { --bg: var(--t6); background: var(--t6); }
  #live-screen .f7 { --fg: var(--t7); color: var(--t7); }
  #live-screen .b7 { --bg: var(--t7); background: var(--t7); }
  #live-screen .f8 { --fg: var(--t8); color: var(--t8); }
  #live-screen .b8 { --bg: var(--t8); background: var(--t8); }
  #live-screen .f9 { --fg: var(--t9); color: var(--t9); }
  #live-screen .b9 { --bg: var(--t9); background: var(--t9); }
  #live-screen .f10 { --fg: var(--t10); color: var(--t10); }
  #live-screen .b10 { --bg: var(--t10); background: var(--t10); }
  #live-screen .f11 { --fg: var(--t11); color: var(--t11); }
  #live-screen .b11 { --bg: var(--t11); background: var(--t11); }
  #live-screen .f12 { --fg: var(--t12); color: var(--t12); }
  #live-screen .b12 { --bg: var(--t12); background: var(--t12); }
  #live-screen .f13 { --fg: var(--t13); color: var(--t13); }
  #live-screen .b13 { --bg: var(--t13); background: var(--t13); }
  #live-screen .f14 { --fg: var(--t14); color: var(--t14); }
  #live-screen .b14 { --bg: var(--t14); background: var(--t14); }

<script type="text/plain" id="ex-lists" data-title="Proofs about lists">-- A proof that appending lists adds their lengths, by induction on the first
-- list. The compiler checks it; change a line and see what it says.
import Std (Eq, List)

theorem appendLength: (xs: List a) -> (ys: List a) ->
    List.length (List.append xs ys) = List.length xs + List.length ys
  | Nil,       ys => rfl
  | Cons x xs, ys => Eq.cong Succ (appendLength xs ys)

def reverse: List a -> List a
  | Nil       => Nil
  | Cons x xs => List.append (reverse xs) [x]

-- Proofs by computation:
theorem reverseExample: reverse [1, 2, 3] = [3, 2, 1] := rfl

-- Try: `appendLength (Cons x xs) ys = appendLength xs ys` (a wrong step), or a
-- recursive call that doesn't get smaller, like `reverse (Cons x xs)`.
</script>

<script type="text/plain" id="ex-division" data-title="Safe division">-- `/` needs a proof that the divisor isn't zero. For a literal, the compiler
-- decides it; for a runtime value, establish it with `if h: … then … else`.

def half (n: Nat): Nat := n / 2

def safeDiv (n: Nat) (d: Nat): Nat := if h: d != 0 then n / d else 0

-- A function can ask for the proof itself; callers' `auto` finds it.
def average (total: Nat) (count: Nat): [auto ok: count != 0] -> Nat := total / count

def averageOfThree: Nat := average 12 3

-- Try: `def ratio (n d: Nat): Nat := n / d` (can't be decided before the
-- program runs), or `def oops: Nat := 7 / 0` (false). Evaluate `safeDiv 9 0` in the Evaluate tab.
</script>

<script type="text/plain" id="ex-tests" data-title="Tests">-- Tests are `Bool` expressions that must be `True`. The command-line tool
-- caches each result by a hash of everything the test depends on.

import Std (Nat)

def double (n: Nat): Nat := n + n

def isEven (n: Nat): Bool := Nat.leq (n % 2) 0

test "double 3 is 6" := Nat.leq (double 3) 6
test "doubles are even" := isEven (double 7)
test "7 is odd" := not (isEven 7)
test "this one fails" := isEven 3
</script>

<script type="text/plain" id="ex-abilities" data-title="Abilities and handlers">-- Effectful code is written directly; the abilities it may perform are in
-- its type. A handler removes one. `k` resumes the computation and may be
-- called more than once. Run the tests to see the results.

import Std (List)

ability State (s: Type) where
  get: () -> {State s} s
  put: s -> {State s} ()

ability Choose where
  choose: () -> {Choose} Bool

def fstOf: Pair a b -> a
  | MkPair x y => x

def sndOf: Pair a b -> b
  | MkPair x y => y

def runState (init: s) (prog: () -> {State s | e} a): {e} Pair a s :=
  let run: s -> {e} Pair a s :=
    handle prog() with
      | return x       => st => MkPair x st
      | get(), k      => st => k st st
      | put st2, k     => st => k() st2
  run init

def allResults (prog: () -> {Choose | e} a): {e} List a :=
  handle prog() with
    | return x       => [x]
    | choose _, k    => List.append (k True) (k False)

-- Choose, then add 10 to the state if it said yes.
def step(): {State Nat, Choose} Nat :=
  if choose() then put (get() + 10) else ()
  get()

-- Each branch has its own state...
test "state inside choice" := List.length (allResults (u => runState 1 step)) == 2

-- ...or one state threads through both branches.
test "choice inside state" := sndOf (runState 1 (u => allResults step)) == 11
</script>
<script type="text/plain" id="ex-main" data-title="Input and output: main">-- A program with input and output. `main` prints with `IO.print` and reads
-- lines with `IO.readLine`, which gives `None` at the end of the input. Press
-- Run: the Run tab's box holds the input lines. The tests run the same `main`
-- with `IO.simulate`, which takes the input as a list.

import Std (IO, Nat, Pair, Text)

-- The text, or a default at end of input.
def textOr (d: Text): Option Text -> Text
  | None => d
  | Some t  => t

-- Reports a line that should be a number, and goes on with the new total.
def stepNumber (total: Nat) (l: Text): Option Nat -> (Nat -> {IO} Nat) -> {IO} Nat
  | None, more =>
    IO.print ("\"" ++ l ++ "\" isn't a number; skipped")
    more total
  | Some n,  more =>
    IO.print ("  total: " ++ Nat.toText (total + n))
    more (total + n)

-- What to do with a line, given the total so far. An empty line, or the end
-- of input, stops.
def step (total: Nat): Option Text -> (Nat -> {IO} Nat) -> {IO} Nat
  | None, more => total
  | Some l,  more =>
    if Text.isEmpty l then total else stepNumber total l (Text.toNat (Text.trim l)) more

-- Adds the numbers on at most this many more lines. The bound keeps the
-- recursion structural: every run of `main` performs a bounded number of
-- operations.
def addLines: Nat -> Nat -> {IO} Nat
  | 0,      total => total
  | Succ n, total => step total (IO.readLine()) (t => addLines n t)

def main(): {IO} () :=
  IO.print "What's your name?"
  let name := textOr "stranger" (IO.readLine())
  IO.print ("Hello, " ++ name ++ "! Type numbers to add, one per line, and an empty line to stop.")
  let total := addLines 1000 0
  IO.print ("The sum is " ++ Nat.toText total ++ ". Goodbye, " ++ name ++ ".")

-- Testing `main` with scripted input

def eqTexts: List Text -> List Text -> Bool
  | Nil,       Nil       => True
  | Cons x xs, Cons y ys => if x == y then eqTexts xs ys else False
  | _,         _         => False

def printed (input: List Text): List Text := Pair.fst (IO.simulate input main)

test "a session" :=
  eqTexts (printed ["Ada", "1", "2", "x", " 39 ", ""])
    [ "What's your name?"
    , "Hello, Ada! Type numbers to add, one per line, and an empty line to stop."
    , "  total: 1"
    , "  total: 3"
    , "\"x\" isn't a number; skipped"
    , "  total: 42"
    , "The sum is 42. Goodbye, Ada."
    ]

test "end of input stops it too" :=
  eqTexts (printed ["Ada", "5"])
    [ "What's your name?"
    , "Hello, Ada! Type numbers to add, one per line, and an empty line to stop."
    , "  total: 5"
    , "The sum is 5. Goodbye, Ada."
    ]

test "no input at all" :=
  eqTexts (printed [])
    [ "What's your name?"
    , "Hello, stranger! Type numbers to add, one per line, and an empty line to stop."
    , "The sum is 0. Goodbye, stranger."
    ]
</script>
<script type="text/plain" id="ex-js" data-title="Extract to JavaScript">-- Exports become an ES module with TypeScript types. Preconditions that JS
-- can't prove are checked at runtime instead. See the JavaScript tab.

export def applyDiscount (price: Nat) (percent: Nat): [auto ok: percent <= 100] -> Nat := price - price * percent / 100

type Shape: Type =
  | Square (side: Nat)
  | Rect (width: Nat) (height: Nat)

export def area: Shape -> Nat
  | Square s => s * s
  | Rect w h => w * h
</script>

<script type="module">
  const status = document.getElementById("status");
  const output = document.getElementById("output");
  const picker = document.getElementById("example");
  const runButton = document.getElementById("run");
  const warningCount = document.getElementById("warning-count");
  const tabs = [...document.querySelectorAll(".tabs button")];
  const examples = [...document.querySelectorAll('script[type="text/plain"]')];

  /** Most a run may print, in bytes. */
  const MAX_OUTPUT = 256 * 1024;
  /** How long a run may take before it's stopped. */
  const RUN_SECONDS = 15;
  /** How long checking, testing, evaluating or extracting may take. */
  const CHECK_SECONDS = 60;

  let view = "check";
  let evalInput = "";
  /** The `import` lines entered in the Evaluate tab, kept until the program changes, like a REPL's. */
  let evalImports = [];

  for (const ex of examples) {
    const option = document.createElement("option");
    option.value = ex.id;
    option.textContent = ex.dataset.title;
    picker.append(option);
  }

  const stored = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
  const store = (key, value) => { try { localStorage.setItem(key, value); } catch {} };
  const forget = (key) => { try { localStorage.removeItem(key); } catch {} };

  /** Where the tests' cached results are kept, one `KEY passed` per line. */
  const TEST_CACHE = "stitchwort.testCache";

  /** Adds new test results to the cache, keeping it from growing without end. */
  function rememberTests(added) {
    if (!added) return;
    let text = (stored(TEST_CACHE) ?? "") + added;
    if (text.length > 200_000) text = text.split("\n").slice(-2_000).join("\n");
    store(TEST_CACHE, text);
  }

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) node[k] = v;
    node.append(...children);
    return node;
  }

  const secs = (ms) => ms < 1000 ? `${ms.toFixed(0)} ms` : `${(ms / 1000).toFixed(1)} s`;

  // The compiler runs in a Web Worker (playground-worker.js), one request at
  // a time. After a crash (a trap, or the engine's stack running out, which
  // deep nesting can still cause) the WebAssembly instance's state isn't
  // restored, so that worker is discarded and the next request starts a
  // fresh one. A request that's superseded, stopped or too slow is cancelled
  // by terminating its worker. The page compiles the WebAssembly once and
  // hands the module to each new worker, so restarting is quick.
  // The build writes pkg/version.json: a hash of the compiler's files (the
  // WebAssembly, the bindings and the worker script) and one of the bundled
  // projects. It's fetched with `no-cache` (always checked with the server),
  // and the other files are asked for as `?v=<hash>`, so a browser reuses
  // them until a build changes them, and can't mix an old worker with a new
  // bundle. If it can't be read, each page load asks afresh (`?v=<time>`).
  let LOAD = `?v=${Date.now()}`;
  let PROJECT_LOAD = LOAD;
  const versionReady = fetch(new URL("pkg/version.json", import.meta.url), { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then((v) => {
      if (/^[0-9a-f]+$/.test(v.compiler) && /^[0-9a-f]+$/.test(v.projects)) {
        LOAD = `?v=${v.compiler}`;
        PROJECT_LOAD = `?v=${v.projects}`;
      }
    })
    .catch(() => {});
  const wasm = versionReady
    .then(() => fetch(new URL(`pkg/stitchwort_web_bg.wasm${LOAD}`, import.meta.url)))
    .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.arrayBuffer(); })
    .then((bytes) => WebAssembly.compile(bytes));

  /** A worker that has answered: workers can run here. */
  let workersWork = false;

  class Compiler {
    worker = null;
    pending = null;
    nextId = 0;

    /**
     * Runs `request` and resolves to { out } (the compiler's answer),
     * { crashed, error }, { timedOut } or { cancelled }. A call while
     * another is running cancels that one. A run's output is passed to
     * `onOutput` as it's printed.
     */
    async call(request, seconds, onOutput) {
      this.cancel();
      let module;
      try {
        module = await wasm;
      } catch (e) {
        return { crashed: true, error: String(e), noCompiler: true };
      }
      this.cancel();
      return new Promise((resolve) => {
        const id = ++this.nextId;
        const timer = setTimeout(() => this.finish(id, { timedOut: true, seconds }), seconds * 1000);
        this.pending = { id, resolve, timer, onOutput };
        try {
          if (!this.worker) this.start();
          this.worker.postMessage({ ...request, id, module });
        } catch (e) {
          this.finish(id, { crashed: true, error: String(e), noWorker: true });
        }
      });
    }

    /** Stops the running request, if there is one. */
    cancel() {
      if (this.pending) this.finish(this.pending.id, { cancelled: true });
    }

    start() {
      const worker = new Worker(new URL(`playground-worker.js${LOAD}`, import.meta.url), { type: "module" });
      worker.onmessage = ({ data }) => {
        workersWork = true;
        if ("output" in data) {
          if (this.pending?.id === data.id) this.pending.onOutput?.(data.output);
        } else {
          this.finish(data.id, data);
        }
      };
      worker.onerror = (e) => {
        e.preventDefault();
        this.finish(this.pending?.id, { crashed: true, error: e.message || "the worker failed", noWorker: !workersWork });
      };
      this.worker = worker;
    }

    finish(id, result) {
      if (!this.pending || this.pending.id !== id) return;
      const { resolve, timer } = this.pending;
      this.pending = null;
      clearTimeout(timer);
      if (!result.out) {
        // Crashed, too slow or cancelled: this worker can't be trusted, or
        // is still busy. Start afresh next time.
        this.worker?.terminate();
        this.worker = null;
      }
      resolve(result);
    }
  }

  // If workers can't start here (a host that forbids them), the compiler
  // runs in the page instead: it can't be stopped, and after a crash the
  // page has to be reloaded.
  class InPage {
    broken = null;
    stdLoaded = null;
    async call(request, seconds, onOutput) {
      if (this.broken) return { crashed: true, error: this.broken, inPage: true };
      try {
        const compiler = await import(`./pkg/stitchwort_web.js${LOAD}`);
        await compiler.default({ module_or_path: await wasm });
        this.stdLoaded ??= fetch(new URL(`pkg/std.bundle${LOAD}`, import.meta.url))
          .then((r) => { if (!r.ok) throw new Error(`std.bundle: HTTP ${r.status}`); return r.arrayBuffer(); })
          .then((bytes) => compiler.load_std(new Uint8Array(bytes)));
        await this.stdLoaded;
        const sink = { write: (text) => onOutput?.(text) };
        // As in playground-worker.js: a request with `paths` is for a project.
        if (request.action === "stdsource") return { out: { text: compiler.std_source(request.path) } };
        const answer = request.paths ? {
          outline: () => compiler.outline_project(request.paths, request.texts),
          check: () => compiler.check_project(request.paths, request.texts, request.targets),
          checkall: () => compiler.check_project(request.paths, request.texts, ""),
          test: () => compiler.test_project(request.paths, request.texts, request.targets, request.known ?? ""),
          evaluate: () => compiler.evaluate_project(request.paths, request.texts, request.targets, request.imports ?? "", request.expr),
          extract: () => compiler.extract_project(request.paths, request.texts, request.namespace),
          format: () => compiler.format(request.source),
          run: () => compiler.run_project_streaming(request.paths, request.texts, request.name, request.input, request.maxOutput, sink),
        }[request.action] : {
          check: () => compiler.check(request.source),
          test: () => compiler.test(request.source, request.known ?? ""),
          evaluate: () => compiler.evaluate(request.source, request.imports ?? "", request.expr),
          extract: () => compiler.extract(request.source),
          format: () => compiler.format(request.source),
          run: () => compiler.run_streaming(request.source, request.input, request.maxOutput, sink),
        }[request.action];
        return { out: JSON.parse(answer()) };
      } catch (e) {
        this.broken = `${e?.name ?? "Error"}: ${e?.message ?? e}`;
        return { crashed: true, error: this.broken, inPage: true };
      }
    }
    cancel() {}
  }

  /** Checking, testing, evaluating and extracting. */
  let checker = new Compiler();
  /** Running `main`, separately, so editing stays responsive during a run. */
  let runner = new Compiler();

  /** If the worker couldn't start at all, switches to the in-page compiler. */
  function fallBack(result) {
    if (!result.noWorker || workersWork || checker instanceof InPage) return false;
    console.warn("The playground's worker didn't start, so the compiler runs in the page:", result.error);
    checker = runner = new InPage();
    return true;
  }

  // What a crash or timeout means, for the person using the page.
  function trouble(result) {
    if (result.noCompiler) {
      return "This page runs the Stitchwort compiler as WebAssembly, and it couldn’t start here: " + result.error;
    }
    if (result.inPage) {
      return `The compiler crashed (${result.error}). Reload the page to restart it.`;
    }
    if (result.timedOut) {
      return `The compiler took longer than ${result.seconds} s, so it was stopped.`;
    }
    return `The compiler crashed (${result.error}). This can happen with very deeply nested ` +
      "programs or values. It has been restarted; change the program to try again.";
  }

  /**
   * Asks the checker; resolves to the compiler's answer, or to null after
   * showing what went wrong (or nothing, if the request was superseded).
   */
  /**
   * The compiler's last answer to each of these, with the source it was for:
   * switching tabs reuses them instead of checking the same source again.
   */
  const answers = new Map();
  const REMEMBERED = new Set(["check", "test", "extract", "outline"]);
  /** What an answer is for: the source, or a project's files and targets. */
  const keyOf = (request) => request.paths
    ? JSON.stringify([request.texts, request.targets, request.namespace]) : request.source;

  async function ask(request) {
    const remember = REMEMBERED.has(request.action);
    const hit = remember && answers.get(request.action);
    if (hit && hit.source === keyOf(request)) return hit.out;
    let result = await checker.call(request, CHECK_SECONDS);
    if (fallBack(result)) result = await checker.call(request, CHECK_SECONDS);
    if (result.out) {
      if (remember) answers.set(request.action, { source: keyOf(request), out: result.out });
      return result.out;
    }
    if (!result.cancelled) {
      setStatus(result.noCompiler ? "The compiler didn’t load" : result.timedOut ? "Took too long" : "The compiler crashed", "bad");
      output.replaceChildren(el("p", {}, trouble(result)));
    }
    return null;
  }

  // Running `main`. The controls persist across renders, so the input and the
  // last run's output stay while switching tabs.
  const runInput = el("textarea", { id: "run-input", spellcheck: false, rows: 4,
                                    placeholder: "Input, a line per IO.readLine (), or the rest at once with IO.readAll ()" });
  runInput.setAttribute("aria-label", "Input lines for the program");
  // A textarea holding more than a few hundred KB makes the browser spend
  // seconds laying it out each time the page changes (a million-line input
  // froze the page for minutes). So a large input is kept in `largeInput`, and
  // the textarea shows its start and its size; editing that text replaces it.
  const LARGE_INPUT = 256 * 1024;
  let largeInput = null;
  let largeNote = "";
  /** The text of the Run input, whole. */
  const inputText = () => largeInput !== null && runInput.value === largeNote ? largeInput : runInput.value;
  function setRunInput(text) {
    if (text.length <= LARGE_INPUT) {
      largeInput = null;
      runInput.value = text;
      return;
    }
    largeInput = text;
    const mb = (text.length / (1 << 20)).toFixed(1);
    largeNote = `${text.slice(0, 200).replace(/\n[^\n]*$/, "")}\n… (${mb} MB of input; not shown. Type here to replace it.)`;
    runInput.value = largeNote;
  }
  /** Saves the input for next time, unless it is too large to keep. */
  const storeInput = (key) => store(key, largeInput !== null && runInput.value === largeNote ? "" : runInput.value);
  const runAgain = el("button", { className: "primary", type: "button" }, "Run");
  const stopButton = el("button", { type: "button", disabled: true }, "Stop");
  const liveButton = el("button", { id: "run-live", type: "button",
                                    title: "Run main with keys going to the program as they are pressed" }, "Run in terminal");
  const runResult = el("div", { className: "run-result" });
  const runChecked = el("div");
  const runStale = el("p", { className: "hint", hidden: true }, "The source has changed since this run.");
  let ranSource = null;

  /** The open project: the manifest, the files, and what's open; or null. */
  let project = null;
  /** The editor's own text, even while a library file is shown. */
  const sourceText = () => source.value;
  const runHint = el("p", { className: "hint" });
  /** Whether the open entry has a program to run; a chapter is checked, not run. */
  const canRun = () => !project?.manifest.noRun;
  /** Enables Run and the run panel's buttons, unless there is no program or a run is going. */
  function setRunEnabled(on) {
    const enabled = on && canRun() && stopButton.disabled;
    runButton.disabled = runAgain.disabled = liveButton.disabled = !enabled;
  }
  /** The run panel's explanation, for `main` of the program or of a project's day. */
  function setRunHint() {
    if (!canRun()) {
      runButton.title = "Chapters are checked, not run: the Tests tab checks the chapter's tests";
      runHint.textContent =
        "This chapter has no program to run. The Check tab shows what is proved and which goals (the ?s) are still open; " +
        "the Tests tab checks the chapter's tests.";
      runInput.hidden = false;
      setRunEnabled(false);
      return;
    }
    const main = (project && project.manifest.days[project.day].main) || "main";
    runButton.title = `Run ${main} (Ctrl+Enter)`;
    // A live day has no input box: its keys come from the terminal pane.
    const live = !!project?.manifest.days[project.day].live;
    runInput.hidden = live;
    if (live) {
      runHint.textContent = project.manifest.days[project.day].hint ?? `Run opens a terminal and calls ${main} () in it.`;
      setRunEnabled(true);
      return;
    }
    runHint.textContent =
      `Run calls ${project ? main : "main"} (). Its IO.readLine () gets the lines below, one at a time, then None; ` +
      "IO.readAll () gets all that's left at once. " +
      `A run may print up to ${MAX_OUTPUT / 1024} KB and take up to ${RUN_SECONDS} s.` +
      (project ? (project.manifest.days[project.day].hint ? ` ${project.manifest.days[project.day].hint}` : " The input starts as the day's example.") : "");
    setRunEnabled(true);
  }
  setRunHint();

  /** Chooses one of the day's bundled inputs (a project only). */
  const inputChoice = el("select", { id: "input-choice", hidden: true });
  inputChoice.setAttribute("aria-label", "Fill the input from a bundled one");

  const runPanel = [
    runHint,
    inputChoice,
    runInput,
    el("div", { className: "runrow" }, runAgain, stopButton, liveButton),
    runChecked,
    runStale,
    runResult,
  ];

  async function runMain() {
    if (!canRun()) return;
    // A project day that says `"live": true` in its manifest runs in the terminal.
    if (project?.manifest.days[project.day].live) return runLive();
    selectView("run");
    const src = stateKey();
    setRunEnabled(false);
    stopButton.disabled = false;
    // The output shows as it's printed: the worker sends each line, and the
    // lines that arrive between frames are added together.
    const shown = el("pre", { className: "program-output" });
    const running = el("p", { className: "hint" }, "Running…");
    runResult.replaceChildren(running);
    let printed = "";
    let unshown = "";
    let ended = false;
    const onOutput = (text) => {
      if (!unshown) {
        requestAnimationFrame(() => {
          if (ended) return;
          if (!shown.isConnected) runResult.replaceChildren(el("h2", {}, "Output"), shown, running);
          shown.append(unshown);
          unshown = "";
        });
      }
      printed += text;
      unshown += text;
    };
    const request = requestFor("run", { input: inputText(), maxOutput: MAX_OUTPUT,
                                        name: project?.manifest.days[project.day].main });
    const started = performance.now();
    let result = await runner.call(request, RUN_SECONDS, onOutput);
    if (fallBack(result)) result = await runner.call(request, RUN_SECONDS, onOutput);
    const took = performance.now() - started;
    ended = true;
    stopButton.disabled = true;
    setRunEnabled(true);
    ranSource = src;
    runStale.hidden = true;

    const parts = [];
    const out = result.out;
    if (out?.ran || printed || result.cancelled || result.timedOut) {
      parts.push(el("h2", {}, "Output"),
                 printed ? el("pre", { className: "program-output" }, printed)
                         : el("p", { className: "hint" }, "Nothing was printed."));
    }
    if (out?.ok) {
      parts.push(el("p", { className: "summary" }, `Finished in ${secs(took)}.`));
    } else if (out) {
      parts.push(...errorsView(out.errors));
    } else if (result.cancelled) {
      parts.push(el("p", {}, `Stopped after ${secs(took)}.`));
    } else if (result.timedOut) {
      parts.push(el("p", {}, `Stopped after ${RUN_SECONDS} s, the longest a run may take.`));
    } else {
      parts.push(el("p", {}, trouble(result)));
    }
    runResult.replaceChildren(...parts);
  }

  runButton.addEventListener("click", runMain);
  runAgain.addEventListener("click", runMain);
  stopButton.addEventListener("click", () => { runner.cancel(); liveRun?.stop(); });

  // ---- Run in terminal (docs/proposals/playground-live-keys.md) -----------
  // The pane is an 80 x 24 grid (TerminalGrid) fed the program's output, and
  // the keys pressed in it go to the program as they are. The worker keeps
  // the run paused between keys, so it is free to take the next one.

  /** The bytes a terminal sends for a key event (terminal-io.md §3.2), or null if the page keeps it. */
  function keyBytes(e) {
    if (e.metaKey || e.altKey) return null;
    const escapes = { ArrowUp: "[A", ArrowDown: "[B", ArrowRight: "[C", ArrowLeft: "[D", Home: "[H", End: "[F",
                      Delete: "[3~", PageUp: "[5~", PageDown: "[6~" };
    if (e.key in escapes) return [27, ...new TextEncoder().encode(escapes[e.key])];
    const single = { Enter: 13, Tab: 9, Backspace: 127, Escape: 27 };
    if (e.key in single) return [single[e.key]];
    if (e.ctrlKey) return /^[a-z]$/i.test(e.key) ? [e.key.toLowerCase().charCodeAt(0) - 96] : null;
    if ([...e.key].length === 1) return [...new TextEncoder().encode(e.key)];
    return null;
  }

  /**
   * A terminal screen: a grid of cells (a character and a style) with a
   * cursor, and a small interpreter for the escape codes std writes
   * (Terminal.sw, Ansi.sw): CR, LF, BS, Tab; CSI H f A B C D G K J m, and the
   * modes ?1049 (alternate screen), ?25 (cursor) and ?7 (wrap). Everything
   * else is ignored. The normal screen keeps its lines, and a scrollback of
   * those that scrolled off, while the alternate screen is in use.
   */
  class TerminalGrid {
    constructor(rows = 24, cols = 80) {
      this.rows = rows;
      this.cols = cols;
      this.normal = this.newScreen();
      this.screen = this.normal;
      this.scrollback = [];
      this.keysMode = false;
      this.cursorVisible = true;
      this.wrap = true;
      this.pendingWrap = false;
      this.attr = { fg: null, bg: null, bold: false, reverse: false };
      this.style = "";
      this.state = "ground";
      this.params = "";
    }

    newScreen() { return { cells: Array.from({ length: this.rows }, () => this.blankRow()), row: 0, col: 0 }; }
    blankRow() { return Array.from({ length: this.cols }, () => [" ", ""]); }

    write(text) {
      for (const ch of text) this.feed(ch);
    }

    feed(ch) {
      const code = ch.codePointAt(0);
      if (this.state === "esc") {
        this.state = ch === "[" ? "csi" : ch === "\x1b" ? "esc" : "ground";
        this.params = "";
        return;
      }
      if (this.state === "csi") {
        if (code >= 0x40 && code <= 0x7e) { this.state = "ground"; this.csi(this.params, ch); }
        else if (code >= 0x20 && code <= 0x3f) this.params += ch;
        else if (ch === "\x1b") this.state = "esc";
        return;
      }
      if (ch === "\x1b") { this.state = "esc"; return; }
      const s = this.screen;
      if (ch === "\n") { this.lineFeed(); s.col = 0; this.pendingWrap = false; }
      else if (ch === "\r") { s.col = 0; this.pendingWrap = false; }
      else if (ch === "\b") { if (s.col > 0) s.col--; this.pendingWrap = false; }
      else if (ch === "\t") { s.col = Math.min(this.cols - 1, (Math.floor(s.col / 8) + 1) * 8); this.pendingWrap = false; }
      else if (code >= 32 && code !== 127) this.put(ch);
    }

    put(ch) {
      const s = this.screen;
      if (this.pendingWrap) { this.lineFeed(); s.col = 0; this.pendingWrap = false; }
      s.cells[s.row][s.col] = [ch, this.style];
      if (s.col < this.cols - 1) s.col++;
      else if (this.wrap) this.pendingWrap = true;
    }

    lineFeed() {
      const s = this.screen;
      if (s.row < this.rows - 1) { s.row++; return; }
      const gone = s.cells.shift();
      s.cells.push(this.blankRow());
      if (s === this.normal) {
        this.scrollback.push(gone);
        if (this.scrollback.length > 300) this.scrollback.shift();
      }
    }

    csi(params, final) {
      const s = this.screen;
      const numbers = params.replace(/^[?>]/, "").split(";").map((n) => (n === "" ? null : Number(n)));
      const first = (fallback) => numbers[0] || fallback;
      this.pendingWrap = false;
      const clamp = (n, max) => Math.max(0, Math.min(max, n));
      switch (final) {
        case "H": case "f":
          s.row = clamp(first(1) - 1, this.rows - 1);
          s.col = clamp((numbers[1] || 1) - 1, this.cols - 1);
          break;
        case "A": s.row = clamp(s.row - first(1), this.rows - 1); break;
        case "B": s.row = clamp(s.row + first(1), this.rows - 1); break;
        case "C": s.col = clamp(s.col + first(1), this.cols - 1); break;
        case "D": s.col = clamp(s.col - first(1), this.cols - 1); break;
        case "G": s.col = clamp(first(1) - 1, this.cols - 1); break;
        case "K": {
          const mode = numbers[0] ?? 0;
          const from = mode === 0 ? s.col : 0;
          const to = mode === 1 ? s.col : this.cols - 1;
          for (let c = from; c <= to; c++) s.cells[s.row][c] = [" ", ""];
          break;
        }
        case "J": {
          const mode = numbers[0] ?? 0;
          if (mode === 3) { this.scrollback = []; break; }
          const rowsFrom = mode === 0 ? s.row + 1 : 0;
          const rowsTo = mode === 1 ? s.row - 1 : this.rows - 1;
          for (let r = rowsFrom; r <= rowsTo; r++) s.cells[r] = this.blankRow();
          if (mode === 0) for (let c = s.col; c < this.cols; c++) s.cells[s.row][c] = [" ", ""];
          if (mode === 1) for (let c = 0; c <= s.col; c++) s.cells[s.row][c] = [" ", ""];
          break;
        }
        case "m": this.sgr(numbers.map((n) => n ?? 0)); break;
        case "h": case "l": if (params.startsWith("?")) for (const n of numbers) this.mode(n, final === "h"); break;
        default: break;
      }
    }

    mode(number, on) {
      if (number === 25) this.cursorVisible = on;
      else if (number === 7) this.wrap = on;
      else if (number === 1049 && on !== this.keysMode) {
        // The alternate screen starts blank each time; the normal one is kept as it was.
        this.keysMode = on;
        this.screen = on ? this.newScreen() : this.normal;
        this.pendingWrap = false;
      }
    }

    sgr(codes) {
      if (codes.length === 0) codes = [0];
      const a = this.attr;
      for (let i = 0; i < codes.length; i++) {
        const n = codes[i];
        if (n === 0) Object.assign(a, { fg: null, bg: null, bold: false, reverse: false });
        else if (n === 1) a.bold = true;
        else if (n === 22) a.bold = false;
        else if (n === 7) a.reverse = true;
        else if (n === 27) a.reverse = false;
        else if (n >= 30 && n <= 37) a.fg = n - 30;
        else if (n === 39) a.fg = null;
        else if (n >= 40 && n <= 47) a.bg = n - 40;
        else if (n === 49) a.bg = null;
        else if (n >= 90 && n <= 97) a.fg = n - 90 + 8;
        else if (n >= 100 && n <= 107) a.bg = n - 100 + 8;
        else if (n === 38 || n === 48) {
          // 38;5;N (256 colours, only the first 16 are shown) or 38;2;R;G;B (skipped).
          const kind = codes[i + 1];
          const value = kind === 5 ? codes[i + 2] : null;
          i += kind === 5 ? 2 : kind === 2 ? 4 : 0;
          if (value !== null && value < 16) a[n === 38 ? "fg" : "bg"] = value;
        }
      }
      this.style = [a.fg !== null ? `f${a.fg}` : "", a.bg !== null ? `b${a.bg}` : "", a.bold ? "bd" : "", a.reverse ? "rv" : ""]
        .filter(Boolean).join(" ");
    }

    /** The visible rows: the scrollback (on the normal screen), then the screen. */
    visibleRows() {
      return this.keysMode ? this.screen.cells : [...this.scrollback, ...this.screen.cells];
    }

    /** The text of the visible rows, without trailing spaces or empty rows at the end. */
    text() {
      const lines = this.visibleRows().map((row) => row.map(([ch]) => ch).join("").replace(/ +$/, ""));
      while (lines.length && lines[lines.length - 1] === "") lines.pop();
      return lines.join("\n");
    }

    /** DOM for the visible rows: a span per row, holding a span per run of one style (data-col is its first column). */
    render(showCursor) {
      const out = document.createDocumentFragment();
      const rows = this.visibleRows();
      const offset = rows.length - this.rows;
      rows.forEach((cells, r) => {
        const rowEl = document.createElement("span");
        rowEl.className = "trow";
        const cursorHere = showCursor && this.cursorVisible && r === offset + this.screen.row;
        let end = cells.length;
        while (end > 0 && cells[end - 1][0] === " " && cells[end - 1][1] === "") end--;
        if (cursorHere) end = Math.max(end, this.screen.col + 1);
        let runStart = 0;
        const flush = (to, style) => {
          if (to <= runStart) return;
          const span = document.createElement("span");
          span.textContent = cells.slice(runStart, to).map(([ch]) => ch).join("");
          if (style) span.className = style;
          span.dataset.col = String(runStart);
          rowEl.append(span);
          runStart = to;
        };
        let style = null;
        for (let c = 0; c < end; c++) {
          const here = cells[c][1] + (cursorHere && c === this.screen.col ? " cur" : "");
          if (style !== null && here !== style) flush(c, style);
          style = here;
        }
        flush(end, style);
        out.append(rowEl, "\n");
      });
      return out;
    }
  }

  /** The live run's worker: one request at a time, with the time limit counted over each stretch. */
  class LiveRun {
    constructor(onOutput) {
      this.onOutput = onOutput;
      this.nextId = 0;
      this.pending = null;
      this.worker = new Worker(new URL(`playground-worker.js${LOAD}`, import.meta.url), { type: "module" });
      this.worker.onmessage = ({ data }) => {
        if (data.id !== this.pending?.id) return;
        if ("output" in data) this.onOutput(data.output);
        else this.settle(data.out ?? { state: "crashed", error: data.error });
      };
      this.worker.onerror = (e) => {
        e.preventDefault();
        this.settle({ state: "crashed", error: e.message || "the worker failed" });
      };
    }

    /** Sends a request; resolves to the worker's { state, ... }. The timer runs from here until the reply. */
    async request(message) {
      const module = await wasm;
      return new Promise((resolve) => {
        const id = ++this.nextId;
        const timer = setTimeout(() => this.settle({ state: "timedOut" }), RUN_SECONDS * 1000);
        this.pending = { id, resolve, timer };
        this.worker.postMessage({ ...message, id, module });
      });
    }

    settle(out) {
      if (!this.pending) return;
      const { resolve, timer } = this.pending;
      clearTimeout(timer);
      this.pending = null;
      // A run that isn't waiting or over normally has its worker discarded.
      if (out.state !== "waiting") this.end();
      resolve(out);
    }

    end() {
      this.worker?.terminate();
      this.worker = null;
    }

    /** Stops the run: a busy or idle worker is terminated, and the page hears "stopped". */
    stop() {
      // A busy worker has a request to answer; an idle one has the page told.
      if (this.pending) this.settle({ state: "stopped" });
      else this.onIdleStop?.();
      this.end();
    }
  }

  let liveRun = null;

  async function runLive() {
    selectView("run");
    liveRun?.stop();
    setRunEnabled(false);
    stopButton.disabled = false;
    const grid = new TerminalGrid(24, 80);
    const screen = el("pre", { id: "live-screen", className: "program-output", tabIndex: 0 });
    screen.setAttribute("aria-label", "The program's terminal: keys typed here go to the program");
    const note = el("p", { className: "hint" },
      "Keys go to the program. Ctrl-C stops it, Ctrl-D ends its input, and Esc then Tab leaves the terminal.");
    const status = el("p", { className: "summary" });
    runResult.replaceChildren(el("h2", {}, "Terminal"), screen, note, status);
    const set = (state, text) => { screen.dataset.state = state; status.textContent = text; };
    const draw = () => {
      const atBottom = screen.scrollTop + screen.clientHeight >= screen.scrollHeight - 4;
      const drawStart = performance.now();
      screen.replaceChildren(grid.render(true));
      screen.dataset.drawMs = String(performance.now() - drawStart);
      screen.dataset.text = grid.text();
      screen.dataset.keys = grid.keysMode ? "keys" : "line";
      if (atBottom) screen.scrollTop = screen.scrollHeight;
    };
    const run = liveRun = new LiveRun((text) => { grid.write(text); draw(); });
    draw();
    // Keys wait for the one before to be taken: the worker is busy while it
    // computes, and answers when the program waits again.
    let sentAt = performance.now();
    let inFlight = true;
    let queued = [];
    let closing = false;
    let closed = false;
    const flush = () => {
      inFlight = true;
      set("running", "Running…");
      const keys = queued;
      sentAt = performance.now();
      queued = [];
      const close = closing;
      closing = false;
      if (close) closed = true;
      run.request({ action: "live-keys", keys, close }).then(handle);
    };
    const send = (bytes) => { queued.push(bytes); if (!inFlight) flush(); };
    const sendClose = () => { closing = true; if (!inFlight) flush(); };
    // Outside keys mode the program is reading lines, and the terminal does
    // what a tty's line mode does: echo, Backspace edits, Enter sends the line.
    let line = "";
    const echo = (text) => { grid.write(text); draw(); };
    const encode = (text) => [...new TextEncoder().encode(text)];
    let escaped = false;
    const onKey = (e) => {
      if (closed) return;
      // Esc then Tab (or Shift-Tab) is the way out (WCAG: No Keyboard Trap).
      if (escaped && e.key === "Tab" && !e.ctrlKey && !e.metaKey && !e.altKey) { escaped = false; return; }
      escaped = e.key === "Escape";
      if (e.ctrlKey && !e.metaKey && !e.altKey && e.key.toLowerCase() === "d") {
        e.preventDefault();
        if (grid.keysMode || line === "") sendClose();
        else { send(encode(line)); line = ""; }
        return;
      }
      if (!grid.keysMode) {
        if (e.metaKey || e.altKey) return;
        if (e.key === "Enter") { e.preventDefault(); echo("\n"); send(encode(line + "\n")); line = ""; return; }
        if (e.key === "Backspace") {
          e.preventDefault();
          if (line) { const chars = [...line]; chars.pop(); line = chars.join(""); echo("\b \b"); }
          return;
        }
        if (e.ctrlKey && e.key.toLowerCase() === "u") {
          e.preventDefault();
          echo("\b \b".repeat([...line].length));
          line = "";
          return;
        }
        if (!e.ctrlKey && [...e.key].length === 1) { e.preventDefault(); line += e.key; echo(e.key); return; }
        // Other keys do nothing in line mode, and Tab moves on (Ctrl-C and the like still go through).
        if (!e.ctrlKey) return;
      }
      const bytes = keyBytes(e);
      if (!bytes) return;
      e.preventDefault();
      send(bytes);
    };
    const onBlur = () => { escaped = false; };
    const handle = (out) => {
      if (liveRun !== run) return;
      draw();
      screen.dataset.frameMs = String(performance.now() - sentAt);
      screen.dataset.stretches = String((Number(screen.dataset.stretches) || 0) + 1);
      if (out.state === "waiting") {
        set("waiting", "Waiting for a key.");
        if (queued.length || closing) flush(); else inFlight = false;
        return;
      }
      screen.removeEventListener("keydown", onKey);
      screen.removeEventListener("blur", onBlur);
      stopButton.disabled = true;
      setRunEnabled(true);
      if (out.state === "failed") {
        set("failed", "The run failed.");
        runResult.append(...errorsView(out.errors));
      } else if (out.state === "timedOut") {
        set("timedOut", `Stopped after ${RUN_SECONDS} s without waiting for a key, the longest a stretch may take.`);
      } else if (out.state === "crashed") {
        set("crashed", trouble({ error: out.error }));
      } else {
        set(out.state, { finished: "Finished.", interrupted: "Stopped by Ctrl-C.", stopped: "Stopped." }[out.state] ?? out.state);
      }
      if (liveRun === run) liveRun = null;
    };
    run.onIdleStop = () => handle({ state: "stopped" });
    screen.addEventListener("keydown", onKey);
    screen.addEventListener("blur", onBlur);
    screen.focus();
    set("running", "Running…");
    run.request({ ...requestFor("run", { name: project?.manifest.days[project.day].main }), action: "live-start" }).then(handle);
  }
  liveButton.addEventListener("click", runLive);
  runInput.addEventListener("input", () => {
    if (runInput.value.length > LARGE_INPUT) setRunInput(runInput.value);
    else if (runInput.value !== largeNote) largeInput = null;
    if (project) storeInput(inputKey(project.manifest.days[project.day].main));
    else storeInput("stitchwort.input");
  });

  // ---- Projects (docs/proposals/playground-projects.md) ------------------
  // A project is a folder of files bundled with the page (pkg/projects/NAME/):
  // a manifest, its sources, and example inputs. The Example dropdown has a
  // group with one entry per day; every day opens the same project, so a
  // saved edit to a shared file shows on every day. While one is open,
  // `source` shows the open file; the others' texts are in `project.texts`.
  // The compiler is sent every file each time, with the day's namespaces as
  // the target.

  const filebar = document.getElementById("filebar");
  const fileTabs = document.getElementById("filetabs");
  const otherFiles = document.getElementById("other-files");
  const resetFile = document.getElementById("reset-file");
  const resetProject = document.getElementById("reset-project");
  const resetConfirm = document.getElementById("reset-confirm");
  const banner = document.getElementById("banner");

  /** The open project: the manifest, the files, and what's open; or null. */
  // (declared with the run panel, which needs it)
  const manifestPromises = new Map();
  const bundlePromises = new Map();

  /** The bundled projects, in the Example dropdown's order. */
  const PROJECT_NAMES = ["aoc", "rogue", "sf", "book"];
  /** The project a dropdown value (`aoc:3`) is for, or null. */
  const projectOfId = (id) => PROJECT_NAMES.find((name) => id.startsWith(`${name}:`)) ?? null;
  const keysOf = (name) => `stitchwort.project.${name}.`;
  const fileKey = (path, name = project.name) => `${keysOf(name)}file.${path}`;
  const inputKey = (main) => `${keysOf(project.name)}input.${main}`;
  /** A short hash of a text, to tell which bundled text an edit was made from. */
  function shortHash(text) {
    let h = 0x811c9dc5;
    for (let i = 0; i < text.length; i++) h = Math.imul(h ^ text.charCodeAt(i), 0x01000193);
    return (h >>> 0).toString(16);
  }

  const projectUrl = (path, name = project.name) => new URL(`pkg/projects/${name}/${path}${PROJECT_LOAD}`, import.meta.url);

  /** The named project's manifest, or null if this build doesn't have it. */
  function fetchManifest(name) {
    if (!manifestPromises.has(name)) {
      manifestPromises.set(name, versionReady.then(() => fetch(projectUrl("manifest.json", name)))
        .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
        .catch(() => null));
    }
    return manifestPromises.get(name);
  }

  /** The project's files, with the saved edits applied. */
  function fetchProject(manifest) {
    const name = manifest.name;
    const get = (path) =>
      fetch(projectUrl(path, name)).then((r) => { if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`); return r.text(); });
    // The sources, and the files `include` reads (`data`: the puzzle inputs).
    if (!bundlePromises.has(name)) bundlePromises.set(name, Promise.all([Promise.all(manifest.files.map(get)), Promise.all((manifest.data ?? []).map(get))])
      .then(([texts, data]) => {
        const bundled = new Map(manifest.files.map((path, i) => [path, texts[i]]));
        const state = { name, manifest, bundled, texts: new Map(bundled), stale: new Map(), dropped: [], day: 0, open: "",
                        extras: new Set(), outlineTabs: null, errors: new Set(), namespaceOf: new Map(), carets: new Map(),
                        examples: new Map(), data };
        for (const path of manifest.files) {
          let saved = null;
          try { saved = JSON.parse(stored(fileKey(path, name))); } catch {}
          if (!saved || typeof saved.text !== "string") continue;
          if (saved.text === bundled.get(path)) { forget(fileKey(path, name)); continue; }
          state.texts.set(path, saved.text);
          // The bundled file changed since the edit: keep the edit, and ask.
          if (saved.from !== shortHash(bundled.get(path))) state.stale.set(path, saved.from);
        }
        try {
          const prefix = `${keysOf(name)}file.`;
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key.startsWith(prefix) && !bundled.has(key.slice(prefix.length))) state.dropped.push(key);
          }
          for (const key of state.dropped) forget(key);
        } catch {}
        return state;
      }));
    return bundlePromises.get(name);
  }

  /** What a render or a run is for: the source, or the day with every file's text. */
  const stateKey = () => project
    ? JSON.stringify([project.day, project.manifest.files.map((p) => project.texts.get(p))]) : sourceText();

  /** A compiler request for the open program or project. */
  function requestFor(action, extra = {}) {
    if (!project) return { action, source: sourceText(), ...extra };
    const { manifest } = project;
    const data = manifest.data ?? [];
    return { action, project: project.name, paths: [...manifest.files, ...data],
             texts: [...manifest.files.map((p) => project.texts.get(p)), ...project.data],
             targets: manifest.days[project.day].namespaces.join(","), ...extra };
  }

  const isEdited = (path) => project.texts.get(path) !== project.bundled.get(path);

  /** A tab's label: the path from the day's folder (or from `Aoc/`, for the shared files). */
  function tabLabel(path) {
    const day = project.manifest.days[project.day];
    const dayFolder = day.open.replace(/[^/]*$/, "");
    return path.startsWith(dayFolder) ? path.slice(dayFolder.length) : path.replace(/^src\/(Aoc|Rogue)\//, "");
  }

  /** The day's files before the compiler has said which they are. */
  function initialTabs() {
    const day = project.manifest.days[project.day];
    const folder = day.open.replace(/[^/]*$/, "");
    return [day.open, ...project.manifest.files.filter((p) => p.startsWith(`${folder}Tests/`) || p.startsWith(`${folder}Proofs/`))];
  }

  function tabPaths() {
    const list = [...(project.outlineTabs ?? initialTabs())];
    for (const path of [...project.extras, project.open]) if (!list.includes(path)) list.push(path);
    return list;
  }

  function renderTabs() {
    const paths = tabPaths();
    fileTabs.replaceChildren(...paths.map((path) => {
      const tab = el("button", { type: "button", role: "tab", title: path }, tabLabel(path));
      tab.dataset.path = path;
      tab.setAttribute("aria-selected", String(path === project.open));
      if (project.errors.has(path)) {
        tab.dataset.errors = "";
        tab.append(el("span", { className: "mark", title: "has errors" }, "!"));
      }
      if (isEdited(path)) {
        tab.dataset.edited = "";
        tab.append(el("span", { className: "mark edited", title: "edited" }, "•"));
      }
      tab.addEventListener("click", () => openFile(path));
      return tab;
    }));
    const others = project.manifest.files.filter((p) => !paths.includes(p));
    otherFiles.replaceChildren(el("option", { value: "" }, "Other files…"),
      ...others.map((p) => el("option", { value: p }, p.replace(/^src\/(Aoc|Rogue)\//, ""))));
    otherFiles.hidden = others.length === 0;
    resetFile.disabled = !isEdited(project.open);
    resetProject.disabled = !project.manifest.files.some(isEdited);
  }

  function renderBanner() {
    const parts = [];
    const { open } = project;
    if (project.stale.has(open)) {
      const use = el("button", { type: "button", id: "use-new" }, "Use the new version");
      const keep = el("button", { type: "button", id: "keep-mine" }, "Keep mine");
      use.addEventListener("click", () => {
        project.stale.delete(open);
        project.texts.set(open, project.bundled.get(open));
        showFile();
        refresh();
      });
      keep.addEventListener("click", () => {
        project.stale.delete(open);
        saveOpenFile();
        renderBanner();
      });
      parts.push(el("span", {}, `${tabLabel(open)} has changed since you edited it.`), use, keep);
    }
    if (project.dropped.length) {
      const ok = el("button", { type: "button" }, "OK");
      ok.addEventListener("click", () => { project.dropped = []; renderBanner(); });
      parts.push(el("span", {}, `${project.dropped.length === 1 ? "A saved edit was" : `${project.dropped.length} saved edits were`} dropped: ` +
                                "the file is no longer in the project."), ok);
    }
    banner.replaceChildren(...parts);
    banner.hidden = parts.length === 0;
  }

  /** Puts the open file in the editor. */
  function showFile() {
    source.open({ uri: projectUri(project.open), path: project.open, text: project.texts.get(project.open),
                  restore: project.carets.get(project.open) });
    renderTabs();
    renderBanner();
  }

  /** Saves the editor's text as the open file's (an edit, if it differs from the bundled). */
  function saveOpenFile() {
    saveFile(project.open, source.value);
    renderTabs();
  }

  /** Keeps `text` as the file's: an edit, if it differs from the bundled one. */
  function saveFile(path, text) {
    const bundled = project.bundled.get(path);
    project.texts.set(path, text);
    if (text === bundled) {
      forget(fileKey(path));
      project.stale.delete(path);
    } else {
      store(fileKey(path), JSON.stringify({ text, from: project.stale.get(path) ?? shortHash(bundled) }));
    }
  }

  function rememberCaret() {
    project.carets.set(project.open, source.snapshot());
  }

  function openFile(path) {
    if (project.open !== path) {
      rememberCaret();
      if (!tabPaths().includes(path)) project.extras.add(path);
      project.open = path;
      store(`${keysOf(project.name)}open`, path);
    }
    showFile();
    render();
  }

  /**
   * Moves the caret to `line`:`column` (from 1) of a file; given the
   * diagnostic, selects its span (`endLine` from 0, `endColumn` in UTF-16
   * units, as the compiler's ranges are).
   */
  function goTo(path, line, column, diagnostic) {
    openFile(path);
    const from = source.offset(line - 1, column - 1);
    const to = diagnostic?.endLine !== undefined ? Math.max(from, source.offset(diagnostic.endLine, diagnostic.endColumn)) : from;
    source.focus();
    source.reveal(from, to);
  }

  /**
   * Asks the language server to check the day's own files (its program,
   * tests and proofs) along with the one being edited, before the rest of
   * the project, so the Check pane has all of the day's diagnostics.
   */
  let focusedDay = "";
  function focusDay(paths) {
    const key = JSON.stringify(paths);
    if (key === focusedDay) return;
    focusedDay = key;
    source.checkFirst(paths.map(projectUri));
  }

  /** Works out the day's tabs from the compiler's outline: the day's program, its proofs, then what they use. */
  function useOutline(outline) {
    const day = project.manifest.days[project.day];
    const byName = new Map(outline.namespaces.map((n) => [n.name, n]));
    project.namespaceOf = new Map(outline.namespaces.flatMap((n) => n.files.map((f) => [f, n.name])));
    const own = new Set(day.namespaces);
    const used = new Set();
    // The day's files in the order they are checked: what a file uses first.
    const order = [];
    const files = (name) => [...(byName.get(name)?.files ?? [])].sort();
    const visit = (name) => {
      if (used.has(name) || !byName.has(name)) return;
      used.add(name);
      byName.get(name).uses.forEach(visit);
      order.push(...files(name));
    };
    day.namespaces.forEach(visit);
    project.checkOrder = order;
    const shared = [...used].filter((n) => !own.has(n)).flatMap(files).sort();
    const tabs = [...day.namespaces.flatMap(files), ...shared];
    focusDay(day.namespaces.flatMap(files));
    if (JSON.stringify(tabs) !== JSON.stringify(project.outlineTabs)) {
      project.outlineTabs = tabs;
      renderTabs();
    }
  }

  /** Checks from the errors' files which tabs get the red mark. */
  function markErrors(diagnostics = []) {
    const files = new Set(diagnostics.filter((d) => d.severity === "error" && d.file).map((d) => d.file));
    if ([...files].sort().join() !== [...project.errors].sort().join()) {
      project.errors = files;
      renderTabs();
    }
  }

  /** The errors of a project check, grouped by file, each with a link to its place in the file. */
  function projectErrorsView(answer) {
    const groups = new Map();
    for (const d of answer.diagnostics ?? []) {
      if (d.severity !== "error") continue;
      const key = d.file ?? "";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(d);
    }
    const goals = goalsView(answer.goals, answer.diagnostics);
    if (groups.size === 0) return [...goals, ...errorsView(answer.errors, answer.warnings)];
    const views = [...goals];
    for (const [file, found] of groups) {
      const group = el("div", { className: "errorfile" });
      if (file) group.dataset.file = file;
      for (const d of found) {
        if (file) {
          const jump = el("button", { type: "button", className: "jump" }, `${file}:${d.line}:${d.column}`);
          jump.addEventListener("click", () => goTo(file, d.line, d.column, d));
          group.append(jump);
        }
        group.append(el("pre", { className: "errors" }, d.text));
      }
      views.push(el("h2", {}, "Errors" + (file ? ` in ${tabLabel(file)}` : "")), group);
    }
    return [...views, ...warningsView(answer.warnings)];
  }

  async function loadProject(name, index, openPath) {
    const manifest = await fetchManifest(name);
    if (!manifest) return loadExample("ex-lists");
    let state;
    try {
      state = await fetchProject(manifest);
    } catch (e) {
      setStatus("The project didn’t load", "bad");
      output.replaceChildren(el("p", {}, `The bundled project couldn’t be fetched: ${e.message}`));
      return;
    }
    if (project) rememberCaret();
    project = state;
    giveServer(state);
    const day = manifest.days[Math.min(index, manifest.days.length - 1)];
    project.day = manifest.days.indexOf(day);
    project.open = openPath && manifest.files.includes(openPath) ? openPath : day.open;
    project.extras = new Set();
    project.outlineTabs = null;
    project.checkOrder = null;
    project.errors = new Set();
    focusDay(initialTabs());
    const id = `${name}:${project.day}`;
    picker.value = id;
    filebar.hidden = false;
    store("stitchwort.example", id);
    showEntryLink(id);
    store(`${keysOf(name)}open`, project.open);
    evalImports = [];
    evalInput = day.evalInput ?? (!day.main ? "" : day.main === "Aoc.Year2025.Day02.main" ? "Aoc.Year2025.Day02.Tests.exampleRanges.map Aoc.Year2025.Day02.solvePart1" : `${day.main.replace(/main$/, "Tests.example")}`);
    // The Run input: what was saved for this day, else the day's first
    // bundled input (the example).
    inputChoice.replaceChildren(el("option", { value: "" }, "Input…"),
      ...(day.inputs ?? []).map((choice) => el("option", { value: choice.path }, choice.title)));
    inputChoice.hidden = !(day.inputs ?? []).length;
    let input = stored(inputKey(day.main));
    if (input === null) input = (await bundledInput(day.inputs?.[0]?.path)) ?? day.defaultInput ?? "";
    setRunInput(input);
    setRunHint();
    runResult.replaceChildren();
    ranSource = null;
    showFile();
    refresh();
  }

  /** A bundled input's text, or null. */
  async function bundledInput(path) {
    if (!path) return null;
    try {
      await versionReady;
      const r = await fetch(projectUrl(path));
      return r.ok ? await r.text() : null;
    } catch { return null; }
  }

  inputChoice.addEventListener("change", async () => {
    const path = inputChoice.value;
    inputChoice.value = "";
    const text = await bundledInput(path);
    if (text === null) return;
    setRunInput(text);
    runInput.dispatchEvent(new Event("input"));
  });

  // Direct links to the Example dropdown's entries: `#example/<slug>`, the
  // slug being the entry's name in lowercase with runs of other characters
  // as `-` (`#example/proofs-about-lists`), and `#aoc/YYYY/dayNN`
  // (`#aoc/2025/day02`). A chapter project's entries are `#sf/basics` (the
  // Software Foundations port) and `#book/3` (the book's chapter 3): the entry's
  // `slug` in the manifest.
  const linkNotice = document.getElementById("link-notice");
  const slugOf = (title) => title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const dayNumber = (day) => String(day.open.match(/Day(\d+)\.sw$/)?.[1] ?? "").padStart(2, "0");
  /** A project entry's part of its link: `2025/day02` for a day of Advent of Code, else the slug of its title. */
  /** A project entry's name: `2024 / Day 1` for a day with a year, else its title. */
  const dayName = (day) => (day.year ? `${day.year} / ${day.title}` : day.title);
  const daySlug = (name, day) => (name === "aoc" ? `${day.year}/day${dayNumber(day)}` : day.slug ?? slugOf(day.title));

  /** The fragment for a dropdown value, without the `#`. */
  function hashFor(id) {
    const name = projectOfId(id);
    if (name) {
      const day = project?.name === name ? project.manifest.days[Number(id.slice(name.length + 1))] : null;
      return day ? `${name}/${daySlug(name, day)}` : null;
    }
    const ex = document.getElementById(id);
    return ex ? `example/${slugOf(ex.dataset.title)}` : null;
  }

  /** The dropdown value a fragment names, or null (also for anything but plain tokens). */
  async function idForHash(hash) {
    if (!/^[A-Za-z0-9\/._-]+$/.test(hash)) return null;
    const [kind, ...rest] = hash.split("/");
    const name = rest.join("/");
    if (kind === "example") return rest.length === 1 ? examples.find((ex) => slugOf(ex.dataset.title) === name)?.id ?? null : null;
    if (PROJECT_NAMES.includes(kind)) {
      const manifest = await fetchManifest(kind);
      const i = manifest?.days.findIndex((day) => daySlug(kind, day) === name) ?? -1;
      return i >= 0 ? `${kind}:${i}` : null;
    }
    return null;
  }

  /** Puts the entry's link in the address bar, without a new history entry. */
  function showEntryLink(id) {
    linkNotice.hidden = true;
    const hash = hashFor(id);
    if (hash === null || location.hash === `#${hash}`) return;
    try { history.replaceState(null, "", `#${hash}`); } catch {}
  }
