<meta charset="utf-8">
<title>Stitchwort Playground</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,MONO@-15..0,300..800,0..1,0..1&display=swap">
<style>
  /* Layout: a hedgerow-green tool. Source on the left, the compiler's answers on
     the right; one column on a phone. */
  :root {
    --paper: #f3f6f1;
    --petal: #fdfefc;
    --ink: #1c2a21;
    --muted: #5a6a5f;
    --line: #d5dfd2;
    --leaf: #2d6a3e;
    --leaf-soft: #e1ecdf;
    --ok: #2f7a47;
    --bad: #a83b34;
    --bad-soft: #f6e4e1;
    /* Syntax colours for the source: hedgerow flowers on the same paper. */
    --hl-keyword: #2d6a3e;
    --hl-name: #1f6470;
    --hl-defined: #2f4f8f;
    --hl-number: #7b4b94;
    --hl-string: #8a5a12;
    --hl-comment: #627266;
    --hl-operator: #45604e;
    --hl-selection: rgb(45 106 62 / 0.2);
    --sans: "Recursive", ui-sans-serif, system-ui, sans-serif;
    --mono: "Recursive", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #111814; --petal: #0b100d; --ink: #e3ece4; --muted: #95a699;
      --line: #27332b; --leaf: #82c795; --leaf-soft: #1b2a20; --ok: #7fcb95;
      --bad: #ef8f86; --bad-soft: #2f1a18; color-scheme: dark;
      --hl-keyword: #82c795; --hl-name: #7cc4c9; --hl-defined: #9db8ec; --hl-number: #c9a3e0;
      --hl-string: #e0b870; --hl-comment: #7f9184; --hl-operator: #a3b8a8;
      --hl-selection: rgb(130 199 149 / 0.25);
    }
  }
  :root[data-theme="dark"] {
    --paper: #111814; --petal: #0b100d; --ink: #e3ece4; --muted: #95a699;
    --line: #27332b; --leaf: #82c795; --leaf-soft: #1b2a20; --ok: #7fcb95;
    --bad: #ef8f86; --bad-soft: #2f1a18; color-scheme: dark;
    --hl-keyword: #82c795; --hl-name: #7cc4c9; --hl-defined: #9db8ec; --hl-number: #c9a3e0;
    --hl-string: #e0b870; --hl-comment: #7f9184; --hl-operator: #a3b8a8;
    --hl-selection: rgb(130 199 149 / 0.25);
  }

  /* The page fills the window, and grows when the editor is dragged taller. */
  html { height: 100%; }
  body {
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-variation-settings: "CASL" 0, "MONO" 0;
    font-size: 15px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px;
    box-sizing: border-box;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 14px;
  }
  *, *::before, *::after { box-sizing: inherit; }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 20px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 34px; height: 34px; flex: none; }
  .brand h1 {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 750;
    font-variation-settings: "CASL" 1, "slnt" 0;
    letter-spacing: -0.01em;
  }
  .brand p { margin: 0; color: var(--muted); font-size: 0.85rem; }
  .picker { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  label.small {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  select, input[type="text"], button {
    font: inherit;
    color: var(--ink);
    background: var(--petal);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
  }
  button {
    cursor: pointer;
    font-weight: 600;
  }
  button.primary { background: var(--leaf); color: var(--petal); border-color: var(--leaf); }
  button:hover { border-color: var(--leaf); }
  :focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: 16px;
  }
  @media (max-width: 820px) {
    main { grid-template-columns: minmax(0, 1fr); }
    .picker { margin-left: 0; }
  }

  .pane {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .pane-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    min-height: 36px;
  }

  /* The editor: a coloured copy of the source (#highlight) sits under the
     textarea, whose own text is transparent, so only its caret and selection
     show. Everything that places a character must match between the two. */
  .editor {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--petal);
    border-radius: 8px;
  }
  textarea#source, pre#highlight {
    margin: 0;
    font-family: var(--mono);
    font-variation-settings: "MONO" 1, "CASL" 0;
    font-size: 13.5px;
    font-weight: 400;
    letter-spacing: normal;
    line-height: 1.55;
    tab-size: 2;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    white-space: pre;
    overflow-wrap: normal;
  }
  textarea#source {
    /* Its height is the resize handle's, or else fills the pane. */
    flex: 1 0 auto;
    position: relative;
    min-height: 420px;
    width: 100%;
    resize: vertical;
    color: transparent;
    caret-color: var(--ink);
    background: transparent;
    overflow: auto;
  }
  textarea#source::selection { color: transparent; background: var(--hl-selection); }
  /* Sized by script to the textarea's box less its scrollbars, and scrolled
     with it. */
  pre#highlight {
    position: absolute;
    top: 0;
    left: 0;
    border-color: transparent;
    color: var(--ink);
    overflow: hidden;
    pointer-events: none;
  }
  /* Each kind of token, as a highlight (see paint()) or, failing that, a
     span. Separate rules, since a browser drops a whole rule over a selector
     it doesn't know. */
  ::highlight(hl-keyword) { color: var(--hl-keyword); }
  ::highlight(hl-name) { color: var(--hl-name); }
  ::highlight(hl-defined) { color: var(--hl-defined); }
  ::highlight(hl-number) { color: var(--hl-number); }
  ::highlight(hl-string) { color: var(--hl-string); }
  ::highlight(hl-comment) { color: var(--hl-comment); }
  ::highlight(hl-operator) { color: var(--hl-operator); }
  .hl-keyword { color: var(--hl-keyword); }
  .hl-name { color: var(--hl-name); }
  .hl-defined { color: var(--hl-defined); }
  .hl-number { color: var(--hl-number); }
  .hl-string { color: var(--hl-string); }
  .hl-comment { color: var(--hl-comment); }
  .hl-operator { color: var(--hl-operator); }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--leaf-soft);
    color: var(--ok);
  }
  .status.bad { background: var(--bad-soft); color: var(--bad); }
  .status.idle { color: var(--muted); }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .tabs button {
    background: transparent;
    border-color: transparent;
    color: var(--muted);
    padding: 5px 10px;
  }
  .tabs button[aria-selected="true"] {
    background: var(--petal);
    border-color: var(--line);
    color: var(--ink);
  }

  .output {
    flex: 1;
    min-height: 240px;
    /* Long results scroll inside it, rather than making the page longer. */
    contain: size;
    background: var(--petal);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .output p { margin: 0; max-width: 62ch; }
  .hint { color: var(--muted); font-size: 0.88rem; }
  pre {
    margin: 0;
    font-family: var(--mono);
    font-variation-settings: "MONO" 1;
    font-size: 12.5px;
    line-height: 1.45;
    white-space: pre;
    overflow-x: auto;
  }
  pre.errors { color: var(--bad); }

  .evalrow, .runrow { display: flex; gap: 8px; }
  button.run { margin-left: auto; }
  button:disabled { cursor: default; opacity: 0.55; }
  textarea#run-input {
    width: 100%;
    resize: vertical;
    font-family: var(--mono);
    font-variation-settings: "MONO" 1, "CASL" 0;
    font-size: 13px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .run-result { display: flex; flex-direction: column; gap: 10px; }
  pre.program-output { border-left: 3px solid var(--leaf); padding-left: 10px; }
  .evalrow input { flex: 1; min-width: 0; font-family: var(--mono); font-variation-settings: "MONO" 1; }
  .result {
    font-family: var(--mono);
    font-variation-settings: "MONO" 1;
    font-size: 14px;
    border-left: 3px solid var(--leaf);
    padding-left: 10px;
  }
  .result .type { color: var(--muted); }

  ul.tests { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  ul.tests li { display: flex; gap: 10px; align-items: baseline; }
  ul.tests .mark { font-weight: 700; width: 1.2em; text-align: center; }
  ul.tests .pass .mark { color: var(--ok); }
  ul.tests .fail .mark { color: var(--bad); }
  .summary { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.88rem; }

  h2 {
    margin: 0;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 650;
  }

  @media (prefers-reduced-motion: no-preference) {
    .status { transition: background-color 150ms, color 150ms; }
  }
</style>

<header>
  <div class="brand">
    <svg viewBox="-50 -50 100 100" aria-hidden="true">
      <!-- Stitchwort: five white petals, each split almost to the base. -->
      <g id="petal-pair" style="fill: var(--petal); stroke: var(--leaf); stroke-width: 2.5">
        <ellipse cx="-6" cy="-24" rx="7" ry="20" transform="rotate(-9 -6 -24)"/>
        <ellipse cx="6" cy="-24" rx="7" ry="20" transform="rotate(9 6 -24)"/>
      </g>
      <use href="#petal-pair" transform="rotate(72)"/>
      <use href="#petal-pair" transform="rotate(144)"/>
      <use href="#petal-pair" transform="rotate(216)"/>
      <use href="#petal-pair" transform="rotate(288)"/>
      <circle r="8" style="fill: var(--leaf)"/>
    </svg>
    <div>
      <h1>Stitchwort</h1>
      <p>A total, dependently-typed language. Every definition is re-checked by the kernel.</p>
    </div>
  </div>
  <div class="picker">
    <label class="small" for="example">Example</label>
    <select id="example"></select>
  </div>
</header>

<main>
  <section class="pane" aria-label="Source">
    <div class="pane-head">
      <span id="status" class="status idle">Loading the compiler…</span>
      <button id="run" class="primary run" type="button" title="Run main (Ctrl+Enter)">Run ▸</button>
    </div>
    <div class="editor">
      <pre id="highlight" aria-hidden="true"></pre>
      <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Stitchwort source"></textarea>
    </div>
  </section>

  <section class="pane" aria-label="Results">
    <div class="pane-head">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-check" aria-selected="true" data-view="check">Check</button>
        <button role="tab" id="tab-tests" aria-selected="false" data-view="tests">Tests</button>
        <button role="tab" id="tab-eval" aria-selected="false" data-view="eval">Evaluate</button>
        <button role="tab" id="tab-js" aria-selected="false" data-view="js">JavaScript</button>
        <button role="tab" id="tab-run" aria-selected="false" data-view="run">Run</button>
      </div>
    </div>
    <div class="output" id="output" role="tabpanel"></div>
  </section>
</main>

<script type="text/plain" id="ex-lists" data-title="Proofs about lists">-- A proof that appending lists adds their lengths, by induction on the first
-- list. The compiler checks it; change a line and see what it says.

theorem appendLength : (xs : List a) -> (ys : List a) ->
    length (append xs ys) = length xs + length ys
appendLength Nil         ys = rfl
appendLength (Cons x xs) ys = cong Succ (appendLength xs ys)

reverse : List a -> List a
reverse Nil         = Nil
reverse (Cons x xs) = append (reverse xs) [x]

-- Proofs by computation:
theorem reverseExample : reverse [1, 2, 3] = [3, 2, 1]
reverseExample = rfl

-- Try: `appendLength (Cons x xs) ys = appendLength xs ys` (a wrong step), or a
-- recursive call that doesn't get smaller, like `reverse (Cons x xs)`.
</script>

<script type="text/plain" id="ex-division" data-title="Safe division">-- `/` needs a proof that the divisor isn't zero. For a literal, the compiler
-- decides it; for a runtime value, establish it with `if h : … then … else`.

half : Nat -> Nat
half n = n / 2

safeDiv : Nat -> Nat -> Nat
safeDiv n d = if h : d != 0 then n / d else 0

-- A function can ask for the proof itself; callers' `auto` finds it.
average : (total : Nat) -> (count : Nat) -> [auto ok : count != 0] -> Nat
average total count = total / count

averageOfThree : Nat
averageOfThree = average 12 3

-- Try: `ratio n d = n / d` (can't be decided before the program runs), or
-- `oops = 7 / 0` (false). Evaluate `safeDiv 9 0` in the Evaluate tab.
</script>

<script type="text/plain" id="ex-tests" data-title="Tests">-- Tests are `Bool` expressions that must be `True`. The command-line tool
-- caches each result by a hash of everything the test depends on.

double : Nat -> Nat
double n = n + n

isEven : Nat -> Bool
isEven n = leq (n % 2) 0

test "double 3 is 6" = leq (double 3) 6
test "doubles are even" = isEven (double 7)
test "7 is odd" = not (isEven 7)
test "this one fails" = isEven 3
</script>

<script type="text/plain" id="ex-abilities" data-title="Abilities and handlers">-- Effectful code is written directly; the abilities it may perform are in
-- its type. A handler removes one. `k` resumes the computation and may be
-- called more than once. Run the tests to see the results.

ability State (s : Type) where
  get : () -> {State s} s
  put : s -> {State s} ()

ability Choose where
  choose : () -> {Choose} Bool

fstOf : Pair a b -> a
fstOf (MkPair x y) = x

sndOf : Pair a b -> b
sndOf (MkPair x y) = y

runState : s -> (() -> {State s | e} a) -> {e} Pair a s
runState init prog =
  let run : s -> {e} Pair a s =
    handle prog () with
      | return x       -> \st -> MkPair x st
      | get () => k    -> \st -> k st st
      | put st2 => k   -> \st -> k () st2
  run init

allResults : (() -> {Choose | e} a) -> {e} List a
allResults prog =
  handle prog () with
    | return x       -> [x]
    | choose _ => k  -> append (k True) (k False)

-- Choose, then add 10 to the state if it said yes.
step : () -> {State Nat, Choose} Nat
step u =
  if choose () then put (get () + 10) else ()
  get ()

-- Each branch has its own state...
test "state inside choice" = length (allResults (\u -> runState 1 step)) == 2

-- ...or one state threads through both branches.
test "choice inside state" = sndOf (runState 1 (\u -> allResults step)) == 11
</script>
<script type="text/plain" id="ex-main" data-title="Input and output: main">-- A program with input and output. `main` prints with `print` and reads
-- lines with `readLine`, which gives `Nothing` at the end of the input. Press
-- Run: the Run tab's box holds the input lines. The tests run the same `main`
-- with `simulate`, which takes the input as a list.

-- The text, or a default at end of input.
textOr : Text -> Maybe Text -> Text
textOr d Nothing  = d
textOr d (Just t) = t

-- Reports a line that should be a number, and goes on with the new total.
stepNumber : Nat -> Text -> Maybe Nat -> (Nat -> {IO} Nat) -> {IO} Nat
stepNumber total l Nothing  more =
  print ("\"" ++ l ++ "\" isn't a number; skipped")
  more total
stepNumber total l (Just n) more =
  print ("  total: " ++ natToText (total + n))
  more (total + n)

-- What to do with a line, given the total so far. An empty line, or the end
-- of input, stops.
step : Nat -> Maybe Text -> (Nat -> {IO} Nat) -> {IO} Nat
step total Nothing  more = total
step total (Just l) more =
  if textIsEmpty l then total else stepNumber total l (textToNat (textTrim l)) more

-- Adds the numbers on at most this many more lines. The bound keeps the
-- recursion structural: every run of `main` performs a bounded number of
-- operations.
addLines : Nat -> Nat -> {IO} Nat
addLines 0        total = total
addLines (Succ n) total = step total (readLine ()) (\t -> addLines n t)

main : () -> {IO} ()
main u =
  print "What's your name?"
  let name = textOr "stranger" (readLine ())
  print ("Hello, " ++ name ++ "! Type numbers to add, one per line, and an empty line to stop.")
  let total = addLines 1000 0
  print ("The sum is " ++ natToText total ++ ". Goodbye, " ++ name ++ ".")

-- Testing `main` with scripted input

eqTexts : List Text -> List Text -> Bool
eqTexts Nil         Nil         = True
eqTexts (Cons x xs) (Cons y ys) = if x == y then eqTexts xs ys else False
eqTexts _           _           = False

printed : List Text -> List Text
printed input = fst (simulate input main)

test "a session" =
  eqTexts (printed ["Ada", "1", "2", "x", " 39 ", ""])
    [ "What's your name?"
    , "Hello, Ada! Type numbers to add, one per line, and an empty line to stop."
    , "  total: 1"
    , "  total: 3"
    , "\"x\" isn't a number; skipped"
    , "  total: 42"
    , "The sum is 42. Goodbye, Ada."
    ]

test "end of input stops it too" =
  eqTexts (printed ["Ada", "5"])
    [ "What's your name?"
    , "Hello, Ada! Type numbers to add, one per line, and an empty line to stop."
    , "  total: 5"
    , "The sum is 5. Goodbye, Ada."
    ]

test "no input at all" =
  eqTexts (printed [])
    [ "What's your name?"
    , "Hello, stranger! Type numbers to add, one per line, and an empty line to stop."
    , "The sum is 0. Goodbye, stranger."
    ]
</script>
<script type="text/plain" id="ex-js" data-title="Extract to JavaScript">-- Exports become an ES module with TypeScript types. Preconditions that JS
-- can't prove are checked at runtime instead. See the JavaScript tab.

export
applyDiscount : (price : Nat) -> (percent : Nat) -> [auto ok : percent <= 100] -> Nat
applyDiscount price percent = price - price * percent / 100

type Shape : Type =
  | Square (side : Nat)
  | Rect (width : Nat) (height : Nat)

export
area : Shape -> Nat
area (Square s) = s * s
area (Rect w h) = w * h
</script>

<script type="module">
  const status = document.getElementById("status");
  const source = document.getElementById("source");
  const output = document.getElementById("output");
  const picker = document.getElementById("example");
  const runButton = document.getElementById("run");
  const tabs = [...document.querySelectorAll(".tabs button")];
  const examples = [...document.querySelectorAll('script[type="text/plain"]')];

  /** Most a run may print, in bytes. */
  const MAX_OUTPUT = 256 * 1024;
  /** How long a run may take before it's stopped. */
  const RUN_SECONDS = 15;
  /** How long checking, testing, evaluating or extracting may take. */
  const CHECK_SECONDS = 60;

  let view = "check";
  let evalInput = "";

  for (const ex of examples) {
    const option = document.createElement("option");
    option.value = ex.id;
    option.textContent = ex.dataset.title;
    picker.append(option);
  }

  const stored = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
  const store = (key, value) => { try { localStorage.setItem(key, value); } catch {} };

  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) node[k] = v;
    node.append(...children);
    return node;
  }

  const secs = (ms) => ms < 1000 ? `${ms.toFixed(0)} ms` : `${(ms / 1000).toFixed(1)} s`;

  // The compiler runs in a Web Worker (playground-worker.js), one request at
  // a time. After a crash (a trap, or the engine's stack running out, which
  // deep nesting can still cause) the WebAssembly instance's state isn't
  // restored, so that worker is discarded and the next request starts a
  // fresh one. A request that's superseded, stopped or too slow is cancelled
  // by terminating its worker. The page compiles the WebAssembly once and
  // hands the module to each new worker, so restarting is quick.
  const wasm = fetch(new URL("pkg/stitchwort_web_bg.wasm", import.meta.url))
    .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.arrayBuffer(); })
    .then((bytes) => WebAssembly.compile(bytes));

  /** A worker that has answered: workers can run here. */
  let workersWork = false;

  class Compiler {
    worker = null;
    pending = null;
    nextId = 0;

    /**
     * Runs `request` and resolves to { out } (the compiler's answer),
     * { crashed, error }, { timedOut } or { cancelled }. A call while
     * another is running cancels that one. A run's output is passed to
     * `onOutput` as it's printed.
     */
    async call(request, seconds, onOutput) {
      this.cancel();
      let module;
      try {
        module = await wasm;
      } catch (e) {
        return { crashed: true, error: String(e), noCompiler: true };
      }
      this.cancel();
      return new Promise((resolve) => {
        const id = ++this.nextId;
        const timer = setTimeout(() => this.finish(id, { timedOut: true, seconds }), seconds * 1000);
        this.pending = { id, resolve, timer, onOutput };
        try {
          if (!this.worker) this.start();
          this.worker.postMessage({ ...request, id, module });
        } catch (e) {
          this.finish(id, { crashed: true, error: String(e), noWorker: true });
        }
      });
    }

    /** Stops the running request, if there is one. */
    cancel() {
      if (this.pending) this.finish(this.pending.id, { cancelled: true });
    }

    start() {
      const worker = new Worker(new URL("playground-worker.js", import.meta.url), { type: "module" });
      worker.onmessage = ({ data }) => {
        workersWork = true;
        if ("output" in data) {
          if (this.pending?.id === data.id) this.pending.onOutput?.(data.output);
        } else {
          this.finish(data.id, data);
        }
      };
      worker.onerror = (e) => {
        e.preventDefault();
        this.finish(this.pending?.id, { crashed: true, error: e.message || "the worker failed", noWorker: !workersWork });
      };
      this.worker = worker;
    }

    finish(id, result) {
      if (!this.pending || this.pending.id !== id) return;
      const { resolve, timer } = this.pending;
      this.pending = null;
      clearTimeout(timer);
      if (!result.out) {
        // Crashed, too slow or cancelled: this worker can't be trusted, or
        // is still busy. Start afresh next time.
        this.worker?.terminate();
        this.worker = null;
      }
      resolve(result);
    }
  }

  // If workers can't start here (a host that forbids them), the compiler
  // runs in the page instead: it can't be stopped, and after a crash the
  // page has to be reloaded.
  class InPage {
    broken = null;
    async call(request, seconds, onOutput) {
      if (this.broken) return { crashed: true, error: this.broken, inPage: true };
      try {
        const compiler = await import("./pkg/stitchwort_web.js");
        await compiler.default({ module_or_path: await wasm });
        const sink = { write: (text) => onOutput?.(text) };
        const answer = {
          check: () => compiler.check(request.source),
          test: () => compiler.test(request.source),
          evaluate: () => compiler.evaluate(request.source, request.expr),
          extract: () => compiler.extract(request.source),
          run: () => compiler.run_streaming(request.source, request.input, request.maxOutput, sink),
        }[request.action];
        return { out: JSON.parse(answer()) };
      } catch (e) {
        this.broken = `${e?.name ?? "Error"}: ${e?.message ?? e}`;
        return { crashed: true, error: this.broken, inPage: true };
      }
    }
    cancel() {}
  }

  /** Checking, testing, evaluating and extracting. */
  let checker = new Compiler();
  /** Running `main`, separately, so editing stays responsive during a run. */
  let runner = new Compiler();

  /** If the worker couldn't start at all, switches to the in-page compiler. */
  function fallBack(result) {
    if (!result.noWorker || workersWork || checker instanceof InPage) return false;
    console.warn("The playground's worker didn't start, so the compiler runs in the page:", result.error);
    checker = runner = new InPage();
    return true;
  }

  // What a crash or timeout means, for the person using the page.
  function trouble(result) {
    if (result.noCompiler) {
      return "This page runs the Stitchwort compiler as WebAssembly, and it couldn’t start here: " + result.error;
    }
    if (result.inPage) {
      return `The compiler crashed (${result.error}). Reload the page to restart it.`;
    }
    if (result.timedOut) {
      return `The compiler took longer than ${result.seconds} s, so it was stopped.`;
    }
    return `The compiler crashed (${result.error}). This can happen with very deeply nested ` +
      "programs or values. It has been restarted; change the program to try again.";
  }

  /**
   * Asks the checker; resolves to the compiler's answer, or to null after
   * showing what went wrong (or nothing, if the request was superseded).
   */
  async function ask(request) {
    let result = await checker.call(request, CHECK_SECONDS);
    if (fallBack(result)) result = await checker.call(request, CHECK_SECONDS);
    if (result.out) return result.out;
    if (!result.cancelled) {
      setStatus(result.noCompiler ? "The compiler didn’t load" : result.timedOut ? "Took too long" : "The compiler crashed", "bad");
      output.replaceChildren(el("p", {}, trouble(result)));
    }
    return null;
  }

  // Running `main`. The controls persist across renders, so the input and the
  // last run's output stay while switching tabs.
  const runInput = el("textarea", { id: "run-input", spellcheck: false, rows: 4,
                                    placeholder: "Input, one line per readLine ()" });
  runInput.setAttribute("aria-label", "Input lines for the program");
  const runAgain = el("button", { className: "primary", type: "button" }, "Run");
  const stopButton = el("button", { type: "button", disabled: true }, "Stop");
  const runResult = el("div", { className: "run-result" });
  const runChecked = el("div");
  const runStale = el("p", { className: "hint", hidden: true }, "The source has changed since this run.");
  let ranSource = null;

  const runPanel = [
    el("p", { className: "hint" },
       "Run calls main (). Its readLine () gets the lines below, one at a time, then Nothing. " +
       `A run may print up to ${MAX_OUTPUT / 1024} KB and take up to ${RUN_SECONDS} s.`),
    runInput,
    el("div", { className: "runrow" }, runAgain, stopButton),
    runChecked,
    runStale,
    runResult,
  ];

  async function runMain() {
    selectView("run");
    const src = source.value;
    runButton.disabled = runAgain.disabled = true;
    stopButton.disabled = false;
    // The output shows as it's printed: the worker sends each line, and the
    // lines that arrive between frames are added together.
    const shown = el("pre", { className: "program-output" });
    const running = el("p", { className: "hint" }, "Running…");
    runResult.replaceChildren(running);
    let printed = "";
    let unshown = "";
    let ended = false;
    const onOutput = (text) => {
      if (!unshown) {
        requestAnimationFrame(() => {
          if (ended) return;
          if (!shown.isConnected) runResult.replaceChildren(el("h2", {}, "Output"), shown, running);
          shown.append(unshown);
          unshown = "";
        });
      }
      printed += text;
      unshown += text;
    };
    const request = { action: "run", source: src, input: runInput.value, maxOutput: MAX_OUTPUT };
    const started = performance.now();
    let result = await runner.call(request, RUN_SECONDS, onOutput);
    if (fallBack(result)) result = await runner.call(request, RUN_SECONDS, onOutput);
    const took = performance.now() - started;
    ended = true;
    runButton.disabled = runAgain.disabled = false;
    stopButton.disabled = true;
    ranSource = src;
    runStale.hidden = true;

    const parts = [];
    const out = result.out;
    if (out?.ran || printed || result.cancelled || result.timedOut) {
      parts.push(el("h2", {}, "Output"),
                 printed ? el("pre", { className: "program-output" }, printed)
                         : el("p", { className: "hint" }, "Nothing was printed."));
    }
    if (out?.ok) {
      parts.push(el("p", { className: "summary" }, `Finished in ${secs(took)}.`));
    } else if (out) {
      parts.push(...errorsView(out.errors));
    } else if (result.cancelled) {
      parts.push(el("p", {}, `Stopped after ${secs(took)}.`));
    } else if (result.timedOut) {
      parts.push(el("p", {}, `Stopped after ${RUN_SECONDS} s, the longest a run may take.`));
    } else {
      parts.push(el("p", {}, trouble(result)));
    }
    runResult.replaceChildren(...parts);
  }

  runButton.addEventListener("click", runMain);
  runAgain.addEventListener("click", runMain);
  stopButton.addEventListener("click", () => runner.cancel());
  runInput.addEventListener("input", () => store("stitchwort.input", runInput.value));

  function loadExample(id) {
    const ex = document.getElementById(id) || examples[0];
    picker.value = ex.id;
    source.value = ex.textContent.replace(/^\n/, "");
    evalInput = { "ex-lists": "reverse [1, 2, 3]", "ex-division": "safeDiv 9 0",
                  "ex-tests": "double 21", "ex-js": "applyDiscount 8 25",
                  "ex-main": 'printed ["Ada", "1", "2"]' }[ex.id] || "";
    runInput.value = { "ex-main": "Ada\n40\ntwo\n2\n" }[ex.id] || "";
    runResult.replaceChildren();
    store("stitchwort.example", ex.id);
    store("stitchwort.input", runInput.value);
    refresh();
  }

  function setStatus(text, kind) {
    status.textContent = text;
    status.className = "status " + (kind || "");
  }

  function errorsView(errors) {
    return [el("h2", {}, "Errors"), el("pre", { className: "errors" }, errors)];
  }

  /** Each render has a number; a newer one supersedes it. */
  let rendering = 0;

  async function render() {
    const current = ++rendering;
    const src = source.value;
    if (view === "run") {
      output.replaceChildren(...runPanel);
      runStale.hidden = ranSource === null || ranSource === src;
    }
    const checked = await ask({ action: "check", source: src });
    if (current !== rendering || !checked) return;
    setStatus(checked.ok ? "Checked by the kernel" : "Doesn’t check", checked.ok ? "" : "bad");

    if (view === "run") {
      runChecked.replaceChildren(...(checked.ok ? [] :
        [el("p", { className: "hint" }, "This doesn’t check yet."), ...errorsView(checked.errors)]));
      return;
    }

    output.replaceChildren();
    if (view === "check") {
      if (checked.ok) {
        output.append(
          el("p", {}, "Every definition type-checks, every recursive function terminates, and every proof holds. The kernel re-checked them all."),
          el("p", { className: "hint" }, "Edit the source to see errors as you type. The Tests, Evaluate, JavaScript and Run tabs use the same program."));
      } else {
        output.append(...errorsView(checked.errors));
      }
      return;
    }

    if (!checked.ok) {
      output.append(el("p", { className: "hint" }, "Fix the errors first; the Check tab shows them."), ...errorsView(checked.errors));
      return;
    }

    if (view === "tests") {
      output.append(el("p", { className: "hint" }, "Running the tests…"));
      const result = await ask({ action: "test", source: src });
      if (current !== rendering || !result) return;
      output.replaceChildren();
      if (result.tests.length === 0) {
        output.append(el("p", { className: "hint" }, 'No tests yet. Add one: test "name" = leq (1 + 1) 2'));
        return;
      }
      const list = el("ul", { className: "tests" });
      for (const t of result.tests) {
        const unfinished = t.outcome !== "passed" && t.outcome !== "failed";
        list.append(el("li", { className: t.passed ? "pass" : "fail" },
          el("span", { className: "mark" }, t.passed ? "✓" : unfinished ? "!" : "✗"),
          el("span", {}, t.name + (t.passed ? "" : unfinished ? ` (${t.outcome})` : " (evaluated to False)"))));
      }
      const failed = result.tests.filter((t) => t.outcome === "failed").length;
      const unfinished = result.tests.filter((t) => !t.passed && t.outcome !== "failed").length;
      output.append(list, el("p", { className: "summary" },
        `${result.tests.length} tests: ${result.tests.length - failed - unfinished} passed, ${failed} failed` +
        (unfinished ? `, ${unfinished} ran out of resources` : "")));
      return;
    }

    if (view === "eval") {
      const input = el("input", { type: "text", id: "eval-input", value: evalInput, spellcheck: false,
                                  placeholder: "an expression, e.g. length [1, 2]" });
      input.setAttribute("aria-label", "Expression to evaluate");
      const go = el("button", { className: "primary", type: "submit" }, "Evaluate");
      const form = el("form", { className: "evalrow" }, input, go);
      const answer = el("div");
      const evaluate = async () => {
        evalInput = input.value;
        answer.replaceChildren(el("p", { className: "hint" }, "Evaluating…"));
        const result = await ask({ action: "evaluate", source: src, expr: input.value });
        if (current !== rendering || !result) return;
        answer.replaceChildren(result.ok
          ? el("div", { className: "result" }, result.value, el("span", { className: "type" }, " : " + result.type))
          : el("pre", { className: "errors" }, result.errors));
      };
      form.addEventListener("submit", (e) => { e.preventDefault(); evaluate(); });
      output.append(form, answer);
      if (input.value) evaluate();
      return;
    }

    if (view === "js") {
      const result = await ask({ action: "extract", source: src });
      if (current !== rendering || !result) return;
      if (!result.ok) { output.append(...errorsView(result.errors)); return; }
      if (!/export declare function/.test(result.dts)) {
        output.append(el("p", { className: "hint" }, "Nothing is exported. Put `export` on the line before a function's signature."));
        return;
      }
      output.append(el("h2", {}, "TypeScript declarations"), el("pre", {}, result.dts),
                    el("h2", {}, "ES module"), el("pre", {}, result.js));
    }
  }

  // Syntax colouring. This follows the lexer (crates/syntax/src/lexer.rs):
  // its keywords, `--` line comments (there are no block comments), names
  // that may contain `'`, and string and character literals that end at the
  // closing quote or the end of the line, with `\` escaping the next
  // character. `auto` is only a keyword as the first word in `[…]`, as in
  // the parser. A name at the start of a line, or after `theorem`, is being
  // defined. One pass over the text, so a long paste stays quick.
  const KEYWORDS = new Set(["type", "theorem", "export", "test", "if", "then", "else",
                            "ability", "where", "handle", "with", "return", "let", "Type", "Prop"]);
  const KINDS = ["keyword", "name", "defined", "number", "string", "comment", "operator"];
  const isWordStart = (c) => (c >= "a" && c <= "z") || (c >= "A" && c <= "Z") || c === "_";
  const isWord = (c) => isWordStart(c) || (c >= "0" && c <= "9") || c === "'";
  const isDigit = (c) => c >= "0" && c <= "9";
  const escapeHtml = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

  /** Calls `mark(kind, start, end)` for each coloured stretch of `text`, in order. */
  function colour(text, mark) {
    // Neighbours of the same kind, like the two halves of `) ->`, merge.
    let kind = "", from = 0, to = 0;
    const add = (k, start, end) => {
      if (k === kind && start === to) { to = end; return; }
      if (kind) mark(kind, from, to);
      kind = k; from = start; to = end;
    };
    let i = 0;
    let lineStart = 0;
    let previous = "";
    while (i < text.length) {
      const c = text[i];
      const start = i;
      if (c === "\n") {
        lineStart = ++i;
      } else if (c === " " || c === "\r" || c === "\t") {
        i++;
      } else if (c === "-" && text[i + 1] === "-") {
        i = text.indexOf("\n", i);
        if (i < 0) i = text.length;
        add("comment", start, i);
      } else if (isWordStart(c)) {
        while (i < text.length && isWord(text[i])) i++;
        const word = text.slice(start, i);
        const k = KEYWORDS.has(word) || (word === "auto" && previous === "[") ? "keyword"
          : c >= "A" && c <= "Z" ? "name"
          : word !== "_" && (start === lineStart || previous === "theorem") ? "defined"
          : "";
        if (k) add(k, start, i);
        previous = word;
      } else if (isDigit(c)) {
        while (i < text.length && isDigit(text[i])) i++;
        add("number", start, i);
        previous = "0";
      } else if (c === '"' || c === "'") {
        i++;
        while (i < text.length && text[i] !== "\n" && text[i] !== c) i += text[i] === "\\" && text[i + 1] !== "\n" ? 2 : 1;
        if (text[i] === c) i++;
        add("string", start, Math.min(i, text.length));
        previous = c;
      } else {
        i++;
        add("operator", start, i);
        previous = c;
      }
    }
    add("", text.length, text.length);
  }

  const highlighted = document.getElementById("highlight");

  // Where the browser has the CSS Custom Highlight API, the copy stays one
  // text node and the colours are ranges over it. Spans would be simpler, but
  // each rounds its width a little, so on a long line the copy drifts away
  // from the textarea's text. Elsewhere, spans.
  const marks = typeof Highlight === "function" && CSS.highlights
    ? Object.fromEntries(KINDS.map((kind) => {
        const marked = new Highlight();
        CSS.highlights.set(`hl-${kind}`, marked);
        return [kind, marked];
      }))
    : null;

  function paint() {
    // A final newline only shows as a line in the textarea, so the copy gets
    // one more for the same height.
    const text = source.value;
    if (marks) {
      highlighted.textContent = text + "\n";
      const node = highlighted.firstChild;
      for (const marked of Object.values(marks)) marked.clear();
      colour(text, (kind, start, end) => marks[kind].add(new StaticRange(
        { startContainer: node, startOffset: start, endContainer: node, endOffset: end })));
    } else {
      const parts = [];
      let at = 0;
      colour(text, (kind, start, end) => {
        parts.push(escapeHtml(text.slice(at, start)),
                   `<span class="hl-${kind}">${escapeHtml(text.slice(start, end))}</span>`);
        at = end;
      });
      parts.push(escapeHtml(text.slice(at)), "\n");
      highlighted.innerHTML = parts.join("");
    }
    align();
  }

  /** Keeps the coloured copy under the textarea the same size and scroll. */
  function align() {
    const box = getComputedStyle(source);
    const borders = (a, b) => parseFloat(box[a]) + parseFloat(box[b]);
    highlighted.style.width = `${source.clientWidth + borders("borderLeftWidth", "borderRightWidth")}px`;
    highlighted.style.height = `${source.clientHeight + borders("borderTopWidth", "borderBottomWidth")}px`;
    highlighted.scrollTop = source.scrollTop;
    highlighted.scrollLeft = source.scrollLeft;
  }

  source.addEventListener("scroll", align);
  new ResizeObserver(align).observe(source);

  let timer = null;
  function refresh() {
    paint();
    store("stitchwort.draft", source.value);
    clearTimeout(timer);
    timer = setTimeout(render, 250);
  }

  function selectView(name) {
    if (view === name) return;
    view = name;
    for (const t of tabs) t.setAttribute("aria-selected", String(t.dataset.view === name));
    store("stitchwort.view", view);
    render();
  }

  for (const tab of tabs) tab.addEventListener("click", () => selectView(tab.dataset.view));
  picker.addEventListener("change", () => loadExample(picker.value));
  source.addEventListener("input", refresh);
  source.addEventListener("keydown", (e) => {
    if (e.key === "Tab" && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      // As typing does, so that undo takes it back, and its `input` event
      // repaints. Changing the value from script (setRangeText) would clear
      // the textarea's undo history instead; that's the fallback, for a
      // browser without insertText.
      if (!document.execCommand("insertText", false, "  ")) {
        source.setRangeText("  ", source.selectionStart, source.selectionEnd, "end");
        refresh();
      }
    }
  });
  // Ctrl+Enter (⌘+Enter on a Mac) runs, from the source or the input.
  for (const box of [source, runInput]) {
    box.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !runButton.disabled) {
        e.preventDefault();
        runMain();
      }
    });
  }

  // Read the draft and input before loading the example, which overwrites them.
  const draft = stored("stitchwort.draft");
  const input = stored("stitchwort.input");
  loadExample(stored("stitchwort.example") || "ex-lists");
  if (draft) { source.value = draft; refresh(); }
  if (input !== null) { runInput.value = input; store("stitchwort.input", input); }
  const savedView = stored("stitchwort.view");
  if (savedView && tabs.some((t) => t.dataset.view === savedView)) selectView(savedView);
</script>
