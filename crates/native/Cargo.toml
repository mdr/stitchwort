[package]
name = "stitchwort-native"
description = "Native code through Cranelift (docs/proposals/native-compilation.md): the N0 spike and stage N1"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
stitchwort-core.workspace = true
stitchwort-rt.workspace = true
# Pinned to one release, the newest at least two weeks old when added
# (0.136.2, 2 October 2026); the five crates are released in lockstep.
cranelift-codegen = "=0.136.2"
cranelift-frontend = "=0.136.2"
cranelift-jit = "=0.136.2"
cranelift-module = "=0.136.2"
cranelift-native = "=0.136.2"
# Object files for standalone executables (`aot`, standalone-executables.md
# S5), in lockstep with the rest.
cranelift-object = "=0.136.2"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# `MAP_JIT` and `pthread_jit_write_protect_np` (src/map_jit.rs).
libc = "0.2.190"

[dev-dependencies]
# mimalloc in the unit-test and integration-test binaries (docs/testing.md, "Allocator").
stitchwort-test-alloc.workspace = true
# The one feature set of every dev and test build (docs/testing.md, "Features").
stitchwort-dev-features.workspace = true
# The N1 tests check and lower programs from source, and compare allocation
# traces.
stitchwort-driver.workspace = true
# `tests/it/differential.rs`, shared with `stitchwort-rt`'s tests.
stitchwort-elab.workspace = true
stitchwort-rt.workspace = true
# N4 parses the effect examples' `-- run:` lines.
stitchwort-syntax.workspace = true
# The frame-size test compiles for x86-64 and arm64 whatever the host
# (tests/it/frames.rs).
cranelift-codegen = { version = "=0.136.2", features = ["x86", "arm64"] }
# Reading back the object `aot::compile_object` writes (tests/it/object.rs).
object = { workspace = true, features = ["read_core", "macho", "elf"] }

# The far-data test (n1.rs, SW-3139) maps memory itself, on every Unix.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.190"

[lints]
workspace = true
