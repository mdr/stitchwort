[package]
name = "stitchwort-driver"
description = "The compiler pipeline (sessions, tests, caching) and error rendering, shared by the CLI and the browser playground"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
stitchwort-syntax.workspace = true
stitchwort-core.workspace = true
stitchwort-elab.workspace = true
stitchwort-js.workspace = true
stitchwort-rt.workspace = true
stitchwort-host.workspace = true
ariadne.workspace = true
blake3.workspace = true
serde.workspace = true
serde-saphyr.workspace = true

[build-dependencies]
blake3.workspace = true

[features]
# `Session::with_prelude_falling_back`, for tests (see `stitchwort-elab`).
test-bypass = ["stitchwort-elab/test-bypass"]

[dev-dependencies]
insta.workspace = true
# An independent implementation of integer division, for `tests/int.rs`.
num-bigint.workspace = true
num-traits.workspace = true
# The one feature set of every dev and test build (docs/testing.md, "Features").
stitchwort-dev-features.workspace = true
# `cargo metadata`'s output, for the test of the fingerprint's crates.
serde_json.workspace = true
# The formatter, for `tests/fmt_hashes.rs`.
stitchwort-fmt.workspace = true
# The runtime model of `Partial`, which the runner is compared with.
stitchwort-partial-model = { path = "../partial-model" }
# The CLI's allocator, for `tests/resources.rs` (SW-921).
mimalloc.workspace = true

[lints]
workspace = true
