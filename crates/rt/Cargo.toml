[package]
name = "stitchwort-rt"
description = "The fast runtime: erasure and natives shared with the JS backend, and the erased IR programs are lowered to"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
stitchwort-syntax.workspace = true
stitchwort-core.workspace = true
num-bigint.workspace = true
num-integer.workspace = true
smallvec.workspace = true
# The thread's real stack bounds, for a native run (`native_abi`).
libc.workspace = true

[build-dependencies]
# `src/fingerprint.rs`'s hash, shared with the driver's build script.
blake3.workspace = true

[features]
# The bring-up allocation trace (`alloc_trace`); off in release builds.
alloc-trace = []

[dev-dependencies]
# mimalloc in the unit-test and integration-test binaries (docs/testing.md, "Allocator").
stitchwort-test-alloc.workspace = true
# The one feature set of every dev and test build (docs/testing.md, "Features").
stitchwort-dev-features.workspace = true
stitchwort-driver.workspace = true
stitchwort-elab.workspace = true
insta.workspace = true

[lints]
workspace = true
