[package]
name = "stitchwort-core"
description = "Core terms, evaluator and the trusted kernel"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
stitchwort-syntax.workspace = true
blake3.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
smallvec.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
# A clock in the browser, where `std::time::Instant::now` panics: proof
# search's deadlines (`Budget::set_deadline`) run there for the language
# server in the playground's worker (SW-1375 trial).
web-time = "1"

[features]
# The reference evaluator, for differential tests (src/reference.rs).
reference = []
# Panics when a top-level operation's stack limit doesn't fit the thread it
# runs on (`Budget::start`): on in the tests.
stack-check = ["stitchwort-syntax/stack-check"]
# Functions that write a declaration's body or state without admission, for
# tests that build deliberately broken states. Only the dev feature set
# (`stitchwort-dev-features`) enables it. The flake's `stitchwort-bin` builds
# `-p` the crates it ships, so it has none of these (`dev/features-check`).
test-bypass = []

[dev-dependencies]
# mimalloc in the unit-test and integration-test binaries (docs/testing.md, "Allocator").
stitchwort-test-alloc.workspace = true
# The one feature set of every dev and test build (docs/testing.md, "Features").
stitchwort-dev-features.workspace = true

[lints]
workspace = true
