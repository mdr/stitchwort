[package]
name = "stitchwort-web"
description = "The browser playground: the compiler, compiled to WebAssembly"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stitchwort-syntax.workspace = true
stitchwort-core.workspace = true
stitchwort-js.workspace = true
stitchwort-rt.workspace = true
stitchwort-driver.workspace = true
stitchwort-fmt.workspace = true
# The language server, run in the worker (SW-1375 trial): crates/cli/src/lsp.rs.
stitchwort-elab.workspace = true
crossbeam-channel.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true
# Must match the wasm-bindgen CLI in the Nix dev shell exactly.
wasm-bindgen = "=0.2.129"

[dev-dependencies]
# The one feature set of every dev and test build (docs/testing.md, "Features").
stitchwort-dev-features.workspace = true

[lints]
workspace = true
