[package]
name = "stitchwort-cli"
description = "The `stitchwort` command-line tool"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "stitchwort"
path = "src/main.rs"

[dependencies]
stitchwort-syntax.workspace = true
stitchwort-core.workspace = true
stitchwort-elab.workspace = true
stitchwort-js.workspace = true
stitchwort-driver.workspace = true
stitchwort-rt = { workspace = true, optional = true }
stitchwort-fmt.workspace = true
clap.workspace = true
rustyline.workspace = true
mimalloc.workspace = true
# The language server (`stitchwort lsp`, docs/proposals/language-server.md).
crossbeam-channel.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
# Keys mode on a terminal (docs/proposals/terminal-io.md §4.6).
nix.workspace = true
rustix.workspace = true

[features]
# `run --alloc-trace FILE`: the bring-up allocation trace of the fast
# runtime (`stitchwort_rt::alloc_trace`). Off in release builds.
alloc-trace = ["dep:stitchwort-rt", "stitchwort-rt/alloc-trace"]

[dev-dependencies]
insta.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# `run` in a pseudo-terminal (`tests/keys_mode.rs`): `openpty` is in `term`.
nix = { workspace = true, features = ["term", "signal"] }
rustix = { workspace = true, features = ["process"] }

[lints]
workspace = true
