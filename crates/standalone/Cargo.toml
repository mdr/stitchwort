[package]
name = "stitchwort-standalone"
description = "The runtime a standalone executable links: C `main`, the machine and the host (docs/proposals/standalone-executables.md)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# The static library is what `stitchwort build` links with the generated
# `program.o`. The rlib is for this crate's own tests, and lets the CLI's
# tests depend on the crate, which builds the static library for them.
crate-type = ["staticlib", "rlib"]

[features]
# A runtime library that counts native code's calls into it
# (`stitchwort_rt::call_counts`), for `dev/profile-native`.
call-counts = ["stitchwort-rt/call-counts"]
# A runtime library that counts the values a native run makes
# (`stitchwort_rt::value_census`).
value-census = ["stitchwort-rt/value-census"]

[dependencies]
stitchwort-core.workspace = true
stitchwort-rt.workspace = true
stitchwort-syntax.workspace = true
stitchwort-host.workspace = true
mimalloc.workspace = true
libmimalloc-sys = { version = "0.1.49", default-features = false }

[target.'cfg(unix)'.dependencies]
# Ignoring `SIGPIPE`, as Rust's own start-up does before a Rust `main`.
nix.workspace = true

[build-dependencies]
# Archives musl's start file for the static library (build.rs); already in
# the tree (mimalloc builds with it).
cc = "1.8.0"

[dev-dependencies]
# The one feature set of every dev and test build (docs/testing.md, "Features").
stitchwort-dev-features.workspace = true
# The tests of `aot` (src/aot/tests.rs) check and lower programs to check
# manifests against.
stitchwort-driver.workspace = true

[lints]
workspace = true
