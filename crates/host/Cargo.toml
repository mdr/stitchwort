version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
stitchwort-rt.workspace = true

[target.'cfg(unix)'.dependencies]
# Keys mode on a terminal (docs/proposals/terminal-io.md §4.6).
nix.workspace = true
