[package]
name = "stitchwort-syntax"
description = "Lexer, parser, surface AST, source spans and diagnostics"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
num-bigint.workspace = true

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[features]
# Checks that each top-level operation's stack limit fits the thread it runs
# on (`stack::thread_stack_low`, `Budget::start`): on in the tests, which
# enable it through the driver's dev-dependencies.
stack-check = ["dep:libc"]

[lints]
workspace = true
