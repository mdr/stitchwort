[package]
name = "stitchwort-bench"
description = "Recorded benchmarks: counts work and allocations, times runs, and compares them with bench/baseline.toml"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "stitchwort-bench"
path = "src/main.rs"

[dependencies]
stitchwort-syntax.workspace = true
stitchwort-driver.workspace = true
blake3.workspace = true
clap.workspace = true

[dev-dependencies]
# Panics when a session runs on a thread smaller than its limits assume
# (docs/testing.md, "Stack").
stitchwort-core = { workspace = true, features = ["stack-check"] }

[lints]
workspace = true
