[package]
name = "stitchwort-bench"
description = "Recorded benchmarks: counts work and allocations, times runs, and compares them with bench/baseline.toml"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "stitchwort-bench"
path = "src/main.rs"

[dependencies]
stitchwort-syntax.workspace = true
stitchwort-driver.workspace = true
blake3.workspace = true
clap.workspace = true
# The one feature set of every dev and test build (docs/testing.md, "Features"),
# also for `task bench`, which runs the binary.
stitchwort-dev-features.workspace = true

[dev-dependencies]
# check_work.rs reads core terms.
stitchwort-core.workspace = true

[lints]
workspace = true
