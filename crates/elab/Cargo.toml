[package]
name = "stitchwort-elab"
description = "Elaboration from surface syntax to core terms"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
stitchwort-syntax.workspace = true
stitchwort-core.workspace = true
num-bigint.workspace = true
blake3.workspace = true
smallvec.workspace = true

[features]
# `Options::stale_pins_fall_back`, for tests; on in dev and test builds only
# (through `stitchwort-dev-features`).
test-bypass = []

[dev-dependencies]
# mimalloc in the unit-test and integration-test binaries (docs/testing.md, "Allocator").
stitchwort-test-alloc.workspace = true
# The one feature set of every dev and test build (docs/testing.md, "Features").
stitchwort-dev-features.workspace = true

[lints]
workspace = true
