# The rules for dev/test-affected (SW-1752): which tests a changed file can
# affect. Read by `task test:affected`; the design is in docs/testing.md, "The
# affected-test selection". Extend this table, not the script.
#
# A rule applies to a changed file when one of its `paths` globs matches (`*`
# stays inside a folder, `**` crosses folders). A rule with `fallback = true`
# applies to a file only when no other rule matched it, so a narrow rule
# (`omega*.rs`) takes its file out of the broad one (`crates/elab/**`). A file
# no rule matches falls back to the tests of its crate (and the lane areas of
# the crates that depend on it, from `cargo metadata`), unless it is
# documentation or board data (`ignore` below).
#
# A rule with `extra = true` adds its tests to whatever else matched the file,
# and does not count as covering it: the fallback rules and the crate fallback
# still apply.
#
# `rank` says how relevant a rule's tests are. When the estimate is over the
# budget the rules are cut from the highest rank down:
#   1  the tests of the thing that changed
#   2  what reads it: sweeps, other areas, formatting
#   3  the crate-graph fallback for dependents, and one slow check of wide reach
# The `fixed-core` rule (rank 0) is never cut.
#
# A rule may have `commands` instead of (or besides) `select`: shell commands
# run from the repository root, for the checks that are not nextest tests.
# `seconds` is the estimate for each command and counts towards the budget.
# A command with `{path}` or `{test}` runs once per changed file ({test} is the
# `_test.py` beside it, and the file is skipped if there is none); `shebang`, a
# regex for the first line, limits the files. `manual` lists checks to run by
# hand (too slow or heavy for here); they are shown, never run. `task
# test:affected` runs commands of up to 10 s before nextest, the rest after.
#
# `select` clauses are ANDed inside a clause and ORed between clauses:
#   package   short crate name (`elab` for stitchwort-elab)
#   binary    test binary (`library`); the crate's own unit tests are
#             `lib = true`
#   test      regex searched in the test name (`^omega`, a nextest `test(/…/)`)
#   not_test  regex of names to leave out
#   profile   every test of a nextest profile (`lane-std`); the profile's
#             filterset is pasted in, and its tests are read from the inventory
# `examples = ["name"]` adds those names to EXAMPLES and selects the example
# sweeps (cli `running` `examples::`, driver `library` `hash_stability::`), which then cover only the
# named examples. `sample = true` is a rule that wants the sweeps' ordinary
# sample, so a diff that also names examples keeps EXAMPLES unset.

ignore = ["docs/**", "board/tickets.json", "board/archive/**", "**/*.md", "web/**/*.html", "LICENSE", ".gitignore", ".github/**", ".claude/**", "dev/*.md", ".gitattributes", "dev/selector-log.tsv"]

# The guide's chapters and examples are tests (docs/guide, docs/tutorial), so
# they are the exception to `ignore`.
unignore = ["docs/guide/**", "docs/tutorial/**"]

# The crate each lane area is named for, used for the fallback's dependents.
[lane_of]
syntax = "lane-syntax"
core = "lane-core"
elab = "lane-elab"
rt = "lane-rt"
js = "lane-js"
native = "lane-native"
host = "lane-rt"
fmt = "lane-fmt"
lsp = "lane-lsp"
cli = "lane-cli"
web = "lane-web"
bench = "lane-bench"
standalone = "lane-cli"

[[rule]]
id = "fixed-core"
rank = 0
always = true
why = "the kernel, the parser and one AoC day end to end: an unsound result or a broken pipeline shows here"
select = [
  { package = "core" },
  { package = "syntax" },
  { package = "cli", binary = "running", test = "^aoc_answers::year2024_day04$" },
]

# ---------------------------------------------------------------- library

[[rule]]
id = "std"
rank = 1
paths = ["crates/elab/src/std/**", "std/**"]
sample = true
why = "a library file changes its own tests, the prelude and example hashes, and the formatting of .sw sources"
select = [
  { profile = "lane-std" },
  { package = "driver", binary = "library", test = "^hash_stability::(prelude|examples)$" },
  { package = "driver", binary = "library", test = "^pinned_hashes::" },
  { package = "driver", binary = "library", test = "^std_library::the_standard_library_passes_its_own_tests$" },
]

[[rule]]
id = "std-generated-js"
rank = 1
paths = ["crates/elab/src/std/**", "std/**"]
why = "the JS and .d.ts snapshots embed the generated code of every std function an example uses, so a std edit makes them stale (SW-2323 did)"
select = [
  { package = "cli", binary = "extraction", test = "^extract::generated_code_is_stable$" },
]
note = "std .sw changes also break aoc/ and games/rogue proofs that use them, which no test here covers: also run task aoc:check"

[[rule]]
id = "std-sweeps"
rank = 2
paths = ["crates/elab/src/std/**", "std/**"]
sample = true
why = "the accepted and rejected examples use the library"
select = [
  { package = "cli", binary = "running", test = "^examples::(accepted|rejected)_examples_" },
  { package = "cli", binary = "tools", test = "^fmt::the_repository_sources_are_formatted$" },
]

[[rule]]
id = "std-core"
rank = 1
paths = ["crates/elab/src/std/core/**", "crates/elab/src/std/order.txt", "crates/elab/src/std/*.txt"]
why = "core files are what natives and printed positions are bound to"
select = [
  { test = "bound_to_the_(prelude|library)" },
  { package = "driver", binary = "projects", test = "^navigation::references_of_a_project$" },
]

[[rule]]
id = "sw-format"
rank = 2
paths = ["**/*.sw"]
why = "every .sw file must be formatted"
select = [
  { package = "cli", binary = "tools", test = "^fmt::the_repository_sources_are_formatted$" },
]

# ---------------------------------------------------------------- elaborator

[[rule]]
id = "elab-omega"
rank = 1
paths = ["crates/elab/src/omega*.rs"]
examples = ["omega", "auto-omega"]
why = "the omega procedure"
select = [
  { package = "elab", test = "omega" },
  { package = "driver", binary = "library", test = "^search_at::.*omega" },
  { package = "driver", binary = "library", test = "^std_library::.*omega" },
  { package = "driver", binary = "elaboration", test = "^number_patterns::" },
]

[[rule]]
id = "elab-matching"
rank = 1
paths = ["crates/elab/src/matching*", "crates/elab/src/matching/**", "crates/elab/src/patlet.rs", "crates/elab/src/missing.rs", "crates/elab/src/redundant.rs", "crates/elab/src/cases.rs"]
examples = ["match", "pattern", "redundant"]
why = "match elaboration and its coverage and redundancy checks"
select = [
  { package = "elab", lib = true },
  { package = "driver", binary = "elaboration", test = "^number_patterns::" },
  { package = "driver", binary = "elaboration", test = "^int_patterns::" },
  { package = "cli", binary = "tools", test = "^redundant_arms::" },
]

[[rule]]
id = "elab-rewrite"
rank = 1
paths = ["crates/elab/src/rewrite*", "crates/elab/src/rewrite/**", "crates/elab/src/calc.rs", "crates/elab/src/congruence.rs", "crates/elab/src/ring.rs"]
examples = ["rewrite", "calc"]
why = "rewriting and calculation proofs"
select = [
  { package = "elab", lib = true },
  { package = "driver", binary = "proofs", test = "^rewrite::" },
  { package = "driver", binary = "proofs", test = "^update_lemmas::" },
]

[[rule]]
id = "elab-equations"
rank = 1
paths = ["crates/elab/src/equation*", "crates/elab/src/equations/**", "crates/elab/src/induct*", "crates/elab/src/decreasing.rs", "crates/elab/src/derive*.rs"]
examples = ["equation", "induct", "derive"]
why = "function equations, induction and derived instances"
select = [
  { package = "elab", lib = true },
  { package = "driver", binary = "proofs", test = "^function_equations::" },
  { package = "driver", binary = "proofs", test = "^function_induct::" },
  { package = "cli", binary = "tools", test = "^doc_equations::" },
]

[[rule]]
id = "elab-search"
rank = 1
paths = ["crates/elab/src/search.rs", "crates/elab/src/nav.rs", "crates/elab/src/goals.rs"]
why = "the search and navigation over goals"
select = [
  { profile = "lane-search" },
  { package = "driver", binary = "projects", test = "^navigation::" },
]

# An open goal is a kernel assumption (SW-2805), so assume.rs, assumption.rs
# and goals.rs change what the goal tests, `at`, `search_at` and the audit see.
# elab-search's profile left these out and an over-budget cut dropped
# search_at, so a regression in goal handling slipped through (SW-2811).
[[rule]]
id = "open-goals"
extra = true
rank = 1
paths = ["crates/elab/src/assume.rs", "crates/core/src/assumption.rs", "crates/elab/src/goals.rs"]
why = "open goals become assumptions that the kernel checks users against: the goal, `at`, search_at and audit tests"
select = [
  { package = "cli", binary = "tools", test = "^(open_goals|audit)::" },
  { package = "core", binary = "it", test = "^assumptions::" },
  { package = "driver", binary = "elaboration", test = "^at::" },
  { package = "driver", binary = "library", test = "^search_at::" },
]
cheap_only = 5.0

[[rule]]
id = "open-goals-slow"
extra = true
rank = 2
paths = ["crates/elab/src/assume.rs", "crates/core/src/assumption.rs", "crates/elab/src/goals.rs"]
why = "the rest of search_at (10 to 14 s each), which a quick run can leave out"
select = [
  { package = "driver", binary = "library", test = "^search_at::" },
]
cheap_only = 30.0

[[rule]]
id = "elab-auto"
extra = true
rank = 1
paths = ["crates/elab/src/auto*.rs", "crates/elab/src/data_auto.rs", "crates/elab/src/membership.rs"]
why = "auto must prove membership in a long list in a chain of cheap steps"
select = [
  { package = "cli", binary = "tools", test = "^auto_membership_speed::" },
]

[[rule]]
id = "elab-general"
rank = 1
fallback = true
paths = ["crates/elab/**"]
why = "an elaborator change: its lane area and the example sweeps"
select = [
  { profile = "lane-elab" },
]

[[rule]]
id = "elab-general-sweeps"
rank = 2
fallback = true
paths = ["crates/elab/**"]
sample = true
why = "the elaborator decides every example's verdict and hashes"
select = [
  { package = "cli", binary = "running", test = "^examples::(accepted|rejected|soundness)_examples_" },
  { package = "driver", binary = "library", test = "^hash_stability::(prelude|examples)$" },
  { package = "driver", binary = "library", test = "^pinned_hashes::" },
  { package = "driver", binary = "elaboration", test = "^named_arguments::" },
]

# The front end's own feature tests live in the driver's and the CLI's test
# binaries (about 650 and 510 tests, 3700 s and 3500 s in all, mostly the
# whole-corpus ones). These rules take the quick tests of each, so a change to
# the parser, kernel, elaborator or driver runs something of the features no
# narrower rule names. Rank 2: they are cut first when the budget is short.
[[rule]]
id = "front-end-quick-driver"
extra = true
rank = 2
paths = ["crates/syntax/**", "crates/core/**", "crates/elab/**", "crates/driver/**"]
why = "the driver's feature tests under 3 s each: elaboration, patterns, records, interfaces, partial functions, ..."
cheap_only = 3.0
select = [
  { package = "driver" },
]

[[rule]]
id = "front-end-quick-cli"
extra = true
rank = 2
paths = ["crates/syntax/**", "crates/core/**", "crates/elab/**", "crates/driver/**", "crates/cli/**"]
why = "the command line's quick tests (under 3 s each) in the binaries no lane area reaches: project, scope, axioms, test failures, ..."
cheap_only = 3.0
select = [
  { package = "cli", lib = true },
  { package = "cli", binary = "tools", test = "^project::" },
  { package = "cli", binary = "tools", test = "^scope::" },
  { package = "cli", binary = "tools", test = "^axioms::" },
  { package = "cli", binary = "tools", test = "^receiver_first::" },
  { package = "cli", binary = "tools", test = "^redundant_arms::" },
  { package = "cli", binary = "tools", test = "^no_effect::" },
  { package = "cli", binary = "tools", test = "^lambda_shadow::" },
  { package = "cli", binary = "tools", test = "^indexed_families::" },
  { package = "cli", binary = "tools", test = "^doc_equations::" },
  { package = "cli", binary = "tools", test = "^test_failures::" },
  { package = "cli", binary = "tools", test = "^test_json::" },
  { package = "cli", binary = "server", test = "^caching::" },
  { package = "cli", binary = "server", test = "^navigation::" },
  { package = "cli", binary = "tools", test = "^std_dir::" },
  { package = "cli", binary = "tools", test = "^timings::" },
  { package = "cli", binary = "tools", test = "^auto_membership_speed::" },
  { package = "cli", binary = "tools", test = "^opcode_census::" },
  { package = "cli", binary = "tools", test = "^broken_pipe::" },
  { package = "cli", binary = "running", test = "^partial_handlers::" },
  { package = "cli", binary = "server", test = "^live_memory::" },
  { package = "cli", binary = "server", test = "^check_cache::" },
  { package = "cli", binary = "extraction", test = "^effect_differential::" },
]

[[rule]]
id = "guide-quotes"
extra = true
# 25 s warm alone (7 Nov 2026, SW-1778); rank 2 would be 20 s or less.
rank = 3
paths = ["crates/syntax/**", "crates/core/**", "crates/elab/**", "crates/driver/**", "crates/cli/**"]
why = "the guide quotes the compiler's output (error messages, printed terms) and checks it is unchanged"
select = [
  { package = "cli", binary = "tools", test = "^guide::the_guide_quotes_its_examples_and_the_compiler$" },
]

