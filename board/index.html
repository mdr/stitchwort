<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stitchwort board</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5f7; --panel: #e9ebef; --card: #ffffff; --text: #1d2330; --muted: #657084;
  --border: #d2d6de; --accent: #2f6fdb; --danger: #c2362b; --shadow: 0 1px 2px rgba(0,0,0,.12);
  --a-Opus: #7c4dcc; --a-Sonnet: #c46a14; --a-DeepSeek: #1f7ae0; --a-GLM: #12877a;
  --a-Matt: #2e8a3e; --a-Claude: #b0457a; --a-none: #7a8497;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171d; --panel: #1d222b; --card: #262c37; --text: #e6e9ef; --muted: #98a2b5;
    --border: #353d4b; --accent: #6b9cf2; --danger: #ef7468; --shadow: 0 1px 2px rgba(0,0,0,.5);
    --a-Opus: #a98af0; --a-Sonnet: #e8934a; --a-DeepSeek: #5aa2f5; --a-GLM: #3cc4b3;
    --a-Matt: #5cc16e; --a-Claude: #e07fb0; --a-none: #7f8aa0;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); }
h1 { font-size: 16px; margin: 0; }
.spacer { flex: 1; }
select, input, textarea, button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--danger); }
#summary { display: flex; flex-wrap: wrap; gap: 6px 10px; padding: 8px 16px; color: var(--muted); border-bottom: 1px solid var(--border); min-height: 38px; align-items: center; }
#summary .item { display: inline-flex; gap: 6px; align-items: center; }
#board { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; padding: 12px 16px; overflow-x: auto; align-items: start; }
.col { background: var(--panel); border-radius: 8px; padding: 8px; min-height: 120px; }
.col.over { outline: 2px dashed var(--accent); }
.col h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin: 2px 4px 8px; display: flex; gap: 6px; align-items: center; color: var(--muted); }
.col h2 .count { background: var(--card); border-radius: 10px; padding: 0 7px; font-weight: normal; }
.col h2 button { margin-left: auto; padding: 0 6px; font-size: 12px; }
.card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--a-none); border-radius: 6px; padding: 7px 9px; margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow); }
.card.dragging { opacity: .4; }
.card .top { display: flex; gap: 6px; align-items: baseline; }
.card .id { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.card .title { font-weight: 600; overflow-wrap: anywhere; }
.card .meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; align-items: center; }
.card .where { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; margin-top: 4px; font-family: ui-monospace, Menlo, monospace; }
.chip { display: inline-block; border-radius: 10px; padding: 0 8px; font-size: 12px; line-height: 18px; border: 1px solid var(--border); color: var(--muted); }
.chip.agent { color: #fff; border: 0; background: var(--a-none); }
.card[data-agent="Opus"], .chip[data-agent="Opus"] { --a-none: var(--a-Opus); }
.card[data-agent="Sonnet"], .chip[data-agent="Sonnet"] { --a-none: var(--a-Sonnet); }
.card[data-agent="DeepSeek"], .chip[data-agent="DeepSeek"] { --a-none: var(--a-DeepSeek); }
.card[data-agent="GLM"], .chip[data-agent="GLM"] { --a-none: var(--a-GLM); }
.card[data-agent="Matt"], .chip[data-agent="Matt"] { --a-none: var(--a-Matt); }
.card[data-agent="Claude"], .chip[data-agent="Claude"] { --a-none: var(--a-Claude); }
.more { width: 100%; color: var(--muted); }
dialog { border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); padding: 0; width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(0,0,0,.45); }
form.editor { display: grid; gap: 10px; padding: 16px; }
form.editor label { display: grid; gap: 3px; color: var(--muted); font-size: 12px; }
form.editor input, form.editor select, form.editor textarea { width: 100%; color: var(--text); }
form.editor textarea { min-height: 220px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.buttons { display: flex; gap: 8px; align-items: center; }
.rendered { border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; max-height: 260px; overflow: auto; color: var(--text); }
.rendered p { margin: .4em 0; } .rendered h4, .rendered h5, .rendered h3 { margin: .6em 0 .2em; }
.rendered ul { margin: .3em 0; padding-left: 1.4em; } .rendered pre { background: var(--panel); padding: 6px; border-radius: 4px; overflow: auto; }
.rendered code { background: var(--panel); padding: 0 3px; border-radius: 3px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
.rendered pre code { background: none; padding: 0; }
.confirm { color: var(--danger); display: none; align-items: center; gap: 8px; }
.confirm.show { display: inline-flex; }
.tabs { display: flex; gap: 6px; }
.tabs button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
#toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: var(--danger); color: #fff; padding: 8px 14px; border-radius: 6px; display: none; }
#conn { font-size: 12px; color: var(--muted); }
@media (max-width: 760px) { #board { grid-template-columns: repeat(5, 260px); } .row2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Stitchwort board</h1>
  <button class="primary" id="add">+ Add ticket</button>
  <label>Agent <select id="fAgent"></select></label>
  <label>Label <select id="fLabel"></select></label>
  <input id="fText" type="search" placeholder="Search title and text" size="22">
  <span class="spacer"></span>
  <span id="conn">connecting...</span>
</header>
<div id="summary"></div>
<main id="board"></main>

<dialog id="dlg">
  <form class="editor" id="form" method="dialog">
    <div class="buttons"><strong id="dlgTitle"></strong><span class="spacer"></span><button type="button" id="close">Close</button></div>
    <label>Title <input id="eTitle" required></label>
    <div class="row2">
      <label>Status <select id="eStatus"></select></label>
      <label>Agent <select id="eAgent"></select></label>
    </div>
    <label>Where (worktree, branch or clone) <input id="eWhere"></label>
    <div class="row2">
      <label>Labels (comma separated) <input id="eLabels"></label>
      <label>Commits (comma separated) <input id="eCommits"></label>
    </div>
    <div class="tabs"><button type="button" id="tEdit" aria-pressed="true">Edit</button><button type="button" id="tView" aria-pressed="false">Preview</button></div>
    <textarea id="eBody" placeholder="Body (simple markdown)"></textarea>
    <div class="rendered" id="eView" hidden></div>
    <div class="buttons">
      <button class="primary" id="save" type="submit">Save</button>
      <button type="button" id="del" class="danger">Delete</button>
      <span class="confirm" id="confirm">Delete this ticket for good? <button type="button" class="danger" id="delYes">Yes, delete</button> <button type="button" id="delNo">Cancel</button></span>
      <span class="spacer"></span>
      <small id="eInfo" style="color:var(--muted)"></small>
    </div>
  </form>
</dialog>
<div id="toast"></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const COLS = [['backlog', 'Backlog'], ['next', 'Next'], ['doing', 'In progress'], ['review', 'Review'], ['done', 'Done']];
const DONE_LIMIT = 12;
let state = { tickets: [], agents: [], statuses: [] };
let showAllDone = false;
let editing = null; // ticket id, or 'new'
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (_) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
};

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid);
  return e;
}

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.style.display = 'none'; }, 4000);
}

async function api(method, url, body) {
  const res = await fetch(url, { method, headers: method === 'GET' ? {} : { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function refresh() {
  try {
    state = await api('GET', '/api/board');
    render();
    $('conn').textContent = 'live';
  } catch (e) { $('conn').textContent = 'offline'; }
}

function filtered() {
  const a = $('fAgent').value, l = $('fLabel').value, q = $('fText').value.trim().toLowerCase();
  return state.tickets.filter((t) =>
    (!a || (a === '(none)' ? !t.agent : t.agent === a)) && (!l || t.labels.includes(l)) &&
    (!q || (t.title + ' ' + t.body + ' SW-' + t.id).toLowerCase().includes(q)));
}

function fillFilters() {
  const keepA = $('fAgent').value, keepL = $('fLabel').value;
  const labels = [...new Set(state.tickets.flatMap((t) => t.labels))].sort();
  $('fAgent').replaceChildren(el('option', { value: '', text: 'all' }), el('option', { value: '(none)', text: '(unassigned)' }),
    ...state.agents.map((a) => el('option', { value: a, text: a })));
  $('fLabel').replaceChildren(el('option', { value: '', text: 'all' }), ...labels.map((l) => el('option', { value: l, text: l })));
  $('fAgent').value = keepA; $('fLabel').value = keepL;
}

function card(t) {
  const c = el('div', { class: 'card', draggable: 'true', 'data-agent': t.agent, tabindex: '0' },
    el('div', { class: 'top' }, el('span', { class: 'id', text: 'SW-' + t.id }), el('span', { class: 'title', text: t.title })),
    (t.agent || t.labels.length) ? el('div', { class: 'meta' },
      t.agent ? el('span', { class: 'chip agent', 'data-agent': t.agent, text: t.agent }) : null,
      t.labels.map((l) => el('span', { class: 'chip', text: l }))) : null,
    t.where ? el('div', { class: 'where', text: t.where }) : null);
  c.addEventListener('click', () => openEditor(t.id));
  c.addEventListener('keydown', (e) => { if (e.key === 'Enter') openEditor(t.id); });
  c.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', String(t.id)); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); });
  c.addEventListener('dragend', () => c.classList.remove('dragging'));
  return c;
}

function render() {
  fillFilters();
  const ts = filtered();
  // Summary of work in progress, by agent (unfiltered).
  const doing = state.tickets.filter((t) => t.status === 'doing' || t.status === 'review');
  const by = new Map();
  for (const t of doing) { const k = t.agent || '(unassigned)'; by.set(k, (by.get(k) || []).concat(t)); }
  $('summary').replaceChildren(el('strong', { text: 'Active:' }),
    ...(by.size ? [...by].map(([k, v]) => el('span', { class: 'item' },
      el('span', { class: 'chip agent', 'data-agent': k, text: k }),
      v.map((t) => el('span', { text: 'SW-' + t.id + (t.status === 'review' ? ' (review)' : '') })))) : [el('span', { text: 'nothing in progress or review' })]));
  const board = $('board');
  board.replaceChildren(...COLS.map(([status, label]) => {
    let list = ts.filter((t) => t.status === status);
    if (status === 'done') list.sort((a, b) => b.updated.localeCompare(a.updated) || b.id - a.id);
    const total = list.length;
    if (status === 'done' && !showAllDone) list = list.slice(0, DONE_LIMIT);
    const col = el('section', { class: 'col', 'data-status': status },
      el('h2', {}, label, el('span', { class: 'count', text: String(total) }),
        status === 'done' && total > DONE_LIMIT ? el('button', { type: 'button', text: showAllDone ? 'Recent only' : 'Show all', onclick: () => { showAllDone = !showAllDone; render(); } }) : null,
        status !== 'done' ? el('button', { type: 'button', title: 'Add to ' + label, text: '+', onclick: () => openEditor('new', status) }) : null),
      ...list.map(card));
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', async (e) => {
      e.preventDefault(); col.classList.remove('over');
      const id = Number(e.dataTransfer.getData('text/plain'));
      const t = state.tickets.find((x) => x.id === id);
      if (!t || t.status === status) return;
      t.status = status; render(); // optimistic; the file change event confirms
      try { await api('PATCH', '/api/tickets/' + id, { status }); } catch (err) { toast(err.message); refresh(); }
    });
    return col;
  }));
}

// ---- simple markdown, built with DOM nodes (never innerHTML) ----
function inline(text, parent) {
  const re = /(`[^`]+`|\*\*[^*]+\*\*|\[[^\]]+\]\(https?:\/\/[^)\s]+\)|https?:\/\/[^\s)]+)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) parent.append(text.slice(last, m.index));
    const s = m[0];
    if (s[0] === '`') parent.append(el('code', { text: s.slice(1, -1) }));
    else if (s.startsWith('**')) parent.append(el('strong', { text: s.slice(2, -2) }));
    else if (s[0] === '[') { const k = s.indexOf(']('); parent.append(el('a', { href: s.slice(k + 2, -1), target: '_blank', rel: 'noopener', text: s.slice(1, k) })); }
    else parent.append(el('a', { href: s, target: '_blank', rel: 'noopener', text: s }));
    last = m.index + s.length;
  }
  if (last < text.length) parent.append(text.slice(last));
}
function markdown(src) {
  const out = document.createDocumentFragment();
  const lines = src.split('\n');
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.startsWith('```')) {
      const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith('```')) buf.push(lines[i++]);
      i++; out.append(el('pre', {}, el('code', { text: buf.join('\n') })));
    } else if (/^#{1,6}\s/.test(line)) {
      const h = el('h4'); inline(line.replace(/^#+\s*/, ''), h); out.append(h); i++;
    } else if (/^\s*[-*]\s/.test(line)) {
      const ul = el('ul');
      while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) {
        const li = el('li'); inline(lines[i].replace(/^\s*[-*]\s/, ''), li); i++;
        while (i < lines.length && /^\s+\S/.test(lines[i]) && !/^\s*[-*]\s/.test(lines[i])) { li.append(' '); inline(lines[i++].trim(), li); }
        ul.append(li);
      }
      out.append(ul);
    } else if (!line.trim()) { i++; }
    else {
      const p = el('p'); const buf = [];
      while (i < lines.length && lines[i].trim() && !lines[i].startsWith('```') && !/^#{1,6}\s/.test(lines[i]) && !/^\s*[-*]\s/.test(lines[i])) buf.push(lines[i++]);
      inline(buf.join(' '), p); out.append(p);
    }
  }
  return out;
}

// ---- editor ----
const splitList = (s) => s.split(',').map((x) => x.trim()).filter(Boolean);
function showTab(view) {
  $('eBody').hidden = view; $('eView').hidden = !view;
  $('tEdit').setAttribute('aria-pressed', String(!view)); $('tView').setAttribute('aria-pressed', String(view));
  if (view) $('eView').replaceChildren(markdown($('eBody').value));
}
function openEditor(id, status) {
  editing = id;
  const t = id === 'new' ? { title: '', status: status || 'backlog', agent: '', where: '', labels: [], commits: [], body: '', created: '', updated: '' } : state.tickets.find((x) => x.id === id);
  if (!t) return;
  $('dlgTitle').textContent = id === 'new' ? 'New ticket' : 'SW-' + t.id;
  $('eStatus').replaceChildren(...COLS.map(([s, l]) => el('option', { value: s, text: l })));
  $('eAgent').replaceChildren(el('option', { value: '', text: '(unassigned)' }), ...state.agents.map((a) => el('option', { value: a, text: a })));
  $('eTitle').value = t.title; $('eStatus').value = t.status; $('eAgent').value = t.agent; $('eWhere').value = t.where;
  $('eLabels').value = t.labels.join(', '); $('eCommits').value = t.commits.join(', '); $('eBody').value = t.body;
  $('eInfo').textContent = t.created ? `created ${t.created}, updated ${t.updated}` : '';
  $('del').style.display = id === 'new' ? 'none' : ''; $('confirm').classList.remove('show');
  showTab(false);
  if (!$('dlg').open) $('dlg').showModal();
  $('eTitle').focus();
}
$('add').addEventListener('click', () => openEditor('new'));
$('close').addEventListener('click', () => $('dlg').close());
$('tEdit').addEventListener('click', () => showTab(false));
$('tView').addEventListener('click', () => showTab(true));
$('del').addEventListener('click', () => $('confirm').classList.add('show'));
$('delNo').addEventListener('click', () => $('confirm').classList.remove('show'));
$('delYes').addEventListener('click', async () => {
  try { await api('DELETE', '/api/tickets/' + editing); $('dlg').close(); refresh(); } catch (e) { toast(e.message); }
});
$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fields = { title: $('eTitle').value, status: $('eStatus').value, agent: $('eAgent').value, where: $('eWhere').value,
    labels: splitList($('eLabels').value), commits: splitList($('eCommits').value), body: $('eBody').value };
  try {
    if (editing === 'new') await api('POST', '/api/tickets', fields);
    else {
      // Send only what changed, so edits made elsewhere to other fields survive.
      const old = state.tickets.find((x) => x.id === editing) || {};
      const diff = Object.fromEntries(Object.entries(fields).filter(([k, v]) => JSON.stringify(v) !== JSON.stringify(old[k])));
      if (Object.keys(diff).length) await api('PATCH', '/api/tickets/' + editing, diff);
    }
    $('dlg').close(); refresh();
  } catch (err) { toast(err.message); }
});
for (const id of ['fAgent', 'fLabel']) $(id).addEventListener('change', () => { store.set(id, $(id).value); render(); });
$('fText').addEventListener('input', render);

// ---- live updates: Server-Sent Events, with polling as a fallback ----
function connect() {
  const es = new EventSource('/api/events');
  es.addEventListener('changed', refresh);
  es.onopen = () => { $('conn').textContent = 'live'; refresh(); };
  es.onerror = () => { $('conn').textContent = 'reconnecting...'; };
}
setInterval(() => { if (document.visibilityState === 'visible' && !$('dlg').open) refresh(); }, 5000);
refresh().then(() => {
  for (const id of ['fAgent', 'fLabel']) { const v = store.get(id); if ([...$(id).options].some((o) => o.value === v)) $(id).value = v; }
  render(); connect();
});
</script>
</body>
</html>
