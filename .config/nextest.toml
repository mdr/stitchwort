# cargo-nextest settings: the test tiers (docs/testing.md, "Tiers").
#
# Each tier is a profile here, which says which tests run (its
# `default-filter`), and the environment variable STITCHWORT_TIER, which says
# how much of a corpus each sweep covers (`stitchwort_driver::driver::
# tier_sample`) and whether all-only tests run (`all_tier`). The tasks in
# Taskfile.yml set both; by hand:
#
#   cargo nextest run --release --workspace --profile quick
#
# Nextest puts the profile in each test's environment as NEXTEST_PROFILE, and
# `tier()` falls back to it when STITCHWORT_TIER is unset: the profile names
# match the tiers (`all`, `quick`, `broad`, and `lane-AREA` for `lane`), and
# `default` means `broad`. So a profile alone says which tier it is, and
# `--profile all` runs the all-tier tests without the variable; a set
# STITCHWORT_TIER still wins when both are given.
#
#   lane-AREA  under 10 s: a handful of fast tests for one area, while working
#   quick      under 90 s on a 10-core M1 Pro: a wide smoke test, the
#              verifier's budget and Overmind's rolling check
#   broad      long: the quick tier plus sweeps on a fixed sample; what
#              `nix flake check` runs
#   all        every test, every sweep over the whole corpus; only when Matt
#              asks
#
# A filter given on the command line is intersected with the profile's
# (`task test:quick -- -E 'package(stitchwort-core)'`); `--ignore-default-filter`
# drops it.
#
# Nextest runs every test in its own process. Per-process state (statics,
# thread-locals, allocation counters, pid-named temp dirs) is therefore never
# shared between tests; state shared through the file system is, so a test
# group below serialises the tests that need it.

[profile.default]
# The lanes (and `task test:one`): mostly tests of under a second, where
# starting a process per test is much of the cost, so one per core.
test-threads = "num-cpus"
fail-fast = false
slow-timeout = { period = "60s" }

[profile.broad]
# Memory, more than cores, is the limit. The corpus sweeps, which run pools of
# their own (`par_map`), go one at a time (the `corpus-sweeps` group below);
# 8 bounds the rest, some of which hold a whole session each. The tasks run
# under dev/memguard's cap as well (docs/testing.md, "Memory").
test-threads = 8
fail-fast = false
slow-timeout = { period = "60s" }
default-filter = "all()"

# Every test's time, for cutting the tier when it grows past its budget:
# target/nextest/broad/junit.xml.
[profile.broad.junit]
path = "junit.xml"

[profile.all]
test-threads = 6
fail-fast = false
slow-timeout = { period = "120s" }
default-filter = "all()"

[profile.all.junit]
path = "junit.xml"

# The quick tier: the lane areas together but for `lane-goals`, plus every
# accepted, rejected and soundness example on the quick sample (a quarter), a
# quarter of the examples' and projects' hash snapshots, 14 of the AoC days'
# answers (spread across the years, and every day in `lane-aoc`), and every
# extraction example's generated JS and `.d.ts` against their snapshots
# (`generated_code_is_stable`, about 4 s; `tsc` on them is in the broad tier), and the
# driver navigation snapshot that prints the prelude's line numbers. The
# `goal_index` tests are in `lane-goals` and the broad tier, not here (nor the
# web crate's).
#
# The default-filter below is generated from the lane profiles: edit them (or
# `EXTRAS` and `NOT_IN_QUICK` in `dev/nextest-quick`), then run
# `dev/nextest-quick`. `python3 dev/test-affected_test.py` fails when it is stale.
[profile.quick]
test-threads = "num-cpus"
fail-fast = false
slow-timeout = { period = "30s" }
default-filter = """
(package(stitchwort-syntax))
| ((package(stitchwort-core) & (kind(lib) | (binary(it) & test(/^kernel::/)) | (binary(it) & test(/^hash::/)) | (binary(it) & test(/^admission::/)) | (binary(it) & test(/^opaque::/)) | (binary(it) & test(/^trusted::/)) | (binary(it) & test(/^universe_levels::/)) | (binary(it) & test(/^kernel_bugs_2026::/)))) | (package(stitchwort-driver) & ((binary(proofs) & test(/^nested_oracle::/)) | (binary(elaboration) & test(/^division::/)))))
| ((package(stitchwort-elab) & !test(/^omega_search::tests::(replay_refuses_a_missing_case|integer_model|needs_nonnegativity|not_equal_splits|disconnected)$/)) | (package(stitchwort-driver) & binary(proofs) & test(=conv_shortcut::a_solved_unknown_is_seen_through_by_the_identity_shortcut)) | (package(stitchwort-driver) & ((binary(proofs) & test(/^function_equations::/)) | (binary(proofs) & test(/^function_induct::/)))))
| ((package(stitchwort-driver) & binary(elaboration) & test(/^ability_errors::/)) | (package(stitchwort-driver) & binary(elaboration) & test(/^empty_row_kernel::/)) | (package(stitchwort-rt) & binary(it) & test(/^effect_runtime::(state_handlers_run_as_a_loop_where_they_fit|io_operations_cross_translations_on_their_way_to_the_runner|closed_signature_maps_are_constants|bind_of_done_is_a_direct_call)$/)) | (package(stitchwort-cli) & binary(running) & test(/^effect_runtime::(closed_signature_maps_are_built_once|known_calls_pass_their_arguments_together|empty_row_non_tail_handlers_keep_the_stack_limit)$/)))
| (package(stitchwort-driver) & binary(library) & test(/^std_library::/) & !test(/^std_library::(lazy_loading_changes_nothing_for_.*|the_core_alone_runs_every_example_that_uses_no_library_name|every_builtin_is_bound_once_every_file_has_loaded|no_library_file_declares_a_decision_procedure|small_programs_load_only_the_library_files_they_can_use|the_index_holds_exactly_the_names_an_eager_load_makes|library_tests_run_only_under_the_library_target|the_standard_library_passes_its_own_tests|the_order_never_depends_on_how_the_program_mentions_things)$/))
| (package(stitchwort-host) | (package(stitchwort-rt) & (kind(lib) | (binary(it) & test(/^tick_counts::/)) | (binary(it) & test(/^alloc_trace::/)) | (binary(it) & test(/^live_run::/)) | (binary(it) & test(/^partial_handlers::(only_resuming_more_than_once_copies|capture_and_restore_leak_nothing)$/)) | (binary(it) & test(=machine::library_tests_agree)) | (binary(it) & test(/^linked::/)) | (binary(it) & test(/^reuse::/)) | (binary(it) & test(/^codec::(micro_call_round_trips|foreign_bytes_are_refused|absurd_nesting_is_refused)$/)) | (binary(it) & test(/^effect_runtime::(closed_signature_maps_are_constants|bind_of_done_is_a_direct_call)$/)))))
| (package(stitchwort-js) | (package(stitchwort-cli) & binary(extraction) & test(/^extract::(int_crosses_the_boundary_strictly|options_cross_the_boundary_as_undefined|records_cross_the_boundary_strictly|awkward_names_never_collide|more_tail_calls_are_loops)$/)))
| (package(stitchwort-native) & !test(=tail_calls_of_every_shape_run_in_constant_stack))
| ((package(stitchwort-cli) & binary(server) & test(/^lsp::(hover_over_a_selection_gives_the_type_of_the_expression|formatting_replaces_the_open_text|a_file_on_its_own_as_you_type|goal_at_answers_for_the_goal_at_or_near_the_cursor|small_navigation_issues|eq_sym_and_eq_trans_navigate_to_their_definitions)$/)) | (package(stitchwort-lsp) & (kind(lib) | (binary(it) & test(/^features::(completion_offers_locals_then_the_namespace_then_imports_and_defaults|semantic_tokens_colour_names_by_what_they_resolve_to|signature_help_shows_the_function_and_the_current_parameter|signature_help_tells_two_functions_with_the_same_short_name_apart|the_outline_asked_as_the_file_opens_is_not_empty)$/)))))
| ((package(stitchwort-fmt) & !(binary(it) & test(/^repo::/)) & !(binary(it) & test(/^fuzz::/))) | (package(stitchwort-cli) & binary(tools) & test(/^fmt::/)))
| (package(stitchwort-cli) & binary(running) & test(/^aoc_answers::(year2024_day02|year2024_day04|year2024_day07|year2025_day01|year2025_day05|year2025_day07)$/))
| (package(stitchwort-standalone) | (package(stitchwort-cli) & ((binary(server) & test(/^session::/)) | (binary(running) & test(/^keys_mode::/)) | (binary(tools) & test(/^audit::/)) | (binary(running) & test(/^run::/) & !test(/^run::(a_failure_deep_in_partial_recursion_doesnt_overflow|a_partial_main_that_may_fail_runs_three_ways|a_total_main_that_may_fail_runs_three_ways|an_endless_partial_main_runs_until_stopped|the_example_prints_what_simulate_records)$/)) | (kind(bin) & test(/^build::/)) | (binary(running) & test(/^build::/) & !test(/^build::the_roguelike_(built_native_)?plays_as_it_does_under_run$/)))))
| ((package(stitchwort-driver) & binary(library) & test(/^hash_stability::(examples|projects|prelude)$/)) | (package(stitchwort-driver) & binary(library) & test(/^pinned_hashes::/)))
| (package(stitchwort-cli) & binary(running) & test(/^examples::/))
| (package(stitchwort-bench) & (kind(lib) | (binary(check_work) & !test(=checking_does_not_compute_unneeded_values))))
| ((package(stitchwort-driver) & binary(library) & test(/^search_match::/)) | (package(stitchwort-driver) & binary(library) & test(/^search_bench::/)) | (package(stitchwort-driver) & binary(library) & test(/^search_at::/)) | (package(stitchwort-cli) & ((binary(server) & test(/^search::/)) | (binary(tools) & test(/^doc::/)))))
| package(stitchwort-core)
| package(stitchwort-native)
| (package(stitchwort-cli) & binary(running) & test(/^build::/))
| (package(stitchwort-driver) & ((binary(projects) & test(=navigation::references_of_a_project)) | (binary(elaboration) & test(=named_arguments::named_calls_keep_every_hash))))
| (package(stitchwort-cli) & binary(extraction) & test(=extract::generated_code_is_stable))
| (package(stitchwort-cli) & binary(running) & test(/^aoc_answers::(year2021_day(01|03|07)|year2024_day(01|02|03|04|05|07|09)|year2025_day(01|03|05|07))$/))
"""

# Every test's time, for cutting the tier when it grows past its budget:
# target/nextest/quick/junit.xml.
[profile.quick.junit]
path = "junit.xml"

# ------------------------------------------------------------- lane areas
#
# `task test:lane AREA=…`: one area's handful of fast tests, under 10 s with
# the release test binaries built. Keep each to tests that take about a
# second; the quick tier above is the union of them but for `lane-goals`, plus
# a sample of the examples' hash snapshots, 14 AoC answers and the
# extraction snapshots.

[profile.lane-syntax]
default-filter = "package(stitchwort-syntax)"

[profile.lane-core]
default-filter = "(package(stitchwort-core) & (kind(lib) | (binary(it) & test(/^kernel::/)) | (binary(it) & test(/^hash::/)) | (binary(it) & test(/^admission::/)) | (binary(it) & test(/^opaque::/)) | (binary(it) & test(/^trusted::/)) | (binary(it) & test(/^universe_levels::/)) | (binary(it) & test(/^kernel_bugs_2026::/)))) | (package(stitchwort-driver) & ((binary(proofs) & test(/^nested_oracle::/)) | (binary(elaboration) & test(/^division::/))))"

[profile.lane-elab]
default-filter = "(package(stitchwort-elab) & !test(/^omega_search::tests::(replay_refuses_a_missing_case|integer_model|needs_nonnegativity|not_equal_splits|disconnected)$/)) | (package(stitchwort-driver) & binary(proofs) & test(=conv_shortcut::a_solved_unknown_is_seen_through_by_the_identity_shortcut)) | (package(stitchwort-driver) & ((binary(proofs) & test(/^function_equations::/)) | (binary(proofs) & test(/^function_induct::/))))"

[profile.lane-effects]
default-filter = """
(package(stitchwort-driver) & binary(elaboration) & test(/^ability_errors::/)) | (package(stitchwort-driver) & binary(elaboration) & test(/^empty_row_kernel::/))
| (package(stitchwort-rt) & binary(it) & test(/^effect_runtime::(state_handlers_run_as_a_loop_where_they_fit|io_operations_cross_translations_on_their_way_to_the_runner|closed_signature_maps_are_constants|bind_of_done_is_a_direct_call)$/))
| (package(stitchwort-cli) & binary(running) & test(/^effect_runtime::(closed_signature_maps_are_built_once|known_calls_pass_their_arguments_together|empty_row_non_tail_handlers_keep_the_stack_limit)$/))
"""

[profile.lane-std]
default-filter = "package(stitchwort-driver) & binary(library) & test(/^std_library::/) & !test(/^std_library::(lazy_loading_changes_nothing_for_.*|the_core_alone_runs_every_example_that_uses_no_library_name|every_builtin_is_bound_once_every_file_has_loaded|no_library_file_declares_a_decision_procedure|small_programs_load_only_the_library_files_they_can_use|the_index_holds_exactly_the_names_an_eager_load_makes|library_tests_run_only_under_the_library_target|the_standard_library_passes_its_own_tests|the_order_never_depends_on_how_the_program_mentions_things)$/)"

[profile.lane-rt]
default-filter = "package(stitchwort-host) | (package(stitchwort-rt) & (kind(lib) | (binary(it) & test(/^tick_counts::/)) | (binary(it) & test(/^alloc_trace::/)) | (binary(it) & test(/^live_run::/)) | (binary(it) & test(/^partial_handlers::(only_resuming_more_than_once_copies|capture_and_restore_leak_nothing)$/)) | (binary(it) & test(=machine::library_tests_agree)) | (binary(it) & test(/^linked::/)) | (binary(it) & test(/^reuse::/)) | (binary(it) & test(/^codec::(micro_call_round_trips|foreign_bytes_are_refused|absurd_nesting_is_refused)$/)) | (binary(it) & test(/^effect_runtime::(closed_signature_maps_are_constants|bind_of_done_is_a_direct_call)$/))))"

[profile.lane-js]
default-filter = "package(stitchwort-js) | (package(stitchwort-cli) & binary(extraction) & test(/^extract::(int_crosses_the_boundary_strictly|options_cross_the_boundary_as_undefined|records_cross_the_boundary_strictly|awkward_names_never_collide|more_tail_calls_are_loops)$/))"

[profile.lane-native]
default-filter = "package(stitchwort-native) & !test(=tail_calls_of_every_shape_run_in_constant_stack)"

# The server's quick session tests (`stitchwort-lsp` `features`, about 3 s each
# warm) and unit tests beside the `cli` `lsp` tests that drive it over stdio;
# the slow `features` tests and `memory` are for `task test:affected`'s `lsp` rule.
[profile.lane-lsp]
default-filter = "(package(stitchwort-cli) & binary(server) & test(/^lsp::(hover_over_a_selection_gives_the_type_of_the_expression|formatting_replaces_the_open_text|a_file_on_its_own_as_you_type|goal_at_answers_for_the_goal_at_or_near_the_cursor|small_navigation_issues|eq_sym_and_eq_trans_navigate_to_their_definitions)$/)) | (package(stitchwort-lsp) & (kind(lib) | (binary(it) & test(/^features::(completion_offers_locals_then_the_namespace_then_imports_and_defaults|semantic_tokens_colour_names_by_what_they_resolve_to|signature_help_shows_the_function_and_the_current_parameter|signature_help_tells_two_functions_with_the_same_short_name_apart|the_outline_asked_as_the_file_opens_is_not_empty)$/))))"

# Goals end to end with the built command (`crates/cli/tests/goal_index.rs`):
# `check --index`'s goals and lemmas, each lemma and printed goal pasted back
# and checked again. About 12 s, its lemma test the longest.
[profile.lane-goals]
default-filter = "package(stitchwort-cli) & binary(server) & test(/^goal_index::/)"

[profile.lane-fmt]
default-filter = "(package(stitchwort-fmt) & !(binary(it) & test(/^repo::/)) & !(binary(it) & test(/^fuzz::/))) | (package(stitchwort-cli) & binary(tools) & test(/^fmt::/))"

[profile.lane-aoc]
default-filter = "package(stitchwort-cli) & binary(running) & test(/^aoc_answers::(year2024_day02|year2024_day04|year2024_day07|year2025_day01|year2025_day05|year2025_day07)$/)"

[profile.lane-cli]
# Also `stitchwort build` (crates/standalone, `build.rs`), but for the
# roguelike's tests (built with and without --native), which check the game
# twice each. And `stitchwort audit` (`audit`, about 2 s).
default-filter = "package(stitchwort-standalone) | (package(stitchwort-cli) & ((binary(server) & test(/^session::/)) | (binary(running) & test(/^keys_mode::/)) | (binary(tools) & test(/^audit::/)) | (binary(running) & test(/^run::/) & !test(/^run::(a_failure_deep_in_partial_recursion_doesnt_overflow|a_partial_main_that_may_fail_runs_three_ways|a_total_main_that_may_fail_runs_three_ways|an_endless_partial_main_runs_until_stopped|the_example_prints_what_simulate_records)$/)) | (kind(bin) & test(/^build::/)) | (binary(running) & test(/^build::/) & !test(/^build::the_roguelike_(built_native_)?plays_as_it_does_under_run$/))))"

# With NAME (EXAMPLES): only the examples whose names contain it (or any of a
# comma-separated list).
[profile.lane-hashes]
default-filter = "(package(stitchwort-driver) & binary(library) & test(/^hash_stability::(examples|projects|prelude)$/)) | (package(stitchwort-driver) & binary(library) & test(/^pinned_hashes::/))"

# With NAME (EXAMPLES): only the examples whose names contain it (or any of a
# comma-separated list); without,
# the lane sample (a quarter of each folder).
[profile.lane-examples]
default-filter = "package(stitchwort-cli) & binary(running) & test(/^examples::/)"

[profile.lane-bench]
default-filter = "package(stitchwort-bench) & (kind(lib) | (binary(check_work) & !test(=checking_does_not_compute_unneeded_values)))"

[profile.lane-web]
default-filter = "package(stitchwort-web) & !test(/(effectful_maps_run_at_a_million_elements|the_guide_examples_check|every_aoc_day_checks_passes_its_tests_and_runs_on_its_example|the_playground_examples_check_and_pass_their_tests|evaluates_with_full_names_and_extracts_a_namespace|a_partial_main_that_may_fail_shows_its_output_then_the_error|a_second_source_replaces_the_remembered_one)$/)"

# `stitchwort search` (SW-915): its matching on a small file, the library's
# self-retrieval benchmarks on the lane sample (every 8th theorem) with the
# hand queries, stage 2 (`search --at`) on a small file of goals, and the
# command end to end, and `stitchwort doc` (SW-1019) end to end. About 8 s
# with the check cache the tests share filled.
[profile.lane-search]
default-filter = "(package(stitchwort-driver) & binary(library) & test(/^search_match::/)) | (package(stitchwort-driver) & binary(library) & test(/^search_bench::/)) | (package(stitchwort-driver) & binary(library) & test(/^search_at::/)) | (package(stitchwort-cli) & ((binary(server) & test(/^search::/)) | (binary(tools) & test(/^doc::/))))"

[test-groups]
# crates/cli/tests/lsp.rs keeps one warm copy of the AoC project under
# CARGO_TARGET_TMPDIR, deleted and rebuilt by whichever test gets there first
# (a OnceLock per process under `cargo test`, but one per test here). Only the
# tests that call its `aoc()` are in the group (the other `lsp` tests use
# folders of their own, named by the process id): a new test that calls
# `aoc()` must be added to the filter below.
lsp-aoc-copy = { max-threads = 1 }

# The corpus sweeps: tests that check every example, std file or AoC day (or a
# tier's sample of them) on a pool of their own (`par_map`, up to
# STITCHWORT_TEST_THREADS threads, each with a large stack and a session of its
# own). Two at a time: one sweep alone leaves cores idle while its last items
# run (the last 400 s of the broad tier ran on one to three cores). The broad
# and all tiers run pools of 5 threads (STITCHWORT_TEST_THREADS, set by their
# tasks and the flake), so two fit the 10 cores. Two sweeps held 3 GB at their
# peak (SW-1104; docs/testing.md, "Memory"). Any number of other tests run
# beside them.
corpus-sweeps = { max-threads = 2 }

# The language server's session tests (`stitchwort-lsp` `features` and
# `memory`): each opens a Session on the library, 0.4 GB when the check cache is
# warm and up to 1.9 GB while it is cold, in the one process that fills the cache
# (the others wait for it; both binaries share it, SW-1769). Ten at once on a cold cache passed the
# quick tier's 4 GB cap (SW-1760). Three at a time peaked at 3.1 GB cold, and
# the whole set takes about the same warm (28 s).
lsp-sessions = { max-threads = 3 }

# Overrides in the default profile apply to every profile.
[[profile.default.overrides]]
filter = "package(stitchwort-lsp) & ((binary(it) & test(/^features::/)) | (binary(it) & test(/^memory::/)))"
test-group = "lsp-sessions"

[[profile.default.overrides]]
filter = "package(stitchwort-cli) & binary(server) & test(/^lsp::(aoc_navigation_matches_check_index|workspace_symbols_cover_namespaces_not_checked_yet|a_newer_edit_cancels_the_check_running)$/)"
test-group = "lsp-aoc-copy"

# resources' running_out_at_any_point_only_ever_means_no_answer was here for
# its 6.7 GB (31 Oct 2026): macOS's allocator kept the blocks its sessions
# freed. It now uses mimalloc and peaks at about 380 MB (SW-921), so it runs
# beside the sweeps.
#
# A new test with its own `par_map` over a corpus belongs here too, unless its
# pool is small: crates/cli/tests/extract.rs's `generated_code_is_stable`
# peaks at about 320 MB, and in the group it would lengthen the quick tier,
# whose last tests are this group's, by its own 4 to 7 s.
[[profile.default.overrides]]
filter = """
(package(stitchwort-rt) & binary(it) & test(=machine::examples_agree))
| (package(stitchwort-rt) & binary(it) & test(=lower::every_example_lowers))
| (package(stitchwort-rt) & binary(it) & test(=machine::aoc_agrees))
| (package(stitchwort-rt) & binary(it) & test(=lower::every_aoc_main_lowers))
| (package(stitchwort-driver) & binary(proofs) & test(=differential::the_evaluators_agree_on_the_prelude_and_every_example))
| (package(stitchwort-driver) & binary(proofs) & test(=conv_shortcut::every_rejected_example_gets_the_same_verdict_without_the_shortcut))
| (package(stitchwort-driver) & binary(projects) & test(/^check_cache::(the_cache_changes_nothing_for_the_examples|the_cache_changes_nothing_for_the_aoc_project|aocs_namespaces_load_on_their_own_from_the_whole_projects_cache)$/))
| (package(stitchwort-driver) & binary(library) & test(/^hash_stability::(examples|projects|a_namespace_checked_alone_has_the_same_hashes)$/))
| (package(stitchwort-driver) & binary(library) & test(/^std_library::(lazy_loading_changes_nothing_for_.*|the_core_alone_runs_every_example_that_uses_no_library_name)$/))
| (package(stitchwort-driver) & binary(projects) & test(/^rewind::(rewinding_changes_nothing_for_the_examples|rewinding_changes_nothing_for_the_aoc_project|a_check_cancelled_part_way_rewinds)$/))
| (package(stitchwort-driver) & binary(elaboration) & test(=erasure::erasure_doesnt_change_what_examples_print_or_test))
| (package(stitchwort-driver) & binary(elaboration) & test(=named_arguments::named_calls_keep_every_hash))
| (package(stitchwort-driver) & binary(library) & test(=fmt_hashes::formatting_changes_no_declaration_hash))
| (package(stitchwort-driver) & binary(fuzz_elab))
| (package(stitchwort-driver) & binary(soundness_fuzz))
| (package(stitchwort-driver) & binary(search_at_aoc))
| (package(stitchwort-cli) & binary(server) & test(=check_cache::the_index_is_the_same_from_the_cache_for_the_example_projects))
| (package(stitchwort-cli) & binary(running) & test(/^examples::(accepted|rejected|soundness|goal)_(examples|projects)_/))
| (package(stitchwort-cli) & binary(running) & test(=run_js::examples_print_the_same_both_ways))
| (package(stitchwort-cli) & binary(running) & test(=run_reference::examples_print_the_same_both_ways))
| (package(stitchwort-cli) & binary(running) & test(=aoc_answers::every_day_from_the_whole_projects_cache))
"""
test-group = "corpus-sweeps"

# ------------------------------------------------------------ test order
#
# Priority decides which ready test starts next (-100 to 100, higher first,
# default 0), within a test group too: the longest tests start first, so that
# they are not what is left running alone at the end. Times are from the broad
# run of 2 Nov 2026 (SW-1104). Overrides in the default profile apply to every
# profile.
[[profile.default.overrides]]
filter = """
(package(stitchwort-cli) & binary(server) & test(/^lsp::(a_newer_edit_cancels_the_check_running|aoc_navigation_matches_check_index)$/))
| (package(stitchwort-cli) & binary(running) & test(=aoc_answers::every_day_from_the_whole_projects_cache))
| (package(stitchwort-driver) & binary(elaboration) & test(=operators::primitive_and_uniform_lowering_agree_on_the_library_and_aoc))
| (package(stitchwort-web) & test(=project::tests::every_aoc_day_checks_passes_its_tests_and_runs_on_its_example))
"""
priority = 100

# The other tests of 40 s or more (broad run, loaded machine), the sweeps among
# them.
[[profile.default.overrides]]
filter = """
(package(stitchwort-driver) & binary(search_at_aoc) & test(=search_at_on_aoc_goals))
| (package(stitchwort-driver) & binary(projects) & test(=rewind::rewinding_changes_nothing_for_the_examples))
| (package(stitchwort-driver) & binary(elaboration) & test(=erasure::erasure_doesnt_change_what_examples_print_or_test))
| (package(stitchwort-cli) & binary(running) & test(/^examples::(accepted|rejected)_examples_/))
| (package(stitchwort-driver) & binary(projects) & test(=check_cache::the_cache_changes_nothing_for_the_examples))
| (package(stitchwort-driver) & binary(proofs) & test(=differential::the_evaluators_agree_on_the_prelude_and_every_example))
| (package(stitchwort-driver) & binary(search_at_aoc) & test(=search_at_on_real_2021_goals))
| (package(stitchwort-rt) & binary(it) & test(=effect_runtime::every_shape_runs_at_a_million_elements))
| (package(stitchwort-cli) & binary(extraction) & test(=extract::the_declarations_type_check))
| (package(stitchwort-driver) & binary(elaboration) & test(=float::with_every_native_off_float_runs_out_of_budget))
| (package(stitchwort-driver) & binary(elaboration) & test(=number_patterns::every_number_case_in_the_examples_has_an_expansion_that_checks))
"""
priority = 50

# The tests that share one check cache of the library
# (CARGO_TARGET_TMPDIR/search-cache: the `doc` and `search` commands' tests and
# the driver's search benchmarks) each find it empty after a compiler change,
# and each check the whole library themselves (13 s alone, 25 s or more at a
# time with its 40 siblings). One of them goes first, at the top priority, and
# the rest go after every test of the default priority has started, so that
# the cache is full by then (SW-1751: this halved the CPU time of the search
# lane, from 239 s to 125 s, and about 300 s of the quick tier's test time).
# Order only, not a dependency: a test that does start early fills the cache
# itself, as before.
[[profile.default.overrides]]
filter = "package(stitchwort-cli) & binary(tools) & test(=doc::a_library_name_shows_header_doc_location_and_theorems)"
priority = 100

[[profile.default.overrides]]
filter = """
(package(stitchwort-driver) & binary(library) & test(/^search_bench::/)) | (package(stitchwort-driver) & binary(library) & test(/^search_at::/)) | (package(stitchwort-cli) & binary(tools) & test(/^doc_equations::/))
| (package(stitchwort-cli) & ((binary(server) & test(/^search::/)) | (binary(tools) & test(/^doc::/))))
"""
priority = -10

# The same for the test std cache (`Session::eager_for_stack`,
# `use_test_std_cache`; `TestCacheTurn`): after a compiler change one process
# fills it while every other test that loads the library waits on a lock,
# holding a slot. `pinned_hashes`' first test does nothing else but load the
# library through the cache, so it goes first, at the top priority, and the
# slots are not spent waiting beside it. Order only: a test that starts first
# for another reason fills the cache itself.
[[profile.default.overrides]]
filter = "package(stitchwort-driver) & binary(library) & test(=pinned_hashes::every_binding_by_hash_applies_to_the_library)"
priority = 100
