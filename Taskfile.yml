# The menu of what can be run in this repository, and when: `task --list`.
# Run inside `nix develop` (it provides `task`, cargo, nextest, node and the
# rest), e.g. `nix develop -c task test:quick`.
#
# Test tiers (docs/testing.md, "Tiers"): `lane` under 10 s, `quick` under
# 90 s on a 10-core M1 Pro, `broad` long (what `nix flake check`
# runs), `all` only when Matt asks. Which tests each tier runs is a nextest
# profile of the same name in .config/nextest.toml; STITCHWORT_TIER tells the
# corpus sweeps how much of the corpus to cover.
version: '3'

vars:
  # The cargo config that makes every checkout under .claude/worktrees build
  # through kache. Rewritten by each worktree:new and scratch:new, and alone by
  # `task kache:config`; `task kache:check` tests that it holds.
  #
  # The two KACHE_ switches close a stale-artifact bug in kache 1.0.0 (nixpkgs;
  # fixed upstream in 1.1, kunobi-ninja/kache#1489; SW-2936, docs/workflow.md
  # "kache and stale artifacts"): when a crate's input record predicted a key
  # that missed, kache compiled first and keyed the result afterwards from the
  # files as they were then, so a file saved during the compile stored the old
  # code under the new content's key, and every later build of that content
  # restored it. DEFERRED_DISCOVERY=0 keys before the compile (the dep-info
  # pre-pass, about 0.5 s per miss); MODIFIED_INPUT_GUARD=1 refuses to store a
  # result when a keyed file was written after the compile began.
  KACHE_CONFIG_SETUP: |
    mkdir -p '{{.ROOT_DIR}}/.claude/worktrees/.cargo'
    cat > '{{.ROOT_DIR}}/.claude/worktrees/.cargo/config.toml' <<'TOML'
    # Written by task worktree:new / scratch:new / kache:config (Taskfile.yml,
    # D2200): lane checkouts build through kache. Build-script runs aren't
    # cached, so crates/driver/build.rs's fingerprint is always computed afresh.
    # The last two switches stop kache 1.0.0 storing stale artifacts (SW-2936).
    # Four compiler jobs per build, so three lanes building at once stay near
    # one job per core on a 10-core machine (D3554).
    [build]
    rustc-wrapper = "kache"
    jobs = 4
    [env]
    KACHE_BUILD_SCRIPT_CACHE = "0"
    KACHE_DEFERRED_DISCOVERY = "0"
    KACHE_MODIFIED_INPUT_GUARD = "1"
    TOML
  # Shell for worktree:new and scratch:new, which make "$wt" under
  # .claude/worktrees/. Every checkout there builds through kache (the
  # compiler cache in the devShell), from .claude/worktrees/.cargo/config.toml,
  # which cargo finds above the checkout; the main checkout doesn't. The
  # Stitchwort check caches are cloned copy-on-write on APFS (macOS's
  # /bin/cp -c; the Nix cp has no -c).
  LANE_SETUP: |
    {{.KACHE_CONFIG_SETUP}}
    for d in aoc/.stitchwort games/rogue/.stitchwort; do
      if [ -d '{{.ROOT_DIR}}'/"$d" ]; then /bin/cp -c -R '{{.ROOT_DIR}}'/"$d" "$wt/$d"; fi
    done
  # The release CLI the AoC and `.sw` tasks run (on Linux the devShell sets
  # CARGO_BUILD_TARGET, the musl target, which cargo puts in its own folder).
  SW: '{{.ROOT_DIR}}/target/{{if .CARGO_BUILD_TARGET}}{{.CARGO_BUILD_TARGET}}/{{end}}release/stitchwort'
  # Where the timing tasks build and run `stitchwort` and its runtime library
  # (`libstitchwort_standalone.a`, linked into every native executable). Not
  # `target/`: the devShell's incremental release builds (CARGO_PROFILE_RELEASE_
  # INCREMENTAL=true, SW-1729) use 256 codegen units without cross-unit
  # inlining, and the executables they link run about 3% more instructions
  # than the distributed (non-incremental) build's; kache strips the flag, so a
  # lane worktree and the main checkout measured differently (SW-2474). These
  # tasks set the variable to false, which needs its own folder.
  BENCH_TARGET: '{{.ROOT_DIR}}/target/bench'
  BENCH_SW: '{{.ROOT_DIR}}/target/bench/{{if .CARGO_BUILD_TARGET}}{{.CARGO_BUILD_TARGET}}/{{end}}release/stitchwort'
  # The one feature set of every dev and test build (docs/testing.md,
  # "Features"): native code, so that `build --native` is tested
  # (crates/cli/tests/running/build.rs), and what crates/dev-features turns on. Test
  # builds get it from the crates' dev-dependencies, whatever `-p` selects;
  # a build of the CLI has to ask. The default (distributed) binary has none.
  DEV_FEATURES: '--features stitchwort-cli/dev'
  # Every task that runs tests runs them under dev/memguard, which kills the
  # whole process tree when its memory passes the tier's cap, in GB
  # (docs/testing.md, "Memory"). STITCHWORT_MEM_CAP_GB overrides the cap (0
  # for none); STITCHWORT_MEM_REPORT=1 prints the peak at the end.
  # Which packages a test run needs to build: `-p A -p B`, or `--workspace`
  # (dev/test-scope; docs/testing.md, "Features").
  SCOPE: '{{.ROOT_DIR}}/dev/test-scope'
  GUARD: '{{.ROOT_DIR}}/dev/memguard'
  # Times a step of a tier into the run's log, which dev/tier-report writes
  # up after the tier (docs/testing.md, "Tier reports").
  STEP: '{{.ROOT_DIR}}/dev/tier-step'
  REPORT: '{{.ROOT_DIR}}/dev/tier-report'
  MEM_CAP_LANE: 3
  # Quick: 2.5 to 3.1 GB measured (2 Nov 2026, SW-1076; killed twice at 3). One
  # process is 1.4 to 1.5 GB: `search --at` of a goal that mentions `≤` (cli
  # `search` `what_closes_a_goal`) loads most of the library, as it did before
  # function equations; the rest is many 0.1 to 0.4 GB processes. 4 GB leaves
  # a quarter of headroom.
  MEM_CAP_QUICK: 4
  # test:selected runs the selector's choice, which may include tests the quick
  # tier leaves out (SW-1760); it takes the broad cap, as test:one does.
  MEM_CAP_SELECTED: 16
  MEM_CAP_BROAD: 16
  MEM_CAP_ALL: 16
  # The broad and all tiers' nextest runs on a machine under 24 GiB: 4 tests
  # at once, not the profile's 6 or 8. The all tier peaked at 12.7 GB on 6
  # (a 15 GiB laptop, 8 Nov 2026, SW-2413) and was stopped for low memory.
  # Empty elsewhere (macOS has no /proc/meminfo; docs/testing.md, "Memory").
  TIER_THREADS:
    sh: awk '/^MemTotal:/ { if ($2 < 24 * 1024 * 1024) print "--test-threads 4" }' /proc/meminfo 2>/dev/null || true

tasks:
  default:
    desc: List the tasks
    silent: true
    cmds:
      - task --list

  # ------------------------------------------------------------- building

  build:
    desc: Build the release CLI with native code, and its runtime library, in target/release
    summary: |
      Builds `stitchwort` (with `--features stitchwort-cli/dev`, so
      `stitchwort build X --native` works) and `libstitchwort_standalone.a`,
      which `build --native` links against and looks for beside the
      executable. With CARGO_BUILD_TARGET set (Linux in the devShell) both
      are in target/<triple>/release.
    cmds:
      - cargo build --release -p stitchwort-cli -p stitchwort-standalone {{.DEV_FEATURES}}

  build:tests:
    desc: Build every release test binary, so the test tiers start at once
    cmds:
      - cargo nextest run --release --workspace --no-run

  # ---------------------------------------------------------------- tests

  test:lane:
    desc: 'Lane tier, under 10 s: a handful of fast tests for one AREA (task test:lane AREA=syntax)'
    summary: |
      The lane tier: what a subagent runs while working, under 10 s.

      AREA is one of: syntax, core, elab, effects, std, rt, js, native, lsp, goals, fmt,
      aoc, cli, hashes, bench, web, search, examples. For `examples` and `hashes`,
      NAME keeps only the example files or project folders whose names
      contain it (a comma-separated list keeps any of several:
      task test:lane AREA=examples NAME=synonym,map).

      Each area is the nextest profile `lane-AREA` in .config/nextest.toml,
      which says which tests it runs; the table is also in docs/testing.md.
      Extra nextest arguments go after `--`.
    requires:
      vars: [AREA]
    env:
      STITCHWORT_TIER: lane
      EXAMPLES: '{{.NAME}}'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_LANE}} -- cargo nextest run --release $({{.SCOPE}} --profile lane-{{.AREA}} -- {{.CLI_ARGS}}) --profile lane-{{.AREA}} {{.CLI_ARGS}}'

  test:one:
    desc: 'Tests whose names match a filter, at the broad sample (task test:one -- named_calls)'
    summary: |
      Runs the tests matching the nextest arguments after `--`: a name
      substring (`task test:one -- named_calls`) or a filterset
      (`task test:one -- -E 'binary(server) & test(/^lsp::/)'`). A bare name matches test names
      only, so for a whole test binary use `-E 'binary(name)'`.
      Corpus sweeps take the broad sample; set STITCHWORT_TIER=lane for the
      smallest, all for everything.
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_BROAD}} -- cargo nextest run --release $({{.SCOPE}} -- {{.CLI_ARGS}}) {{.CLI_ARGS}}'

  test:example:
    desc: 'Check one example''s snapshots: NAME is part of a file or project folder name, or a comma-separated list (task test:example NAME=test-hole)'
    summary: |
      Runs only the CLI's example and project tests, filtered by NAME: the
      accepted, rejected, soundness and goal sweeps, without the tools
      binary's guide:: tests (which ignore EXAMPLES and take minutes). NAME
      is part of an example file name or project folder name, or a
      comma-separated list (task test:example NAME=synonym,map). Corpus
      sweeps take the broad sample; set STITCHWORT_TIER=lane for the
      smallest, all for everything.
    requires:
      vars: [NAME]
    env:
      EXAMPLES: '{{.NAME}}'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_BROAD}} -- cargo nextest run --release -p stitchwort-cli -E ''binary(running) & test(/examples::(accepted|goal|rejected|soundness)/)'''

  test:affected:
    desc: "Run the tests a diff can affect (task test:affected; -- --dry-run prints only, --explain says why)"
    summary: |
      Picks the nextest filter for a diff from the files it touches
      (dev/test-affected, rules in dev/test-affected.toml), checks that it
      selects tests, then runs it as `task test:selected` does. The input is
      this checkout's work since its merge base with main; `-- --range
      OLD..NEW` or `-- --paths F...` change that. `-- --dry-run` prints the
      filter, EXAMPLES, estimated time and what was cut for the budget
      (`--budget SECONDS`, default 90) without running; `--explain` adds why
      each test was chosen. Rules may also run shell commands (the board's
      node tests, bash -n on changed scripts, ...), listed and reported with
      their results; checks left to you are printed as RUN BY HAND. Needs the
      inventory (task test:inventory).
    cmds:
      - '{{.ROOT_DIR}}/dev/test-affected --run {{.CLI_ARGS}}'

  test:features:
    desc: Fail if the dev and test cargo invocations compile any crate with more than one feature set (3 s, builds nothing)
    summary: |
      dev/features-check asks cargo for the unit graph of `task build`,
      the workspace test build and each `-p` test build, and compares the
      workspace crates' libraries, features and dependencies' included
      (docs/testing.md, "Features"). Run it after adding a crate, a feature
      or a dev-dependency.
      dev/test-alloc-check also fails if a test binary lacks the shared
      mimalloc allocator (docs/testing.md, "Allocator").
    cmds:
      - '{{.ROOT_DIR}}/dev/features-check'
      - '{{.ROOT_DIR}}/dev/test-alloc-check'

  test:lanes-nonempty:
    desc: Fail if any `lane-*` nextest profile selects no tests (lists only, runs nothing)
    summary: |
      A lane filter that matches nothing passes silently (lane-aoc once did).
      This lists each `[profile.lane-*]` in .config/nextest.toml with
      `cargo nextest list` (never runs a test) and fails, naming the profile,
      if one selects zero tests. New lane profiles are covered automatically.
      About 1 s per profile once the binaries are built, so it is in the broad
      tier, not the quick tier.
    cmds:
      - |
        # The list goes through a file, not a variable: task's shell passes
        # variables to child processes, and a list of over 128 KB fails jq's
        # exec on Linux ("argument list too long").
        status=0; err=$(mktemp); json=$(mktemp)
        for profile in $(grep -oE '^\[profile\.lane-[A-Za-z0-9_-]+\]' .config/nextest.toml | sed -E 's/^\[profile\.(.*)\]$/\1/'); do
          if ! cargo nextest list --release --workspace --profile "$profile" --message-format json >"$json" 2>"$err"; then
            echo "FAIL: cargo nextest list failed for profile $profile" >&2; head -n 8 "$err" >&2
            status=1
            continue
          fi
          n=$(jq '[.["rust-suites"][]?.testcases | to_entries[] | select(.value["filter-match"].status == "matches")] | length' "$json")
          if [ "$n" -eq 0 ]; then
            echo "FAIL: nextest profile $profile selects no tests; check its default-filter in .config/nextest.toml" >&2
            status=1
          fi
        done
        rm -f "$err" "$json"; exit $status

  test:quick:
    desc: Quick tier, under 90 s on a 10-core M1 Pro; the verifier's budget and Overmind's rolling check
    summary: |
      A wide smoke test: the feature sets, rustfmt, the parser and kernel,
      a sample of the accepted and rejected examples, 14 of the AoC days'
      answers, a quarter of the examples' hash snapshots, and more (the
      `quick` profile in .config/nextest.toml). Clippy is in the broad tier.
      Each step is timed, and the run ends with a report of where the time
      went: target/tier-report/latest-quick.md (`task tier:report` lists the
      runs; docs/testing.md, "Tier reports").
    env:
      STITCHWORT_TIER: quick
    cmds:
      - '{{.REPORT}} run quick -- task test:quick:steps -- {{.CLI_ARGS}}'

  test:quick:steps:
    # The quick tier's steps, without the report around them.
    env:
      STITCHWORT_TIER: quick
    cmds:
      - '{{.STEP}} features -- task test:features'
      - '{{.STEP}} fmt -- cargo fmt --check'
      - '{{.STEP}} "wasm check" -- cargo check -p stitchwort-web --target wasm32-unknown-unknown --release'
      - '{{.STEP}} "nextest build" -- {{.GUARD}} --cap-gb {{.MEM_CAP_QUICK}} -- cargo nextest run --release --workspace --profile quick --no-run {{.CLI_ARGS}}'
      - '{{.STEP}} "nextest run" -- {{.GUARD}} --cap-gb {{.MEM_CAP_QUICK}} -- cargo nextest run --release --workspace --profile quick {{.CLI_ARGS}}'

  tier:report:
    desc: "The last runs of the test tiers and where their time went (task tier:report -- -n 20 --tier broad)"
    summary: |
      Prints the last N runs (default 10) from target/tier-report/history.tsv:
      date, tier, commit, exit code, wall time, tests, failures, the sum of the
      tests' times, the peak memory and each step's seconds. The full report of
      the latest run of a tier is target/tier-report/latest-TIER.md.
    cmds:
      - '{{.REPORT}} history {{.CLI_ARGS}}'

  test:inventory:
    desc: 'Build target/test-inventory.json: every test, its profiles and last known time (task test:inventory -- --junit PATH)'
    summary: |
      For the post-merge test selector (SW-1098; docs/testing.md, "The test
      selector"). Lists every test nextest knows with the profiles that
      include it and its last known wall time, folding in the JUnit files
      named with `--junit PATH[@SCALE]` (and any target/nextest/*/junit.xml).
      Times are kept in target/test-timings.json, latest wins. With
      `--estimate 'FILTER'` it prints a filterset's tests and estimated time.
      Lists only; runs no test.
    cmds:
      - '{{.ROOT_DIR}}/dev/test-inventory {{.CLI_ARGS}}'

  test:selected:
    desc: "Run the selector's filterset as the quick tier would (task test:selected -- '<filterset>'), and log it"
    summary: |
      The feature sets, then `cargo fmt --check`, then nextest under the quick
      profile's settings (STITCHWORT_TIER=quick, memory guard) with the given
      filterset in place of the profile's own, then a line in
      dev/selector-log.tsv (date, commit, estimated and actual seconds,
      result, failed tests, filter). It folds its JUnit times into
      target/test-timings.json at the end. SELECTOR_ESTIMATE=N records the
      selector's own estimate. The log line is written only in the main
      checkout (the file is tracked; a lane's worktree would dirty it). The
      memory cap is the broad tier's, not the quick tier's.
    env:
      STITCHWORT_MEM_CAP_GB_SELECTED: '{{.MEM_CAP_SELECTED}}'
    cmds:
      - task: test:features
      - cargo fmt --check
      - '{{.ROOT_DIR}}/dev/run-selected {{.CLI_ARGS}}'

  test:broad:
    desc: 'Broad tier, long: the quick tier plus sampled sweeps; also what `nix flake check` runs'
    summary: |
      The quick tier plus sampled sweeps: rustfmt, clippy, the `broad` nextest profile, the
      doctests, and `library`'s `builtins::` tests in the debug profile (run beside the nextest
      profile). `task test:gate` runs
      the same in the Nix sandbox.
    env:
      STITCHWORT_TIER: broad
      # Two corpus sweeps run at once (`corpus-sweeps` in
      # .config/nextest.toml), each on a pool of 5 threads.
      STITCHWORT_TEST_THREADS: '5'
      # The float tests fail, not skip, when web/pkg is missing or stale.
      STITCHWORT_REQUIRE_WASM: '1'
    cmds:
      - '{{.REPORT}} run broad -- task test:broad:steps MEM_CAP_BROAD={{.MEM_CAP_BROAD}} -- {{.CLI_ARGS}}'

  test:broad:steps:
    # The broad tier's steps, without the report around them.
    env:
      STITCHWORT_TIER: broad
      STITCHWORT_TEST_THREADS: '5'
      STITCHWORT_REQUIRE_WASM: '1'
    cmds:
      - '{{.STEP}} web:pkg -- task web:pkg'
      - '{{.STEP}} fmt -- cargo fmt --check'
      - '{{.STEP}} lanes-nonempty -- task test:lanes-nonempty'
      - '{{.STEP}} clippy -- cargo clippy --release --all-targets -- --deny warnings'
      - '{{.STEP}} "nextest build" -- {{.GUARD}} --cap-gb {{.MEM_CAP_BROAD}} -- cargo nextest run --release --workspace --profile broad --no-run {{.CLI_ARGS}}'
      # `library`'s `builtins::` tests in the debug profile loads the whole library twice in an
      # unoptimised build, about 70 to 90 s of one core. It is built first
      # (17 s; cargo takes a lock on the build folder), then runs beside
      # nextest, one cap over both. The two runs are timed apart (the second
      # row of each is "beside"), and nextest's, which the tier waits for
      # longest, stands for the step.
      - '{{.STEP}} "builtins build" -- {{.GUARD}} --cap-gb {{.MEM_CAP_BROAD}} -- cargo test -p stitchwort-driver --test library --no-run'
      - |
        {{.STEP}} "nextest run (with builtins)" -- {{.GUARD}} --cap-gb {{.MEM_CAP_BROAD}} -- bash -c '
          log=$(mktemp)
          {{.STEP}} --parallel "builtins run" -- cargo test -p stitchwort-driver --test library builtins:: >"$log" 2>&1 &
          pid=$!
          {{.STEP}} --parallel "nextest run" -- cargo nextest run --release --workspace --profile broad {{.TIER_THREADS}} {{.CLI_ARGS}}
          status=$?
          wait "$pid" || { cat "$log"; status=1; }
          rm -f "$log"
          exit "$status"'
      - '{{.STEP}} doctests -- {{.GUARD}} --cap-gb {{.MEM_CAP_BROAD}} -- cargo test --release --doc --workspace'
      - '{{.STEP}} board:test -- task board:test'

  test:all:
    desc: 'All tier: every test, every corpus sweep in full. Only when Matt asks'
    summary: |
      Every test, with every corpus sweep over the whole corpus and the
      all-only tests on (the `all` nextest profile, STITCHWORT_TIER=all).
      Takes tens of minutes and much of the machine. Only when Matt asks.
      `task test:all:nix` is the same in the Nix sandbox.
    env:
      STITCHWORT_TIER: all
      # Two corpus sweeps run at once, each on a pool of 5 threads.
      STITCHWORT_TEST_THREADS: '5'
    cmds:
      - '{{.REPORT}} run all -- task test:all:steps MEM_CAP_ALL={{.MEM_CAP_ALL}} -- {{.CLI_ARGS}}'

  test:all:steps:
    # The all tier's steps, without the report around them.
    env:
      STITCHWORT_TIER: all
      STITCHWORT_TEST_THREADS: '5'
    cmds:
      - '{{.STEP}} "nextest build" -- {{.GUARD}} --cap-gb {{.MEM_CAP_ALL}} -- cargo nextest run --release --workspace --profile all --no-run {{.CLI_ARGS}}'
      - '{{.STEP}} "nextest run" -- {{.GUARD}} --cap-gb {{.MEM_CAP_ALL}} -- cargo nextest run --release --workspace --profile all {{.TIER_THREADS}} {{.CLI_ARGS}}'
      - '{{.STEP}} doctests -- {{.GUARD}} --cap-gb {{.MEM_CAP_ALL}} -- cargo test --release --doc --workspace'
      - '{{.STEP}} verify-cache -- task test:verify-cache'

  test:verify-cache:
    desc: "Fill aoc's and the roguelike's test caches, then run their tests afresh and compare (D2379; about 6 min)"
    summary: |
      In aoc/ and games/rogue/, `stitchwort test` first fills the test cache
      with the results of a plain run. Then `stitchwort test --verify-cache`
      runs every test with the cache off and compares each result with what
      the cache holds, failing on any that differs with the test's name and
      hash. A failure means the test cache's key misses an input
      (docs/proposals/test-cache-key.md, section 8). A verify run that
      compared nothing also fails, so a fresh binary can't pass without
      filling the cache. Part of the all tier.
    deps: [build]
    cmds:
      - 'cd aoc && {{.SW}} test'
      - 'cd aoc && {{.SW}} test --verify-cache'
      - 'cd games/rogue && {{.SW}} test'
      - 'cd games/rogue && {{.SW}} test --verify-cache'

  test:gate:
    desc: 'nix flake check: the broad tier in the Nix sandbox, with clippy, rustfmt, debug-builtins and the board'
    summary: |
      Bounded so it doesn't starve other work: GATE_CORES (default 6) cores,
      GATE_JOBS (default 2) jobs.
    cmds:
      - nix flake check --option cores {{.GATE_CORES | default 6}} --option max-jobs {{.GATE_JOBS | default 2}}

  test:all:nix:
    desc: 'nix build .#stitchwort-all: the all tier in the Nix sandbox. Only when Matt asks'
    cmds:
      - nix build .#stitchwort-all --no-link --option cores {{.GATE_CORES | default 6}} --option max-jobs {{.GATE_JOBS | default 2}}

  test:areas:
    desc: "Retired: use test:affected"
    cmds:
      - 'echo "test:areas is retired (dev/t is gone): use task test:affected (dev/test-affected; docs/testing.md)" >&2; exit 1'

  test:browser:
    desc: Build the playground, then test it in headless Chrome (web/test.sh; about 35 s)
    cmds:
      - ./web/test.sh {{.CLI_ARGS}}

  test:vscode:
    desc: The VS Code extension's client tests, against a fake server
    cmds:
      - '[[ -d editors/vscode/node_modules ]] || npm ci --prefix editors/vscode'
      - node --test "editors/vscode/test/*.test.js"

  test:colour:
    desc: The playground tokenizer's colouring tests (node --test; no browser)
    cmds:
      - node --test web/tests/colour.test.mjs

  board:test:
    desc: The board's tests (node --test)
    dir: board
    cmds:
      - node --test board.test.js

  # ------------------------------------------------------------- fuzzers

  # The fuzzers run in the release profile, with the tests' features and
  # memory guard, and show their output. They also run in the tiers at a
  # fixed small case count; these tasks run them at a count and seed of your
  # choosing. Task's CASES, SEED and CORPUS variables are passed on as
  # FUZZ_CASES, FUZZ_SEED and FUZZ_CORPUS (unset: the test's default).

  fuzz:elab:
    desc: 'Elaborator fuzzer, release (task fuzz:elab CASES=2000 SEED=0x2 CORPUS=1)'
    summary: Runs crates/driver/tests/fuzz_elab.rs. SEED is decimal or 0x...; CORPUS=1 checks the unmutated examples. FROM and TO (or ONLY=n) check only those cases of the CASES generated, and DUMP=1 also writes their inputs out; a case whose check runs over 5 s is named on stderr. A failure saves its input to target/fuzz-elab/<seed>-<case>.sw.
    env:
      FUZZ_CASES: '{{.CASES}}'
      FUZZ_SEED: '{{.SEED}}'
      FUZZ_CORPUS: '{{.CORPUS}}'
      FUZZ_FROM: '{{.FROM}}'
      FUZZ_TO: '{{.TO}}'
      FUZZ_ONLY: '{{.ONLY}}'
      FUZZ_DUMP: '{{.DUMP}}'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_BROAD}} -- cargo nextest run --release --workspace --no-capture -E ''binary(fuzz_elab)'' {{.CLI_ARGS}}'

  fuzz:soundness:
    desc: 'Soundness fuzzer, release, a few minutes (task fuzz:soundness MUTANTS=600 VOID=400 SEED=0x2 CORPUS=aoc,rogue)'
    summary: Runs crates/driver/tests/soundness_fuzz.rs (SW-687) on every corpus (examples, std, aoc, rogue; CORPUS narrows it). MUTANTS statement and proof mutants, VOID mutated soundness examples besides every generated Void attempt. A finding saves its program to target/soundness-fuzz/.
    vars:
      MUTANTS: '{{.MUTANTS | default "400"}}'
      VOID: '{{.VOID | default "200"}}'
      CORPUS: '{{.CORPUS | default "all"}}'
    env:
      SOUND_MUTANTS: '{{.MUTANTS}}'
      SOUND_VOID: '{{.VOID}}'
      SOUND_SEED: '{{.SEED}}'
      SOUND_CORPUS: '{{.CORPUS}}'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_BROAD}} -- cargo nextest run --release --workspace --no-capture -E ''binary(soundness_fuzz)'' {{.CLI_ARGS}}'

  fuzz:syntax:
    desc: 'Lexer and parser fuzzer, release (task fuzz:syntax CASES=100000)'
    summary: Runs crates/syntax/tests/it/fuzz.rs.
    env:
      FUZZ_CASES: '{{.CASES}}'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_BROAD}} -- cargo nextest run --release --workspace --no-capture -E ''package(stitchwort-syntax) & binary(it) & test(/^fuzz::/)'' {{.CLI_ARGS}}'

  fuzz:fmt:
    desc: 'Formatter fuzzer, release (task fuzz:fmt CASES=5000 SEED=0x1234)'
    summary: Runs crates/fmt/tests/it/fuzz.rs, 50,000 cases from a fixed seed by default. SEED is decimal or 0x...; the run prints the seed and case count, and a failure names the seed and case.
    env:
      FUZZ_CASES: '{{.CASES}}'
      FUZZ_SEED: '{{.SEED}}'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_BROAD}} -- cargo nextest run --release --workspace --no-capture -E ''package(stitchwort-fmt) & binary(it) & test(/^fuzz::/)'' {{.CLI_ARGS}}'

  fuzz:kernel:
    desc: 'Kernel fuzzer, release (task fuzz:kernel CASES=20000 SEED=0x2)'
    summary: Runs crates/core/tests/it/fuzz.rs, 3000 cases from a fixed seed by default. SEED is decimal or 0x...; the run prints the seed and case count, and a failure names the seed and case.
    env:
      FUZZ_CASES: '{{.CASES}}'
      FUZZ_SEED: '{{.SEED}}'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_BROAD}} -- cargo nextest run --release --workspace --no-capture -E ''package(stitchwort-core) & binary(it) & test(/^fuzz::/)'' {{.CLI_ARGS}}'

  # ------------------------------------------- snapshots and generated text

  examples:scan:
    desc: Check examples' expected error and warning codes against the release CLI, without the snapshot tests
    summary: |
      Runs dev/examples-scan: for every examples/{accept,reject,soundness,goals}/*.sw
      file, compares the error and warning codes in its `-- expect-error:` and
      `-- expect-warning:` header lines with the codes `stitchwort check`
      reports (60 s per file), prints each mismatch, and exits non-zero if
      there are any. A fast check of the headers; the snapshot tests remain
      the full check of the messages. Needs the release CLI (`task build`, or
      `cargo build --release -p stitchwort-cli`).
    cmds:
      - '{{.ROOT_DIR}}/dev/examples-scan'

  snap:examples:
    desc: 'Update the examples'' error-message snapshots (NAME=part of a file name, or a comma-separated list; all if unset), then list them'
    env:
      STITCHWORT_TIER: all
      INSTA_UPDATE: always
      EXAMPLES: '{{.NAME}}'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_ALL}} -- cargo nextest run --release -p stitchwort-cli --test running --no-fail-fast examples::'
      - git status --short -- '*.snap'

  pins:show:
    desc: 'Print the pin table (crates/core/src/pins.rs) with each declaration''s hash now; never writes it'
    cmds:
      - cargo run --release -q -p stitchwort-driver --example pins

  snap:hashes:
    desc: 'Update the hash-stability snapshots (NAME=part of an example file name, e.g. NAME=ranges-omega, or a comma-separated list; all if unset; std changes run it without NAME), then list them'
    env:
      STITCHWORT_TIER: all
      INSTA_UPDATE: always
      EXAMPLES: '{{.NAME}}'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_ALL}} -- cargo nextest run --release -p stitchwort-driver --test library --no-fail-fast hash_stability::'
      - git status --short -- '*.snap'

  snap:one:
    desc: 'Update the snapshots of the tests matching the arguments after `--`, then list them'
    env:
      INSTA_UPDATE: always
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_ALL}} -- cargo nextest run --release --workspace --no-fail-fast {{.CLI_ARGS}}'
      - git status --short -- '*.snap'

  guide:update:
    desc: Regenerate the language guide's quoted examples and compiler output (docs/guide)
    env:
      STITCHWORT_GUIDE_UPDATE: '1'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_BROAD}} -- cargo nextest run --release -p stitchwort-cli --test tools guide::'

  bench:
    desc: 'Benchmarks against bench/baseline.toml: counts and time (about 4 minutes on a quiet machine, 80 s with -- --no-time; args after --)'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_BROAD}} -- cargo run --release -p stitchwort-bench -- {{.CLI_ARGS}}'

  measure:state:
    desc: 'Step 6 measurements (elaborator-state.md 4.8.7): edit loop, CLI modes, rewind; about 40 min, foreground (task measure:state -- LABEL)'
    summary: |
      dev/measure-state: the language server's edit loop on aoc and
      games/rogue (RSS, heap, latency), `check` on aoc cold, with an empty
      cache folder, warm and mixed (user CPU, peak RSS), and the cost of a
      mark and a rewind. Writes dev/measurements/LABEL-DATE.md. Cut it with
      AOC_CYCLES, ROGUE_CYCLES, CLI_RUNS and SKIP (see the script).
    cmds:
      - dev/measure-state {{.CLI_ARGS}}

  bench:update:
    desc: Record this run as the benchmark baseline (bench/baseline.toml); on a quiet machine
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_BROAD}} -- cargo run --release -p stitchwort-bench -- --update'

  native:handwritten:
    desc: 'Hand-written native experiment (bench/native/handwritten): release build, every mode at 1,000,000 keys'
    cmds:
      - cargo build --release --manifest-path bench/native/handwritten/Cargo.toml --bins
      - for m in uniform ir typed; do echo "== $m"; bench/native/handwritten/target/release/setexp $m 1000000; done
      - for m in uniform typed; do echo "== noinline $m"; bench/native/handwritten/target/release/noinline $m 1000000; done

  native:bench:
    desc: 'Native code (stages N1-N3): the bench/native programs at full size on the machine, --js and --native, best of 3 (a few minutes)'
    summary: |
      Builds `stitchwort` with the `native` feature, scales the programs of
      bench/native up to the sizes of docs/proposals/native-compilation.md
      (1,000,000 keys and list elements; 20,000,000 calls and iterations) into
      target/native-bench, and prints the best of ROUNDS (default 3) wall
      times for each runner, with the load average. A measurement, not a test.
    vars:
      ROUNDS: '{{.ROUNDS | default "3"}}'
    env:
      CARGO_TARGET_DIR: '{{.BENCH_TARGET}}'
      CARGO_PROFILE_RELEASE_INCREMENTAL: 'false'
    cmds:
      - cargo build --release -p stitchwort-cli {{.DEV_FEATURES}}
      - bash bench/native/bench.sh {{.BENCH_SW}} {{.ROUNDS}}

  bench:compare:
    desc: 'Stitchwort against CPython, PyPy and Lean (bench/compare): checks every answer, then times; on a quiet machine (args after --: --runs N, --all, program names)'
    summary: |
      Builds `stitchwort` and its native runtime library (as `task build`) and runs
      bench/compare/compare.sh in `nix develop .#compare`: each program's
      runners are run once and must print expected.txt exactly, then are
      timed with hyperfine, startup subtracted. A measurement, not a test:
      docs/proposals/comparative-speed.md, bench/compare/README.md.
    env:
      CARGO_TARGET_DIR: '{{.BENCH_TARGET}}'
      CARGO_PROFILE_RELEASE_INCREMENTAL: 'false'
    cmds:
      - cargo build --release -p stitchwort-cli -p stitchwort-standalone {{.DEV_FEATURES}}
      - nix develop .#compare -c bash bench/compare/compare.sh --sw {{.BENCH_SW}} {{.CLI_ARGS}}

  bench:aoc:
    desc: 'Native speed of every AoC day (bench/aoc): answers checked, instructions retired and wall time, against the previous run (task bench:aoc FILTER=2024; args after --)'
    summary: |
      Builds `stitchwort` and its native runtime library non-incrementally into
      target/bench (as `bench:compare`), then bench/aoc/sweep.py builds each day natively, runs it on its input
      (60 s each; a timeout is reported, not a failure), checks the answer
      against crates/cli/tests/running/aoc_answers.rs and counts instructions.
      Writes target/bench-aoc/<time>-<host>.json and prints the change per day
      against the previous run (`-- --against old.json`, `--no-diff`).
      FILTER is a year or a regex on YEAR/DAY ("2024/0[1-3]"). A measurement,
      not a test: bench/aoc/README.md.
    env:
      CARGO_TARGET_DIR: '{{.BENCH_TARGET}}'
      CARGO_PROFILE_RELEASE_INCREMENTAL: 'false'
    cmds:
      - cargo build --release -p stitchwort-cli -p stitchwort-standalone {{.DEV_FEATURES}}
      - python3 -I bench/aoc/sweep.py --sw {{.BENCH_SW}} {{if .FILTER}}--filter '{{.FILTER}}'{{end}} {{.CLI_ARGS}}

  bench:compare:check:
    desc: 'Run every bench/compare runner once and compare its output with expected.txt (no timing; args after -- name programs)'
    env:
      CARGO_TARGET_DIR: '{{.BENCH_TARGET}}'
      CARGO_PROFILE_RELEASE_INCREMENTAL: 'false'
    cmds:
      - cargo build --release -p stitchwort-cli -p stitchwort-standalone {{.DEV_FEATURES}}
      - nix develop .#compare -c bash bench/compare/compare.sh --check --sw {{.BENCH_SW}} {{.CLI_ARGS}}

  bench:instructions:
    desc: 'Instructions retired by bench/compare programs, repeated, saved and compared (args after --: program names, --runs N, --set core|wide, --save NAME, --against NAME)'
    summary: |
      Builds `stitchwort` and its runtime non-incrementally into target/bench
      (as `bench:compare`), builds each program natively once, runs it N
      times (default 5) under `/usr/bin/time -l` (macOS) or `perf stat`
      (Linux), checks every output against expected.txt, and prints the
      min, median, max and spread of instructions retired. --save NAME
      writes target/bench/instructions/NAME.json; --against NAME prints the
      change of each median against it and the geometric mean. For perf
      lanes' before/after: save on main's commit, then compare on the
      branch. bench/compare/README.md.
    env:
      CARGO_TARGET_DIR: '{{.BENCH_TARGET}}'
      CARGO_PROFILE_RELEASE_INCREMENTAL: 'false'
    cmds:
      - cargo build --release -p stitchwort-cli -p stitchwort-standalone {{.DEV_FEATURES}}
      - python3 -I bench/compare/instructions.py --sw {{.BENCH_SW}} {{.CLI_ARGS}}

  profile:native:
    desc: 'Profile the native executables of bench/compare programs: samply top functions by Stitchwort definition, and counts of runtime calls (args after --: program names, --top N, --focus FUNCTION, --group PREFIX, --by-instruction [--bodies N], --no-counts)'
    summary: |
      Builds `stitchwort` and its runtime library (as `task build`), then
      dev/profile-native: for each program, its native executable is
      recorded with samply (target/profile/NAME.json.gz, `samply load` to
      browse) and summarised by dev/profile_top.py, then rebuilt against a
      runtime with the `call-counts` feature (target/profiling/) to count
      native code's calls into the runtime. One program at a time, 5 min
      cap each. With --by-instruction, the executable is built with
      `--pc-map` (the same code, with a map of it to bytecode beside it),
      and the top --bodies compiled bodies are split by part (checks,
      reference counts, calls, the instructions' own work) and by bytecode
      instruction. docs/reviews/SW-2296-native-profiles.md.
    env:
      CARGO_TARGET_DIR: '{{.BENCH_TARGET}}'
      CARGO_PROFILE_RELEASE_INCREMENTAL: 'false'
    cmds:
      - cargo build --release -p stitchwort-cli -p stitchwort-standalone {{.DEV_FEATURES}}
      - python3 -I dev/profile-native --sw {{.BENCH_SW}} {{.CLI_ARGS}}

  bench:compare:proofs:
    desc: 'Checking speed, Stitchwort against Lean (bench/compare/lean-proofs): three AoC days, cold, library load apart; on a quiet machine (args after --: --runs N, day names)'
    summary: |
      Builds `stitchwort` and runs bench/compare/proofs.py in `nix develop
      .#compare`: `stitchwort check --no-cache` on each day's proof
      namespaces against `lean` on the ported file and a cold `lake build`,
      each net of the library load. A measurement, not a test:
      docs/proposals/comparative-speed.md section 3.
    cmds:
      - cargo build --release -p stitchwort-cli {{.DEV_FEATURES}}
      - nix develop .#compare -c python3 -I bench/compare/proofs.py --sw {{.SW}} {{.CLI_ARGS}}

  # ------------------------------------------------- formatting and lints

  fmt:
    desc: Format the Rust sources (cargo fmt)
    cmds:
      - cargo fmt

  fmt:sw:
    desc: 'Format .sw files in place (stitchwort fmt; files after --, the project in the current folder if none)'
    deps: [build]
    cmds:
      - '{{.SW}} fmt {{.CLI_ARGS}}'

  lint:
    desc: rustfmt --check and clippy, as the gate runs them
    cmds:
      - cargo fmt --check
      - cargo clippy --release --all-targets -- --deny warnings

  # ------------------------------------------------------ Stitchwort files

  sw:
    desc: 'Run the release CLI with the arguments after -- (task sw -- check examples/extract/append.sw)'
    deps: [build]
    cmds:
      - '{{.SW}} {{.CLI_ARGS}}'

  sw:check:
    desc: 'Check a .sw file or project namespace (task sw:check -- FILE)'
    deps: [build]
    cmds:
      - '{{.SW}} check {{.CLI_ARGS}}'

  sw:test:
    desc: "Run a .sw file's tests (task sw:test -- FILE)"
    deps: [build]
    cmds:
      - '{{.SW}} test {{.CLI_ARGS}}'

  sw:run:
    desc: "Run a .sw file's main on the fast runtime (task sw:run -- FILE; --js or --reference before FILE)"
    deps: [build]
    interactive: true
    cmds:
      - '{{.SW}} run {{.CLI_ARGS}}'

  # ------------------------------------------------------- Advent of Code

  aoc:check:
    desc: 'Check the AoC project (aoc/), or the namespaces after -- (task aoc:check -- Aoc.Year2025.Day05)'
    deps: [build]
    dir: aoc
    cmds:
      - '{{.SW}} check {{.CLI_ARGS}}'

  audit:
    desc: 'Audit every theorem of std, aoc and the roguelike for axioms beyond the allowed ones and unfinished proofs, without the counterexample search (about 11 s warm); run at every merge (D2043)'
    summary: |
      `stitchwort audit --no-search` over std, the AoC project and the
      roguelike (docs/workflow.md, "How a proof lane finishes"). A proof
      lane's own namespaces are also audited with the search before its
      merge: task audit:touched -- Aoc.Year2024.Day06.
    deps: [build]
    cmds:
      - '{{.SW}} audit Std --no-search'
      - 'cd aoc && {{.SW}} audit --no-search'
      - 'cd games/rogue && {{.SW}} audit --no-search'

  audit:touched:
    desc: 'Audit the namespaces after -- with the counterexample search, vacuity included (task audit:touched -- Aoc.Year2024.Day06); run before merging a proof lane (D2043)'
    summary: |
      Runs in the current folder, so a project's own stitchwort.yaml is found.
      From the repo root, which has none, it picks the project from the first
      namespace: Aoc.* in aoc/, Rogue* in games/rogue/.
    deps: [build]
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - |
        if [ "$PWD" = "{{.ROOT_DIR}}" ]; then
          case "{{.CLI_ARGS}}" in
            Aoc*) cd aoc ;;
            Rogue*) cd games/rogue ;;
          esac
        fi
        {{.SW}} audit {{.CLI_ARGS}}

  aoc:test:
    desc: "Run the AoC project's tests (results cached in aoc/.stitchwort/)"
    deps: [build]
    dir: aoc
    cmds:
      - '{{.SW}} test {{.CLI_ARGS}}'

  aoc:run:
    desc: 'Run one AoC day on its puzzle input (task aoc:run DAY=05, or YEAR=2024 DAY=01), compiled to JS'
    requires:
      vars: [DAY]
    vars:
      YEAR: '{{.YEAR | default "2025"}}'
    deps: [build]
    dir: aoc
    cmds:
      - '{{.SW}} run --js Aoc.Year{{.YEAR}}.Day{{.DAY}}.main < {{.AOC_INPUTS | default "inputs"}}/{{.YEAR}}/day{{.DAY}}.txt'

  rogue:run:
    desc: 'Play the roguelike (games/rogue/) in the terminal: arrows or h/j/k/l move, q quits'
    deps: [build]
    dir: games/rogue
    cmds:
      - '{{.SW}} run {{.CLI_ARGS}} Rogue.main'
    interactive: true

  rogue:test:
    desc: "Check the roguelike's proofs and run its tests"
    deps: [build]
    dir: games/rogue
    cmds:
      - '{{.SW}} test {{.CLI_ARGS}}'

  # ------------------------------------------------- playground and board

  web:build:
    desc: Build the playground's WebAssembly bundle into web/pkg/
    cmds:
      - ./web/build.sh

  web:pkg:
    desc: Build web/pkg/ unless it is already built from the current sources
    # Every input build.sh reads, directly or through the scripts it calls:
    # the Cargo workspace (manifests, sources, build scripts, target config),
    # the scripts themselves, the worker script write-version.sh hashes, and
    # the AoC, roguelike, sf and book files bundle-projects.sh copies. The guide pages
    # are served, not bundled, so they are not here.
    sources:
      - Cargo.toml
      - Cargo.lock
      - .cargo/config.toml
      - crates/*/src/**/*
      - crates/**/Cargo.toml
      - crates/**/build.rs
      - web/build.sh
      - web/bundle-projects.sh
      - web/bundle-std.sh
      - web/bundle-std-cache.mjs
      - web/write-version.sh
      - web/playground-worker.js
      - aoc/stitchwort.yaml
      - aoc/src/**/*.sw
      - aoc/examples/[0-9][0-9][0-9][0-9]/*.txt
      - aoc/inputs/[0-9][0-9][0-9][0-9]/*.txt
      - games/rogue/stitchwort.yaml
      - games/rogue/src/**/*.sw
      - sf/stitchwort.yaml
      - sf/src/**/*.sw
      - book/stitchwort.yaml
      - book/src/**/*.sw
    generates:
      - web/pkg/stitchwort_web_bg.wasm
      - web/pkg/stitchwort_web.js
      - web/pkg/std.bundle
      - web/pkg/std.cache.gz
      - web/pkg/version.json
      - web/pkg/projects/aoc/manifest.json
      - web/pkg/projects/rogue/manifest.json
      - web/pkg/projects/sf/manifest.json
    cmds:
      - ./web/build.sh

  web:serve:
    desc: 'Build the playground, then serve web/ at http://127.0.0.1:8000 (PORT=…; -- --no-build to skip the build)'
    interactive: true
    cmds:
      - ./web/serve.sh {{.CLI_ARGS}}

  board:serve:
    desc: 'Serve the task board at http://127.0.0.1:8020 (PORT=… for another port)'
    interactive: true
    cmds:
      - ./board/serve.sh

  vscode:install:
    desc: Build the release CLI, then package the VS Code extension and install it into VS Code
    summary: |
      The extension's language server runs target/release/stitchwort, so a
      stale binary rejects syntax the current std uses (7 Nov binary vs
      SW-2587's ∀, 10 Nov 2026). Building first keeps the two in step.
    cmds:
      - task: build
      - ./editors/vscode/install.sh

  # Lane checkouts (CLAUDE.md, D2193, D2200), set up by LANE_SETUP above.
  # Measured 2 Nov 2026, a release build of the workspace in a new checkout:
  # 71 s cold, 48 s from a cloned target/, 8 s through kache once another
  # checkout has built the same code. AoC check 64 s cold, 2.9 s with the
  # cloned check cache. The recipe lives here so it can change in one place.
  worktree:new:
    silent: true
    desc: 'Make a lane worktree from local main, building through kache (task worktree:new -- SW-1083: .claude/worktrees/SW-1083, branch lane/SW-1083)'
    cmds:
      - |
        set -eu
        name='{{.CLI_ARGS}}'
        [ -n "$name" ] || { echo 'usage: task worktree:new -- NAME' >&2; exit 2; }
        wt='{{.ROOT_DIR}}/.claude/worktrees/'"$name"
        git -C '{{.ROOT_DIR}}' worktree add -q -b "lane/$name" "$wt" main
        {{.LANE_SETUP}}
        echo "$wt"

  kache:config:
    silent: true
    desc: 'Rewrite .claude/worktrees/.cargo/config.toml (kache and its stale-artifact switches) without making a checkout; worktree:new does the same'
    cmds:
      - |
        set -eu
        {{.KACHE_CONFIG_SETUP}}

  kache:check:
    desc: 'Test that kache does not store a stale artifact when a file is saved during a compile (SW-2936; 1-2 min; makes and deletes a worktree)'
    cmds:
      - '{{.ROOT_DIR}}/dev/kache-stale-check'

  worktree:rm:
    silent: true
    desc: 'Delete a lane worktree and its branch, after merging or dropping it (task worktree:rm -- SW-1083)'
    cmds:
      - |
        set -eu
        name='{{.CLI_ARGS}}'
        [ -n "$name" ] || { echo 'usage: task worktree:rm -- NAME' >&2; exit 2; }
        # A branch whose work isn't in main, or a worktree with uncommitted changes, is only deleted with
        # FORCE=1 (dropping a lane): a failed merge, or a lane still at work, must never lose work (14 Nov 2026).
        wt='{{.ROOT_DIR}}/.claude/worktrees/'"$name"
        if [ -d "$wt" ] && [ -n "$(git -C "$wt" status --porcelain 2>/dev/null)" ] && [ '{{.FORCE}}' != 1 ]; then
          echo "$wt has uncommitted changes (a lane may still be working); to drop them anyway: task worktree:rm FORCE=1 -- $name" >&2
          exit 1
        fi
        if git -C '{{.ROOT_DIR}}' rev-parse -q --verify "lane/$name" >/dev/null \
          && ! git -C '{{.ROOT_DIR}}' merge-base --is-ancestor "lane/$name" main \
          && [ '{{.FORCE}}' != 1 ]; then
          echo "lane/$name is not merged into main; to drop it anyway: task worktree:rm FORCE=1 -- $name" >&2
          exit 1
        fi
        git -C '{{.ROOT_DIR}}' worktree remove --force '{{.ROOT_DIR}}/.claude/worktrees/'"$name"
        git -C '{{.ROOT_DIR}}' branch -D "lane/$name"

  lane:merge:
    silent: true
    desc: 'Merge a lane into main (task lane:merge MSG="Merge SW-1083: ..." -- SW-1083); fails unless the lane ends up in main'
    summary: |
      Refuses a main checkout with uncommitted changes. MSG is the merge commit's message; TRAILER, if set, is
      appended after a blank line (the session's commit trailer). A conflict only in board/tickets.json keeps
      main's side (the board steps that follow set the ticket again); any other conflict aborts the merge.
      Exits non-zero unless the lane's tip is in main afterwards, so a chain joined with && stops there.
    cmds:
      - |
        set -u
        name='{{.CLI_ARGS}}'
        [ -n "$name" ] && [ -n '{{.MSG}}' ] || { echo 'usage: task lane:merge MSG="..." [TRAILER="..."] -- SW-N' >&2; exit 2; }
        cd '{{.ROOT_DIR}}'
        [ "$(git branch --show-current)" = main ] || { echo 'not on main' >&2; exit 1; }
        git diff --quiet && git diff --cached --quiet || { echo 'main checkout has uncommitted changes: commit them first' >&2; exit 1; }
        tip=$(git rev-parse -q --verify "lane/$name") || { echo "no branch lane/$name" >&2; exit 1; }
        msg='{{.MSG}}'
        [ -z '{{.TRAILER}}' ] || msg="$msg

        {{.TRAILER}}"
        if ! git merge -q --no-ff "lane/$name" -m "$msg" >/dev/null 2>&1; then
          if [ "$(git diff --name-only --diff-filter=U)" = board/tickets.json ]; then
            git checkout -q --ours board/tickets.json && git add board/tickets.json && git commit -q --no-edit \
              || { git merge --abort; echo "conflict merging $name" >&2; exit 1; }
          else
            git diff --name-only --diff-filter=U >&2
            git merge --abort 2>/dev/null
            echo "conflict merging $name (above); merge aborted" >&2
            exit 1
          fi
        fi
        git merge-base --is-ancestor "$tip" HEAD || { echo "lane/$name is not in main after the merge" >&2; exit 1; }
        echo "merged $name"

  load:
    silent: true
    desc: 'The 5-minute load and whether a new build lane may start (D3554: hold while it is above 12)'
    cmds:
      - |
        l=$(uptime | awk -F'load averages?: ' '{split($2,a,/[, ]+/); print a[2]}')
        if awk -v l="$l" 'BEGIN{exit !(l > 12)}'; then echo "5-min load $l: hold new lanes"; else echo "5-min load $l: lanes may start"; fi

  scratch:new:
    silent: true
    desc: 'Make a scratch clone for a DeepSeek task: from local main, no remote, building through kache (task scratch:new -- sw-1083: .claude/worktrees/scratch-sw-1083; delete with rm -rf)'
    cmds:
      - |
        set -eu
        name='{{.CLI_ARGS}}'
        [ -n "$name" ] || { echo 'usage: task scratch:new -- NAME' >&2; exit 2; }
        wt='{{.ROOT_DIR}}/.claude/worktrees/scratch-'"$name"
        git clone -q --branch main '{{.ROOT_DIR}}' "$wt"
        git -C "$wt" remote remove origin
        {{.LANE_SETUP}}
        echo "$wt"
