# The menu of what can be run in this repository, and when: `task --list`.
# Run inside `nix develop` (it provides `task`, cargo, nextest, node and the
# rest), e.g. `nix develop -c task test:merge`.
#
# Test tiers (docs/testing.md, "Tiers"): `lane` under 10 s, `merge` under
# 90 s on a 10-core M1 Pro, `daily` under 5 minutes (what `nix flake check`
# runs), `full` only when Matt asks. Which tests each tier runs is a nextest
# profile of the same name in .config/nextest.toml; STITCHWORT_TIER tells the
# corpus sweeps how much of the corpus to cover.
version: '3'

vars:
  # Shell for worktree:new and scratch:new, which make "$wt" under
  # .claude/worktrees/. Every checkout there builds through kache (the
  # compiler cache in the devShell), from .claude/worktrees/.cargo/config.toml,
  # which cargo finds above the checkout; the main checkout doesn't. The
  # Stitchwort check caches are cloned copy-on-write on APFS (macOS's
  # /bin/cp -c; the Nix cp has no -c).
  LANE_SETUP: |
    mkdir -p '{{.ROOT_DIR}}/.claude/worktrees/.cargo'
    cat > '{{.ROOT_DIR}}/.claude/worktrees/.cargo/config.toml' <<'TOML'
    # Written by task worktree:new / scratch:new (Taskfile.yml, D2200): lane
    # checkouts build through kache. Build-script runs aren't cached, so
    # crates/driver/build.rs's fingerprint is always computed afresh.
    [build]
    rustc-wrapper = "kache"
    [env]
    KACHE_BUILD_SCRIPT_CACHE = "0"
    TOML
    for d in aoc/.stitchwort games/rogue/.stitchwort; do
      if [ -d '{{.ROOT_DIR}}'/"$d" ]; then /bin/cp -c -R '{{.ROOT_DIR}}'/"$d" "$wt/$d"; fi
    done
  # The release CLI the AoC and `.sw` tasks run (on Linux the devShell sets
  # CARGO_BUILD_TARGET, the musl target, which cargo puts in its own folder).
  SW: '{{.ROOT_DIR}}/target/{{if .CARGO_BUILD_TARGET}}{{.CARGO_BUILD_TARGET}}/{{end}}release/stitchwort'
  # The one feature set of every dev and test build (docs/testing.md,
  # "Features"): native code, so that `build --native` is tested
  # (crates/cli/tests/build.rs), and what crates/dev-features turns on. Test
  # builds get it from the crates' dev-dependencies, whatever `-p` selects;
  # a build of the CLI has to ask. The default (distributed) binary has none.
  DEV_FEATURES: '--features stitchwort-cli/dev'
  # Every task that runs tests runs them under dev/memguard, which kills the
  # whole process tree when its memory passes the tier's cap, in GB
  # (docs/testing.md, "Memory"). STITCHWORT_MEM_CAP_GB overrides the cap (0
  # for none); STITCHWORT_MEM_REPORT=1 prints the peak at the end.
  # Which packages a test run needs to build: `-p A -p B`, or `--workspace`
  # (dev/test-scope; docs/testing.md, "Features").
  SCOPE: '{{.ROOT_DIR}}/dev/test-scope'
  GUARD: '{{.ROOT_DIR}}/dev/memguard'
  MEM_CAP_LANE: 3
  # Merge: 2.5 to 3.1 GB measured (2 Nov 2026, SW-1076; killed twice at 3). One
  # process is 1.4 to 1.5 GB: `search --at` of a goal that mentions `≤` (cli
  # `search` `what_closes_a_goal`) loads most of the library, as it did before
  # function equations; the rest is many 0.1 to 0.4 GB processes. 4 GB leaves
  # a quarter of headroom.
  MEM_CAP_MERGE: 4
  MEM_CAP_DAILY: 16
  MEM_CAP_FULL: 16

tasks:
  default:
    desc: List the tasks
    silent: true
    cmds:
      - task --list

  # ------------------------------------------------------------- building

  build:
    desc: Build the release CLI with native code, and its runtime library, in target/release
    summary: |
      Builds `stitchwort` (with `--features stitchwort-cli/dev`, so
      `stitchwort build X --native` works) and `libstitchwort_standalone.a`,
      which `build --native` links against and looks for beside the
      executable. With CARGO_BUILD_TARGET set (Linux in the devShell) both
      are in target/<triple>/release.
    cmds:
      - cargo build --release -p stitchwort-cli -p stitchwort-standalone {{.DEV_FEATURES}}

  build:tests:
    desc: Build every release test binary, so the test tiers start at once
    cmds:
      - cargo nextest run --release --workspace --no-run

  # ---------------------------------------------------------------- tests

  test:lane:
    desc: 'Lane tier, under 10 s: a handful of fast tests for one AREA (task test:lane AREA=syntax)'
    summary: |
      The lane tier: what a subagent runs while working, under 10 s.

      AREA is one of: syntax, core, elab, effects, std, rt, js, native, lsp, goals, fmt,
      aoc, cli, hashes, bench, web, search, examples. For `examples` and `hashes`,
      NAME keeps only the example files or project folders whose names
      contain it (a comma-separated list keeps any of several:
      task test:lane AREA=examples NAME=synonym,map).

      Each area is the nextest profile `lane-AREA` in .config/nextest.toml,
      which says which tests it runs; the table is also in docs/testing.md.
      Extra nextest arguments go after `--`.
    requires:
      vars: [AREA]
    env:
      STITCHWORT_TIER: lane
      EXAMPLES: '{{.NAME}}'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_LANE}} -- cargo nextest run --release $({{.SCOPE}} --profile lane-{{.AREA}} -- {{.CLI_ARGS}}) --profile lane-{{.AREA}} {{.CLI_ARGS}}'

  test:one:
    desc: 'Tests whose names match a filter, at the daily sample (task test:one -- named_calls)'
    summary: |
      Runs the tests matching the nextest arguments after `--`: a name
      substring (`task test:one -- named_calls`) or a filterset
      (`task test:one -- -E 'binary(lsp)'`). A bare name matches test names
      only, so for a whole test binary use `-E 'binary(name)'`.
      Corpus sweeps take the daily sample; set STITCHWORT_TIER=lane for the
      smallest, full for all.
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_DAILY}} -- cargo nextest run --release $({{.SCOPE}} -- {{.CLI_ARGS}}) {{.CLI_ARGS}}'

  test:features:
    desc: Fail if the dev and test cargo invocations compile any crate with more than one feature set (3 s, builds nothing)
    summary: |
      dev/features-check asks cargo for the unit graph of `task build`,
      the workspace test build and each `-p` test build, and compares the
      workspace crates' libraries, features and dependencies' included
      (docs/testing.md, "Features"). Run it after adding a crate, a feature
      or a dev-dependency.
    cmds:
      - '{{.ROOT_DIR}}/dev/features-check'

  test:lanes-nonempty:
    desc: Fail if any `lane-*` nextest profile selects no tests (lists only, runs nothing)
    summary: |
      A lane filter that matches nothing passes silently (lane-aoc once did).
      This lists each `[profile.lane-*]` in .config/nextest.toml with
      `cargo nextest list` (never runs a test) and fails, naming the profile,
      if one selects zero tests. New lane profiles are covered automatically.
      About 1 s per profile once the binaries are built, so it is in the daily
      tier, not the merge tier.
    cmds:
      - |
        status=0; err=$(mktemp)
        for profile in $(grep -oE '^\[profile\.lane-[A-Za-z0-9_-]+\]' .config/nextest.toml | sed -E 's/^\[profile\.(.*)\]$/\1/'); do
          if ! out=$(cargo nextest list --release --workspace --profile "$profile" --message-format json 2>"$err"); then
            echo "FAIL: cargo nextest list failed for profile $profile" >&2; head -n 8 "$err" >&2
            status=1
            continue
          fi
          n=$(printf '%s' "$out" | jq '[.["rust-suites"][]?.testcases | to_entries[] | select(.value["filter-match"].status == "matches")] | length')
          if [ "$n" -eq 0 ]; then
            echo "FAIL: nextest profile $profile selects no tests; check its default-filter in .config/nextest.toml" >&2
            status=1
          fi
        done
        rm -f "$err"; exit $status

  test:merge:
    desc: Merge tier, under 90 s on a 10-core M1 Pro; run after every merge
    summary: |
      A broad smoke test: the feature sets, rustfmt, the parser and kernel,
      a sample of the accepted and rejected examples, half the AoC days'
      answers, a quarter of the examples' hash snapshots, and more (the
      `merge` profile in .config/nextest.toml). Clippy is in the daily tier.
    env:
      STITCHWORT_TIER: merge
    cmds:
      - task: test:features
      - cargo fmt --check
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_MERGE}} -- cargo nextest run --release --workspace --profile merge {{.CLI_ARGS}}'

  test:inventory:
    desc: 'Build target/test-inventory.json: every test, its profiles and last known time (task test:inventory -- --junit PATH)'
    summary: |
      For the post-merge test selector (SW-1098; docs/testing.md, "The test
      selector"). Lists every test nextest knows with the profiles that
      include it and its last known wall time, folding in the JUnit files
      named with `--junit PATH[@SCALE]` (and any target/nextest/*/junit.xml).
      Times are kept in target/test-timings.json, latest wins. With
      `--estimate 'FILTER'` it prints a filterset's tests and estimated time.
      Lists only; runs no test.
    cmds:
      - '{{.ROOT_DIR}}/dev/test-inventory {{.CLI_ARGS}}'

  test:selected:
    desc: "Run the selector's filterset as the merge tier would (task test:selected -- '<filterset>'), and log it"
    summary: |
      The feature sets, then `cargo fmt --check`, then nextest under the merge
      profile's settings (STITCHWORT_TIER=merge, memory guard) with the given
      filterset in place of the profile's own, then a line in
      dev/selector-log.tsv (date, commit, estimated and actual seconds,
      result, failed tests, filter). It folds its JUnit times into
      target/test-timings.json at the end. SELECTOR_ESTIMATE=N records the
      selector's own estimate.
    env:
      STITCHWORT_MEM_CAP_GB_MERGE: '{{.MEM_CAP_MERGE}}'
    cmds:
      - task: test:features
      - cargo fmt --check
      - '{{.ROOT_DIR}}/dev/run-selected {{.CLI_ARGS}}'

  test:daily:
    desc: Daily tier, under 5 minutes; also what `nix flake check` runs
    summary: |
      Everything but the full tier's exhaustive runs, with corpus sweeps on a
      fixed sample: rustfmt, clippy, the `daily` nextest profile, the
      doctests, and `builtins` in the debug profile (run beside the nextest
      profile). `task test:gate` runs
      the same in the Nix sandbox.
    env:
      STITCHWORT_TIER: daily
      # Two corpus sweeps run at once (`corpus-sweeps` in
      # .config/nextest.toml), each on a pool of 5 threads.
      STITCHWORT_TEST_THREADS: '5'
      # The float tests fail, not skip, when web/pkg is missing or stale.
      STITCHWORT_REQUIRE_WASM: '1'
    cmds:
      - task: web:pkg
      - cargo fmt --check
      - task: test:lanes-nonempty
      - cargo clippy --release --all-targets -- --deny warnings
      # `builtins` in the debug profile loads the whole library twice in an
      # unoptimised build, about 70 to 90 s of one core. It is built first
      # (17 s; cargo takes a lock on the build folder), then runs beside
      # nextest, one cap over both.
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_DAILY}} -- cargo test -p stitchwort-driver --test builtins --no-run'
      - |
        {{.GUARD}} --cap-gb {{.MEM_CAP_DAILY}} -- bash -c '
          log=$(mktemp)
          cargo test -p stitchwort-driver --test builtins >"$log" 2>&1 &
          pid=$!
          cargo nextest run --release --workspace --profile daily {{.CLI_ARGS}}
          status=$?
          wait "$pid" || { cat "$log"; status=1; }
          rm -f "$log"
          exit "$status"'
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_DAILY}} -- cargo test --release --doc --workspace'
      - task: board:test

  test:full:
    desc: 'Full tier: every test, every corpus sweep in full. Only when Matt asks'
    summary: |
      Every test, with every corpus sweep over the whole corpus and the
      full-only tests on (the `full` nextest profile, STITCHWORT_TIER=full).
      Takes tens of minutes and much of the machine. Only when Matt asks.
      `task test:full:nix` is the same in the Nix sandbox.
    env:
      STITCHWORT_TIER: full
      # Two corpus sweeps run at once, each on a pool of 5 threads.
      STITCHWORT_TEST_THREADS: '5'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_FULL}} -- cargo nextest run --release --workspace --profile full {{.CLI_ARGS}}'
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_FULL}} -- cargo test --release --doc --workspace'
      - task: test:verify-cache

  test:verify-cache:
    desc: "Run aoc's and the roguelike's tests afresh and compare with the cached results (D2379; about 3 min)"
    summary: |
      `stitchwort test --verify-cache` on aoc/ and games/rogue/: every test
      runs with the cache off, and any result that differs from what the
      cache holds fails with the test's name and hash. A failure means the
      test cache's key misses an input (docs/proposals/test-cache-key.md,
      section 8). Part of the full tier; writes nothing to the caches.
    deps: [build]
    cmds:
      - 'cd aoc && {{.SW}} test --verify-cache'
      - 'cd games/rogue && {{.SW}} test --verify-cache'

  test:gate:
    desc: 'nix flake check: the daily tier in the Nix sandbox, with clippy, rustfmt, debug-builtins and the board'
    summary: |
      Bounded so it doesn't starve other work: GATE_CORES (default 6) cores,
      GATE_JOBS (default 2) jobs.
    cmds:
      - nix flake check --option cores {{.GATE_CORES | default 6}} --option max-jobs {{.GATE_JOBS | default 2}}

  test:full:nix:
    desc: 'nix build .#stitchwort-full: the full tier in the Nix sandbox. Only when Matt asks'
    cmds:
      - nix build .#stitchwort-full --no-link --option cores {{.GATE_CORES | default 6}} --option max-jobs {{.GATE_JOBS | default 2}}

  test:affected:
    desc: "Whole-area test suites for the areas the change since BASE touches (dev/t affected; minutes)"
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_DAILY}} -- dev/t affected {{.CLI_ARGS}}'

  test:browser:
    desc: Build the playground, then test it in headless Chrome (web/test.sh; about 35 s)
    cmds:
      - ./web/test.sh {{.CLI_ARGS}}

  test:vscode:
    desc: The VS Code extension's client tests, against a fake server
    cmds:
      - '[[ -d editors/vscode/node_modules ]] || npm ci --prefix editors/vscode'
      - node --test "editors/vscode/test/*.test.js"

  test:colour:
    desc: The playground tokenizer's colouring tests (node --test; no browser)
    cmds:
      - node --test web/tests/colour.test.mjs

  board:test:
    desc: The board's tests (node --test)
    dir: board
    cmds:
      - node --test board.test.js

  # ------------------------------------------------------------- fuzzers

  # The fuzzers run in the release profile, with the tests' features and
  # memory guard, and show their output. They also run in the tiers at a
  # fixed small case count; these tasks run them at a count and seed of your
  # choosing. Task's CASES, SEED and CORPUS variables are passed on as
  # FUZZ_CASES, FUZZ_SEED and FUZZ_CORPUS (unset: the test's default).

  fuzz:elab:
    desc: 'Elaborator fuzzer, release (task fuzz:elab CASES=2000 SEED=0x2 CORPUS=1)'
    summary: Runs crates/driver/tests/fuzz_elab.rs. SEED is decimal or 0x...; CORPUS=1 checks the unmutated examples. A failure saves its input to target/fuzz-elab/<seed>-<case>.sw.
    env:
      FUZZ_CASES: '{{.CASES}}'
      FUZZ_SEED: '{{.SEED}}'
      FUZZ_CORPUS: '{{.CORPUS}}'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_DAILY}} -- cargo nextest run --release --workspace --no-capture -E ''binary(fuzz_elab)'' {{.CLI_ARGS}}'

  fuzz:soundness:
    desc: 'Soundness fuzzer, release, a few minutes (task fuzz:soundness MUTANTS=600 VOID=400 SEED=0x2 CORPUS=aoc,rogue)'
    summary: Runs crates/driver/tests/soundness_fuzz.rs (SW-687) on every corpus (examples, std, aoc, rogue; CORPUS narrows it). MUTANTS statement and proof mutants, VOID mutated soundness examples besides every generated Void attempt. A finding saves its program to target/soundness-fuzz/.
    vars:
      MUTANTS: '{{.MUTANTS | default "400"}}'
      VOID: '{{.VOID | default "200"}}'
      CORPUS: '{{.CORPUS | default "all"}}'
    env:
      SOUND_MUTANTS: '{{.MUTANTS}}'
      SOUND_VOID: '{{.VOID}}'
      SOUND_SEED: '{{.SEED}}'
      SOUND_CORPUS: '{{.CORPUS}}'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_DAILY}} -- cargo nextest run --release --workspace --no-capture -E ''binary(soundness_fuzz)'' {{.CLI_ARGS}}'

  fuzz:syntax:
    desc: 'Lexer and parser fuzzer, release (task fuzz:syntax CASES=100000)'
    summary: Runs crates/syntax/tests/fuzz.rs.
    env:
      FUZZ_CASES: '{{.CASES}}'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_DAILY}} -- cargo nextest run --release --workspace --no-capture -E ''package(stitchwort-syntax) & binary(fuzz)'' {{.CLI_ARGS}}'

  fuzz:fmt:
    desc: 'Formatter fuzzer, release (task fuzz:fmt CASES=5000)'
    summary: Runs crates/fmt/tests/fuzz.rs.
    env:
      FUZZ_CASES: '{{.CASES}}'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_DAILY}} -- cargo nextest run --release --workspace --no-capture -E ''package(stitchwort-fmt) & binary(fuzz)'' {{.CLI_ARGS}}'

  fuzz:kernel:
    desc: 'Kernel fuzzer, release (fixed 3000 terms and seed; no knobs)'
    summary: Runs crates/core/tests/fuzz.rs, which reads no environment variables.
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_DAILY}} -- cargo nextest run --release --workspace --no-capture -E ''package(stitchwort-core) & binary(fuzz)'' {{.CLI_ARGS}}'

  # ------------------------------------------- snapshots and generated text

  snap:examples:
    desc: 'Update the examples'' error-message snapshots (NAME=part of a file name, or a comma-separated list; all if unset), then list them'
    env:
      STITCHWORT_TIER: full
      INSTA_UPDATE: always
      EXAMPLES: '{{.NAME}}'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_FULL}} -- cargo nextest run --release -p stitchwort-cli --test examples --no-fail-fast'
      - git status --short -- '*.snap'

  snap:hashes:
    desc: 'Update the hash-stability snapshots (NAME=part of a file name, or a comma-separated list; all if unset), then list them'
    env:
      STITCHWORT_TIER: full
      INSTA_UPDATE: always
      EXAMPLES: '{{.NAME}}'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_FULL}} -- cargo nextest run --release -p stitchwort-driver --test hash_stability --no-fail-fast'
      - git status --short -- '*.snap'

  snap:one:
    desc: 'Update the snapshots of the tests matching the arguments after `--`, then list them'
    env:
      INSTA_UPDATE: always
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_FULL}} -- cargo nextest run --release --workspace --no-fail-fast {{.CLI_ARGS}}'
      - git status --short -- '*.snap'

  guide:update:
    desc: Regenerate the language guide's quoted examples and compiler output (docs/guide)
    env:
      STITCHWORT_GUIDE_UPDATE: '1'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_DAILY}} -- cargo nextest run --release -p stitchwort-cli --test guide'

  bench:
    desc: 'Benchmarks against bench/baseline.toml: counts and time (about a minute; args after --, e.g. -- --no-time)'
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_DAILY}} -- cargo run --release -p stitchwort-bench -- {{.CLI_ARGS}}'

  measure:state:
    desc: 'Step 6 measurements (elaborator-state.md 4.8.7): edit loop, CLI modes, rewind; about 40 min, foreground (task measure:state -- LABEL)'
    summary: |
      dev/measure-state: the language server's edit loop on aoc and
      games/rogue (RSS, heap, latency), `check` on aoc cold, with an empty
      cache folder, warm and mixed (user CPU, peak RSS), and the cost of a
      mark and a rewind. Writes dev/measurements/LABEL-DATE.md. Cut it with
      AOC_CYCLES, ROGUE_CYCLES, CLI_RUNS and SKIP (see the script).
    cmds:
      - dev/measure-state {{.CLI_ARGS}}

  bench:update:
    desc: Record this run as the benchmark baseline (bench/baseline.toml); on a quiet machine
    cmds:
      - '{{.GUARD}} --cap-gb {{.MEM_CAP_DAILY}} -- cargo run --release -p stitchwort-bench -- --update'

  native:handwritten:
    desc: 'Hand-written native experiment (bench/native/handwritten): release build, every mode at 1,000,000 keys'
    cmds:
      - cargo build --release --manifest-path bench/native/handwritten/Cargo.toml --bins
      - for m in uniform ir typed; do echo "== $m"; bench/native/handwritten/target/release/setexp $m 1000000; done
      - for m in uniform typed; do echo "== noinline $m"; bench/native/handwritten/target/release/noinline $m 1000000; done

  native:bench:
    desc: 'Native code (stages N1-N3): the bench/native programs at full size on the machine, --js and --native, best of 3 (a few minutes)'
    summary: |
      Builds `stitchwort` with the `native` feature, scales the programs of
      bench/native up to the sizes of docs/proposals/native-compilation.md
      (1,000,000 keys and list elements; 20,000,000 calls and iterations) into
      target/native-bench, and prints the best of ROUNDS (default 3) wall
      times for each runner, with the load average. A measurement, not a test.
    vars:
      ROUNDS: '{{.ROUNDS | default "3"}}'
    cmds:
      - cargo build --release -p stitchwort-cli {{.DEV_FEATURES}}
      - bash bench/native/bench.sh {{.SW}} {{.ROUNDS}}

  # ------------------------------------------------- formatting and lints

  fmt:
    desc: Format the Rust sources (cargo fmt)
    cmds:
      - cargo fmt

  fmt:sw:
    desc: 'Format .sw files in place (stitchwort fmt; files after --, the project in the current folder if none)'
    deps: [build]
    cmds:
      - '{{.SW}} fmt {{.CLI_ARGS}}'

  lint:
    desc: rustfmt --check and clippy, as the gate runs them
    cmds:
      - cargo fmt --check
      - cargo clippy --release --all-targets -- --deny warnings

  # ------------------------------------------------------ Stitchwort files

  sw:
    desc: 'Run the release CLI with the arguments after -- (task sw -- check examples/extract/append.sw)'
    deps: [build]
    cmds:
      - '{{.SW}} {{.CLI_ARGS}}'

  sw:check:
    desc: 'Check a .sw file or project namespace (task sw:check -- FILE)'
    deps: [build]
    cmds:
      - '{{.SW}} check {{.CLI_ARGS}}'

  sw:test:
    desc: "Run a .sw file's tests (task sw:test -- FILE)"
    deps: [build]
    cmds:
      - '{{.SW}} test {{.CLI_ARGS}}'

  sw:run:
    desc: "Run a .sw file's main on the fast runtime (task sw:run -- FILE; --js or --reference before FILE)"
    deps: [build]
    interactive: true
    cmds:
      - '{{.SW}} run {{.CLI_ARGS}}'

  # ------------------------------------------------------- Advent of Code

  aoc:check:
    desc: 'Check the AoC project (aoc/), or the namespaces after -- (task aoc:check -- Aoc.Year2025.Day05)'
    deps: [build]
    dir: aoc
    cmds:
      - '{{.SW}} check {{.CLI_ARGS}}'

  audit:
    desc: 'Audit every theorem of std, aoc and the roguelike for axioms beyond the allowed ones and unfinished proofs, without the counterexample search (about 11 s warm); run at every merge (D2043)'
    summary: |
      `stitchwort audit --no-search` over std, the AoC project and the
      roguelike (docs/workflow.md, "How a proof lane finishes"). A proof
      lane's own namespaces are also audited with the search before its
      merge: task audit:touched -- Aoc.Year2024.Day06.
    deps: [build]
    cmds:
      - '{{.SW}} audit Std --no-search'
      - 'cd aoc && {{.SW}} audit --no-search'
      - 'cd games/rogue && {{.SW}} audit --no-search'

  audit:touched:
    desc: 'Audit the namespaces after -- with the counterexample search, vacuity included (task audit:touched -- Aoc.Year2024.Day06); run before merging a proof lane (D2043)'
    summary: |
      Runs in the current folder, so a project's own stitchwort.yaml is found.
      From the repo root, which has none, it picks the project from the first
      namespace: Aoc.* in aoc/, Rogue* in games/rogue/.
    deps: [build]
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - |
        if [ "$PWD" = "{{.ROOT_DIR}}" ]; then
          case "{{.CLI_ARGS}}" in
            Aoc*) cd aoc ;;
            Rogue*) cd games/rogue ;;
          esac
        fi
        {{.SW}} audit {{.CLI_ARGS}}

  aoc:test:
    desc: "Run the AoC project's tests (results cached in aoc/.stitchwort/)"
    deps: [build]
    dir: aoc
    cmds:
      - '{{.SW}} test {{.CLI_ARGS}}'

  aoc:run:
    desc: 'Run one AoC day on its puzzle input (task aoc:run DAY=05, or YEAR=2024 DAY=01), compiled to JS'
    requires:
      vars: [DAY]
    vars:
      YEAR: '{{.YEAR | default "2025"}}'
    deps: [build]
    dir: aoc
    cmds:
      - '{{.SW}} run --js Aoc.Year{{.YEAR}}.Day{{.DAY}}.main < {{.AOC_INPUTS | default "inputs"}}/{{.YEAR}}/day{{.DAY}}.txt'

  rogue:run:
    desc: 'Play the roguelike (games/rogue/) in the terminal: arrows or h/j/k/l move, q quits'
    deps: [build]
    dir: games/rogue
    cmds:
      - '{{.SW}} run {{.CLI_ARGS}} Rogue.main'
    interactive: true

  rogue:test:
    desc: "Check the roguelike's proofs and run its tests"
    deps: [build]
    dir: games/rogue
    cmds:
      - '{{.SW}} test {{.CLI_ARGS}}'

  # ------------------------------------------------- playground and board

  web:build:
    desc: Build the playground's WebAssembly bundle into web/pkg/
    cmds:
      - ./web/build.sh

  web:pkg:
    desc: Build web/pkg/ unless it is already built from the current sources
    internal: true
    # Every input build.sh reads, directly or through the scripts it calls:
    # the Cargo workspace (manifests, sources, build scripts, target config),
    # the scripts themselves, the worker script write-version.sh hashes, and
    # the AoC and roguelike files bundle-projects.sh copies. The guide pages
    # are served, not bundled, so they are not here.
    sources:
      - Cargo.toml
      - Cargo.lock
      - .cargo/config.toml
      - crates/*/src/**/*
      - crates/**/Cargo.toml
      - crates/**/build.rs
      - web/build.sh
      - web/bundle-projects.sh
      - web/bundle-std.sh
      - web/write-version.sh
      - web/playground-worker.js
      - aoc/stitchwort.yaml
      - aoc/src/**/*.sw
      - aoc/examples/[0-9][0-9][0-9][0-9]/*.txt
      - aoc/inputs/[0-9][0-9][0-9][0-9]/*.txt
      - games/rogue/stitchwort.yaml
      - games/rogue/src/**/*.sw
    generates:
      - web/pkg/stitchwort_web_bg.wasm
      - web/pkg/stitchwort_web.js
      - web/pkg/std.bundle
      - web/pkg/version.json
      - web/pkg/projects/aoc/manifest.json
      - web/pkg/projects/rogue/manifest.json
    cmds:
      - ./web/build.sh

  web:serve:
    desc: 'Build the playground, then serve web/ at http://127.0.0.1:8000 (PORT=…; -- --no-build to skip the build)'
    interactive: true
    cmds:
      - ./web/serve.sh {{.CLI_ARGS}}

  board:serve:
    desc: 'Serve the task board at http://127.0.0.1:8020 (PORT=… for another port)'
    interactive: true
    cmds:
      - ./board/serve.sh

  vscode:install:
    desc: Package the VS Code extension and install it into VS Code
    cmds:
      - ./editors/vscode/install.sh

  # Lane checkouts (CLAUDE.md, D2193, D2200), set up by LANE_SETUP above.
  # Measured 2 Nov 2026, a release build of the workspace in a new checkout:
  # 71 s cold, 48 s from a cloned target/, 8 s through kache once another
  # checkout has built the same code. AoC check 64 s cold, 2.9 s with the
  # cloned check cache. The recipe lives here so it can change in one place.
  worktree:new:
    silent: true
    desc: 'Make a lane worktree from local main, building through kache (task worktree:new -- SW-1083: .claude/worktrees/SW-1083, branch lane/SW-1083)'
    cmds:
      - |
        set -eu
        name='{{.CLI_ARGS}}'
        [ -n "$name" ] || { echo 'usage: task worktree:new -- NAME' >&2; exit 2; }
        wt='{{.ROOT_DIR}}/.claude/worktrees/'"$name"
        git -C '{{.ROOT_DIR}}' worktree add -q -b "lane/$name" "$wt" main
        {{.LANE_SETUP}}
        echo "$wt"

  worktree:rm:
    silent: true
    desc: 'Delete a lane worktree and its branch, after merging or dropping it (task worktree:rm -- SW-1083)'
    cmds:
      - |
        set -eu
        name='{{.CLI_ARGS}}'
        [ -n "$name" ] || { echo 'usage: task worktree:rm -- NAME' >&2; exit 2; }
        git -C '{{.ROOT_DIR}}' worktree remove --force '{{.ROOT_DIR}}/.claude/worktrees/'"$name"
        git -C '{{.ROOT_DIR}}' branch -D "lane/$name"

  scratch:new:
    silent: true
    desc: 'Make a scratch clone for a DeepSeek task: from local main, no remote, building through kache (task scratch:new -- sw-1083: .claude/worktrees/scratch-sw-1083; delete with rm -rf)'
    cmds:
      - |
        set -eu
        name='{{.CLI_ARGS}}'
        [ -n "$name" ] || { echo 'usage: task scratch:new -- NAME' >&2; exit 2; }
        wt='{{.ROOT_DIR}}/.claude/worktrees/scratch-'"$name"
        git clone -q --branch main '{{.ROOT_DIR}}' "$wt"
        git -C "$wt" remote remove origin
        {{.LANE_SETUP}}
        echo "$wt"
