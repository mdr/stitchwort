# One entry per program: what the Stitchwort side runs and what every
# language is given. Everything else is found by name, in this folder:
#   <name>/main.py        CPython and PyPy
#   <name>/expected.txt   the answer all runners must print, byte for byte
#   lean/Compare/<Name>.lean   (CamelCase of <name>) the Lean program, which
#                         lakefile.toml builds as the `lean_exe` <name with _>
#
#   input      stdin for every runner, relative to the repository; default none
#   source, repeat, scale
#              instead of `input`: a scaled copy of the source file, written to
#              target/compare/inputs/ and given to every runner (`scaled_input`
#              in compare.py lists the scales)
#   args       command-line arguments for every runner
#   set        "core" (default: the original ten) or "wide" (programs added to
#              catch over-fitting to them); compare.py reports a geometric
#              mean for each and for all
#   stitchwort a function of the aoc project ("Aoc.Year2020.Day15.main", run
#              from aoc/), or a .sw file relative to the repository

[null]
stitchwort = "bench/compare/null/main.sw"

[pidigits]
stitchwort = "bench/compare/pidigits/main.sw"

[binary-trees]
stitchwort = "bench/compare/binary-trees/main.sw"

# 2020 day 15, part 2 at the puzzle's full 30,000,000 turns (14 s on `run`).
[memory-game]
input = "aoc/inputs/2020/day15.txt"
args = ["30000000"]
stitchwort = "Aoc.Year2020.Day15.main"

# 2021 day 15, both parts.
[dijkstra]
input = "aoc/inputs/2021/day15.txt"
stitchwort = "Aoc.Year2021.Day15.main"

# 2021 day 11, both parts, on the real grid tiled 2 by 2 (a 20 by 20 cavern).
# Part 2 finds the first all-flash step, 353 (part 1 is 6624), so every runner
# stops there, well inside the 10,000-step limit the programs carry. Per the
# earlier notes, a 30 by 30 cavern never flashes all at once with plain tiling
# (it would run to the limit and fail), and one that does makes `run` take
# over two minutes.
[octopus]
source = "aoc/inputs/2021/day11.txt"
repeat = 2
scale = "tile"
stitchwort = "Aoc.Year2021.Day11.main"

# 2024 day 9, both parts, the real disk map repeated 45 times with a "0"
# between copies, so files and gaps still alternate.
[disk]
source = "aoc/inputs/2024/day09.txt"
repeat = 45
scale = "join0"
stitchwort = "Aoc.Year2024.Day09.main"

# 2020 day 18, the real input repeated 180 times.
[expressions]
source = "aoc/inputs/2020/day18.txt"
repeat = 180
scale = "lines"
stitchwort = "Aoc.Year2020.Day18.main"

# 2024 day 3, the real input repeated 200 times.
[scan]
source = "aoc/inputs/2024/day03.txt"
repeat = 200
scale = "lines"
stitchwort = "Aoc.Year2024.Day03.main"

# 2020 day 19, both parts, the real rules and the real messages repeated 16
# times.
[matcher]
source = "aoc/inputs/2020/day19.txt"
repeat = 16
scale = "messages"
stitchwort = "Aoc.Year2020.Day19.main"

# 2024 day 7, both parts, the real equations repeated 150 times.
[bridge]
source = "aoc/inputs/2024/day07.txt"
repeat = 150
scale = "lines"
stitchwort = "Aoc.Year2024.Day07.main"

# Benchmarks Game spectral-norm at N = 1000: Float arithmetic over arrays.
[spectral-norm]
set = "wide"
args = ["1000"]
stitchwort = "bench/compare/spectral-norm/main.sw"

# Lean's const_fold (IFL19): reassociate and constant-fold an expression tree
# of 2^20 leaves, five rounds starting the leaf values at 1 to 5. Lean's own
# depth is 23, which needs a 4 GB stack; the native code's limit is 2M frames.
[const-fold]
set = "wide"
args = ["20", "5"]
stitchwort = "bench/compare/const-fold/main.sw"

# Lean's rbmap (IFL19): 2,000,000 inserts into a hand-written red-black tree.
[rbmap]
set = "wide"
args = ["2000000"]
stitchwort = "bench/compare/rbmap/main.sw"

# Lean's rbmap_checkpoint (IFL19): rbmap keeping every version alive, at
# 400,000 inserts (Lean's 2,000,000 would need about 20 GB natively).
[rbmap-ck]
set = "wide"
args = ["400000", "1"]
stitchwort = "bench/compare/rbmap-ck/main.sw"
